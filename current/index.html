<!doctype html>
<html lang="zh-Hant" data-layout="2" data-skin="6" data-tab="today">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>逐流 Current</title>
<meta name="description" content="老大的總控台：等你拍板的事、案子、機會、錢、生活">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#07060d">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="逐流">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<script src="js/demo.js?v121"></script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg?v=20261124d">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=20261124d">
<link rel="stylesheet" href="css/app.css?v121">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" id="fontlink" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@800&family=Inter:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
</head>
<body>
<div class="app" id="app">
  <div class="field" aria-hidden="true"><i></i></div>
  <header class="top" id="top">
    <div class="brand"><b>逐流</b><small id="stamp">讀取中</small></div>
    <button class="hav" id="hav" data-act="havtalk" data-id="daqi|" aria-label="跟大器說話"><span class="bm bf" data-b="daqi" aria-hidden="true"></span><span class="dot" hidden></span></button>
  </header>
  <div id="offline" class="offline" role="status" hidden><b aria-hidden="true">▲</b><span>離線中。</span></div>
  <main>
    <div id="view"></div>
    <section class="page" id="page" role="dialog" aria-modal="true" aria-label="詳情頁" hidden></section>
    <div class="scrim" id="scrim" data-act="close" hidden></div>
    <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sTitle" hidden></section>
    <div class="toast" id="toast" role="status" aria-live="polite"><span id="toastMsg"></span><button id="toastUndo" data-act="undo">復原</button></div>
    <div class="cscrim" id="cscrim" data-act="chatclose" hidden></div>
    <section class="chat" id="chat" role="dialog" aria-modal="true" aria-labelledby="cTitle" hidden></section>
    <button class="chead" id="chead" data-act="chathead" aria-label="跟大器說"></button>
  </main>
  <div class="dock" id="dock" hidden></div>
  <nav class="tabs" aria-label="主要分頁"><div class="tabs-in" id="tabs"></div></nav>
</div>

<script defer src="js/bot_face.js?v121"></script>
<script defer src="js/bot_voice.js?v121"></script>
<script defer src="js/app.js?v121"></script>
</body>
</html>
