<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>找不到頁面</title>
<meta name="robots" content="noindex">
<script>
// 塔塔記帳的 /kakeibo/k/金鑰/ 路徑：轉成 /kakeibo/?k=金鑰（記帳本身支援 ?k=）
(function(){var m=location.pathname.match(/^\/kakeibo\/k\/([^/]+)\/?$/);if(m){location.replace('/kakeibo/?k='+m[1]+location.hash);}})();
</script>
<style>body{margin:0;padding:40px 16px;font:16px/1.5 -apple-system,"PingFang TC",sans-serif;background:#f2f4f3;color:#1d2321;text-align:center}@media (prefers-color-scheme:dark){body{background:#111514;color:#eef2f0}}a{color:#2b7a70}</style>
</head>
<body><p>找不到這一頁。</p><p><a href="/">回到面板目錄</a></p></body>
</html>
