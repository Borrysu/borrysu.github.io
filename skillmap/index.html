<!doctype html>
<html lang="zh-Hant">
<head>

<title>技能地圖</title>
<!-- 技能操作介面：同一個網址，電腦（≥1024）三欄＋關係圖，手機單手版。資料從倉庫推到 Supabase 快照；請求寫回收件匣，Mac 轉成派工單。
     分類規則正本：倉庫 data/技能地圖手機版/分類邏輯.md；同步決定：同資料夾 同步決定.md。2026-11-22 大器（Claude）用趁手 handy 改版。 -->
<style>
:root{--bg:#f6f5f1;--card:#fff;--ink:#1d1d1b;--sub:#64635d;--line:#e2e0d8;--line2:#c9c6bb;--acc:#1f5f4a;--accbg:#e3efe9;--warn:#9a4d0c;--warnbg:#fbeedd;--mute:#efeee9;--r:12px;
 --font:-apple-system,BlinkMacSystemFont,"Noto Sans TC","Microsoft JhengHei",sans-serif;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#141413;--card:#1e1e1c;--ink:#efeee9;--sub:#a6a49c;--line:#33322e;--line2:#4a4943;--acc:#7fcdb0;--accbg:#1f3a30;--warn:#eaa865;--warnbg:#3a2a18;--mute:#262624;color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--font)}
body{overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.hidden{display:none!important}
.app{max-width:720px;margin:0 auto;padding:0 16px calc(84px + env(safe-area-inset-bottom))}
header{padding:calc(14px + env(safe-area-inset-top)) 0 4px}
h1{font-size:22px;margin:0}
.meta{color:var(--sub);font-size:13px;margin-top:2px}
.stats{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--sub);margin-top:6px}
.stats b{color:var(--ink)}
#side{position:sticky;top:0;background:var(--bg);z-index:5;padding:8px 0 2px}
.search{width:100%;padding:12px 14px;font-size:16px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:8px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:44px;padding:0 14px;border:1px solid var(--line);border-radius:22px;background:var(--card);font-size:14px}
.chip[aria-pressed="true"]{background:var(--acc);color:var(--bg);border-color:var(--acc)}
.views{display:none}
h2{font-size:14px;color:var(--sub);margin:18px 0 8px;font-weight:600}
h2 small{font-weight:400;margin-left:6px}
.grid{display:grid;grid-template-columns:1fr;gap:8px}
.card{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;min-height:56px;text-decoration:none;color:var(--ink)}
.card[aria-current="true"]{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
.card b{font-size:17px}
.card .id{color:var(--sub);font-size:13px;margin-left:6px}
.card p{margin:4px 0 0;color:var(--sub);font-size:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .foot{margin-top:6px;font-size:12px;color:var(--sub);display:flex;flex-wrap:wrap;gap:4px 10px}
.tag{display:inline-block;font-size:12px;line-height:18px;padding:0 8px;border-radius:9px;border:1px solid var(--line2);color:var(--sub);margin-left:6px;vertical-align:2px;white-space:nowrap}
.tag.act{border-color:transparent;background:var(--accbg);color:var(--acc)}
.tag.inc{border-color:transparent;background:var(--warnbg);color:var(--warn)}
.tag.auto,.tag.wait{border-style:dashed;color:var(--warn);border-color:var(--warn)}
nav#nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav#nav button{flex:1;min-height:56px;border:0;background:none;color:var(--sub);font-size:15px}
nav#nav button[aria-current="page"]{color:var(--acc);font-weight:700}
nav#nav .n{display:inline-block;min-width:18px;font-size:11px;line-height:18px;border-radius:9px;background:var(--warn);color:var(--bg);margin-left:4px;vertical-align:1px}
#backdrop{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:9}
#detail{position:fixed;left:0;right:0;bottom:0;max-height:88vh;overflow-y:auto;background:var(--card);border-radius:20px 20px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom));z-index:10;max-width:720px;margin:0 auto;transform:translateY(105%);transition:transform .22s ease;visibility:hidden}
#detail.show{transform:none;visibility:visible}
#detail h3{margin:0 44px 0 0;font-size:22px}
.close{position:absolute;right:8px;top:8px;width:44px;height:44px;border:0;background:none;font-size:24px;color:var(--sub)}
.row{margin:12px 0}
.lab{font-size:12px;color:var(--sub);margin-bottom:2px}
.links{display:flex;flex-wrap:wrap;gap:8px}
.links .chip{min-height:40px}
.acts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px}
.btn{min-height:48px;border-radius:12px;border:1px solid var(--line2);background:var(--card);font-size:15px;padding:0 8px}
.btn[aria-pressed="true"]{border-color:var(--acc);color:var(--acc);font-weight:700}
.btn.pri{background:var(--acc);color:var(--bg);border-color:var(--acc);font-weight:700}
.btn:disabled{opacity:.5;cursor:default}
.more{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.compose{margin-top:10px}
.compose .hint{font-size:13px;color:var(--sub)}
textarea{width:100%;min-height:84px;margin-top:6px;padding:10px;border:1px solid var(--line2);border-radius:12px;background:var(--bg);color:var(--ink);font:inherit}
.msg{margin:10px 0 0;font-size:14px;min-height:20px}
.msg.err{color:var(--warn)}
.req{border-top:1px solid var(--line);padding:8px 0;font-size:14px}
.req .when{color:var(--sub);font-size:12px}
.step{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);align-items:flex-start}
.num{flex:none;width:28px;height:28px;border-radius:14px;background:var(--accbg);color:var(--acc);text-align:center;line-height:28px;font-size:14px;font-weight:700}
.step button{border:0;background:none;color:var(--acc);padding:0;text-align:left;font-weight:600;min-height:28px}
.empty{padding:40px 0;text-align:center;color:var(--sub)}
.gate{padding:30px 0}
.gate input{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;font-size:16px;background:var(--card);color:var(--ink);margin:10px 0}
.note{font-size:13px;color:var(--sub);border:1px dashed var(--line2);border-radius:10px;padding:8px 12px;margin:12px 0}
/* 關係圖（只有電腦版） */
.graph{position:relative;margin-top:8px}
.graph svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.lane{display:grid;grid-template-columns:120px 1fr;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.lane .ln b{display:block;font-size:14px}
.lane .ln span{font-size:12px;color:var(--sub)}
.nodes{display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start}
.node{position:relative;min-height:40px;padding:6px 12px;border:1px solid var(--line2);border-radius:10px;background:var(--card);font-size:14px;text-align:left}
.node small{color:var(--sub);margin-left:4px}
.node.inc{border-style:dashed}
.node.dim{opacity:.28}
.node[aria-current="true"]{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc)}
.node.to{border-color:var(--acc)}
.node.from{border-color:var(--warn)}
.node .sn{position:absolute;top:-9px;right:-9px;width:22px;height:22px;border-radius:11px;background:var(--acc);color:var(--bg);font-size:12px;line-height:22px;text-align:center;font-weight:700}
.legend{font-size:12px;color:var(--sub);display:flex;flex-wrap:wrap;gap:4px 16px;margin:6px 0}
.legend i{display:inline-block;width:22px;height:0;border-top:2px solid var(--acc);vertical-align:4px;margin-right:4px}
.legend i.d{border-top:2px dashed var(--warn)}
@media (prefers-reduced-motion:reduce){#detail{transition:none}}

@media (min-width:1024px){
 .app{max-width:1440px;padding:0 24px 32px;display:grid;grid-template-columns:248px minmax(0,1fr) 380px;grid-template-rows:auto auto 1fr;gap:0 24px;
  grid-template-areas:"head head head" "nav nav nav" "side main detail"}
 header{grid-area:head;display:flex;align-items:flex-end;justify-content:space-between;gap:16px;padding-top:20px}
 .stats{margin:0}
 nav#nav{grid-area:nav;position:static;border:0;border-bottom:1px solid var(--line);background:none;padding:0;margin:10px 0 0}
 nav#nav button{flex:none;min-height:44px;padding:0 18px;border-bottom:2px solid transparent}
 nav#nav button[aria-current="page"]{border-bottom-color:var(--acc)}
 #side{grid-area:side;position:sticky;top:0;align-self:start;max-height:100vh;overflow-y:auto;padding:16px 0}
 #side .chips{flex-direction:column;overflow:visible;gap:4px}
 #side .chip{border-radius:10px;text-align:left;min-height:40px;display:flex;justify-content:space-between;align-items:center}
 #side .chips.st{flex-direction:row;flex-wrap:wrap}
 #side .chips.st .chip{flex:1 1 auto;justify-content:center}
 .views{display:flex;gap:4px;margin:0 0 4px}
 main{grid-area:main;padding-top:8px;min-width:0}
 .grid{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
 #backdrop{display:none!important}
 #detail{grid-area:detail;position:sticky;top:0;bottom:auto;left:auto;right:auto;align-self:start;max-height:100vh;transform:none;visibility:visible;transition:none;border-radius:0;border-left:1px solid var(--line);padding:16px 0 24px 20px;background:none;z-index:1;margin:0;max-width:none}
 #detail .close{display:none}
 .acts{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>
<body>
<div class="app">
 <header>
  <div><h1>技能地圖</h1><div class="meta" id="meta">載入中…</div></div>
  <div class="stats" id="stats"></div>
 </header>
 <nav id="nav" aria-label="分頁">
  <button data-t="skills" aria-current="page">技能</button>
  <button data-t="scen">情境</button>
  <button data-t="mine">我的請求</button>
  <button data-t="hub">入口</button>
 </nav>
 <aside id="side">
  <input class="search" id="q" type="search" placeholder="找技能：名字、做什麼" autocomplete="off" aria-label="找技能">
  <div class="chips st" id="stchips" role="group" aria-label="狀態"></div>

 </aside>
 <main id="main"></main>
 <div id="backdrop" class="hidden"></div>

</div>
<script>

(function(){

var $=function(s){return document.querySelector(s)};
function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
var LS={get:function(k){try{return localStorage.getItem(k)||''}catch(e){return ''}},set:function(k,v){try{localStorage.setItem(k,v)}catch(e){}},del:function(k){try{localStorage.removeItem(k)}catch(e){}}};

  {id:'eyear',zh:'耳目',layer:'IN',status:'現役',version:'v2-20261026',updated:'2026-11-18',one:'影音感知層。切點、逐字稿、四軌分離、BPM。',inp:'影片、音檔',out:'逐字稿、JSON',use:'WhisperX、Demucs',to:['splice','copybook']},

  {id:'handy',zh:'趁手',layer:'OUT',layer_src:'auto',status:'孵化',version:'20261121',updated:'2026-11-21',one:'設計並做出好用的互動介面。這條說明故意寫很長很長很長很長很長很長很長很長很長很長很長很長很長很長，用來測兩行截斷。',inp:'要給誰用',out:'HTML 原型',to:['lilt']},
  {id:'proof',zh:'校讎',layer:'QA',status:'現役',version:'20261015',updated:'2026-10-15',one:'三軌獨立查證。',inp:'成稿＋基準檔',out:'標紅清單',to:['folio']},

 sk.forEach(function(s){s.kind=s.kind||'skill';s.layer_src=s.layer_src||'set'});
 if(XSS){sk.push({id:'x"><img src=x onerror=window.__xss=1>',zh:'<img src=x onerror="window.__xss=1">',kind:'skill',layer:'CR',layer_src:'set',status:'現役',version:'<b>v</b>',one:'<script>window.__xss=1<\/script>',inp:'"><svg onload=window.__xss=1>',out:'',to:['mise']})}
 return {map:{layers:L.map(function(x){return {id:x[0],name:x[1],role:x[2]}}),skills:sk,

var MOCKC=[{id:3,skill_id:'splice',action:'change',note:'【要升級】調色段落要加 LUT 對照表',created_at:'2026-11-22T07:40:00Z',taken_at:null},

 {id:1,skill_id:'eyear',action:'confirm',note:null,created_at:'2026-11-20T09:00:00Z',taken_at:'2026-11-20T09:05:00Z'}];

function rpc(name,body){
 if(MOCK){return new Promise(function(ok){setTimeout(function(){
  if(name==='skillmap_get')ok(sample());else if(name==='skillmap_confirm_list')ok(MOCKC.slice());
  else{MOCKC.unshift({id:MOCKC.length+1,skill_id:body.p_skill_id,action:body.p_action,note:body.p_note,created_at:new Date().toISOString(),taken_at:null});ok({status:'queued'})}},150)})}
 var b=Object.assign({p_key:KEY},body||{});
 var ac=new AbortController(),t=setTimeout(function(){ac.abort()},20000);
 return fetch(API+name,{method:'POST',headers:{'content-type':'application/json',apikey:ANON},body:JSON.stringify(b),signal:ac.signal,cache:'no-store'})
  .then(function(r){clearTimeout(t);return r.json().catch(function(){return {}}).then(function(j){if(!r.ok){var e=new Error(j&&j.message||('HTTP '+r.status));e.status=r.status;throw e}return j})},
   function(e){clearTimeout(t);throw new Error(e.name==='AbortError'?'逾時，網路可能不穩':'連不上資料端')});
}

function reqLabel(c){var n=c.note||'';for(var k in REQ){if(REQ[k].pre&&n.indexOf(REQ[k].pre)===0)return REQ[k].label}return (REQ[c.action]||{}).label||c.action}

 $('#side').classList.add('hidden');$('#nav').classList.add('hidden');$('#stats').textContent='';
 var m=$('#main');m.textContent='';$('#detail').textContent='';
 var g=el('div','gate');g.appendChild(el('b','','需要金鑰'));g.appendChild(el('p','meta',msg||'貼上金鑰，這台裝置之後就不用再貼。'));

 if(!KEY&&!MOCK)return gate();

 Promise.all([rpc('skillmap_get'),rpc('skillmap_confirm_list',{p_limit:100})]).then(function(r){

  var R=REQ[k],note=ta.value.trim();
  if(k!=='confirm'&&!note){msg.className='msg err';msg.textContent='先寫內容再送';ta.focus();return}
  var all2=p.querySelectorAll('.acts button,.more button,.compose button');all2.forEach(function(b){b.disabled=true});msg.className='msg';msg.textContent='送出中…';
  rpc('skillmap_confirm',{p_skill_id:s.id,p_action:R.act,p_note:note?(R.pre||'')+note:null,p_ref_commit:S.commit}).then(function(){
   S.pending++;paintStats();msg.textContent='已送出「'+R.label+'」，Mac 會在 5 分鐘內取走、開派工單';ta.value='';
   return rpc('skillmap_confirm_list',{p_limit:100}).then(function(l){if(Array.isArray(l))S.confirms=l;var keepMsg=msg.textContent;renderDetail();var nm=$('#detail .msg');if(nm)nm.textContent=keepMsg;if(DESK.matches||S.tab==='mine')render()});
  }).catch(function(e){all2.forEach(function(b){b.disabled=false});msg.className='msg err';
   msg.textContent=(e.status===403||e.status===401)?'這把金鑰不能送請求（只有你本人的金鑰可以）':'送不出去：'+e.message+'。內容還在，網路好了再按一次。'});
 }
 p.appendChild(acts);p.appendChild(more);p.appendChild(comp);p.appendChild(msg);
}

$('#backdrop').addEventListener('click',closeSheet);
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!DESK.matches&&$('#detail').classList.contains('show'))closeSheet()});
$('#q').addEventListener('input',function(){S.q=this.value;render()});
document.querySelectorAll('#nav button').forEach(function(b){b.onclick=function(){setTab(b.dataset.t)}});
function onMode(){if(!S.map)return;closeSheet();if(DESK.matches)S.sel=S.sel;render();renderDetail()}
if(DESK.addEventListener)DESK.addEventListener('change',onMode);else DESK.addListener(onMode);
var rt;window.addEventListener('resize',function(){clearTimeout(rt);rt=setTimeout(function(){var g=$('.graph');if(g){var sc=S.tab==='scen'?(S.map.scenarios||[]).filter(function(x){return x.id===S.scn})[0]:null;drawLines(g,g.querySelector('svg'),sc)}},120)});
load();
})();
</script>
</body>
</html>
