<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#07080c">
<title>技能地圖</title>
<!-- 技能地圖・樓層版（2026-11-22 老大選定）。每一層分類是一塊浮空玻璃板，柱子高＝現役。
     資料：倉庫 push_skillmap.py → Supabase 快照；請求只寫進收件匣表，Mac 轉派工單。清單版在 list.html。
     參考（Refero）：me.sh、The Resonance、Weaviate、Solana、Pryzm、Graphy、Spatial Chat、Memotron、Kin。 -->
<link rel="stylesheet" href="shell.css?v=1">
</head>
<body>
<div id="app"><div id="stage"></div><div id="labels"></div></div>
<div id="top" class="glass"><h1>技能地圖<small id="meta">樓層</small></h1>
 <select id="scn" class="tbtn" aria-label="選情境"></select>
 <button id="play" class="tbtn pri" aria-pressed="false">播放情境</button>
 <button id="reset" class="tbtn" aria-label="回到全景">全景</button>
 <a id="tolist" class="tbtn" href="list.html">清單</a></div>
<nav id="legend" class="glass" aria-label="分層"></nav>
<aside id="panel" class="glass" aria-live="polite" aria-label="技能詳情"></aside>
<div id="caption" class="glass" role="status"></div>
<div class="hint glass">每一層是一塊玻璃板，柱子高的是現役。拖曳旋轉，滾輪或雙指縮放，點一顆看詳情。</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="concepts.js?v=1"></script>
<script src="shell.js?v=1"></script>
<script>
'use strict';
(function(){
var API='https://wbfdpuytffyaetghqkbl.supabase.co/rest/v1/rpc/';
var ANON='sb_publishable_yXl1iCBorFdHNsTl1A4UPg_MQLMYukO'; // 公開 key；私鑰只從網址或本機儲存來
var LS={get:function(k){try{return localStorage.getItem(k)||''}catch(e){return ''}},set:function(k,v){try{localStorage.setItem(k,v)}catch(e){}},del:function(k){try{localStorage.removeItem(k)}catch(e){}}};
var P=new URLSearchParams(location.search),H=new URLSearchParams(location.hash.slice(1));
var MOCK=P.get('mock')==='1',XSS=P.get('xss')==='1';
var KEY=P.get('k')||H.get('k')||LS.get('skillmap_key');
var keep=MOCK?'?mock=1'+(XSS?'&xss=1':''):'';
if(P.get('k')||H.get('k')){LS.set('skillmap_key',KEY);history.replaceState(null,'',location.pathname+keep)}
document.getElementById('tolist').href='list.html'+keep;
function rpc(name,body){
  var b=Object.assign({p_key:KEY},body||{});var ac=new AbortController(),t=setTimeout(function(){ac.abort()},20000);
  return fetch(API+name,{method:'POST',headers:{'content-type':'application/json',apikey:ANON},body:JSON.stringify(b),signal:ac.signal,cache:'no-store'})
   .then(function(r){clearTimeout(t);return r.json().catch(function(){return {}}).then(function(j){if(!r.ok){var e=new Error(j&&j.message||('HTTP '+r.status));e.status=r.status;throw e}return j})},
    function(e){clearTimeout(t);throw new Error(e.name==='AbortError'?'逾時，網路可能不穩':'連不上資料端')});
}
var mockC=null;
var api=MOCK?{send:function(b){mockC.unshift({id:Date.now(),skill_id:b.p_skill_id,action:b.p_action,note:b.p_note,created_at:new Date().toISOString(),taken_at:null});return Promise.resolve({status:'queued'})},list:function(){return Promise.resolve(mockC.slice())}}
 :{send:function(b){return rpc('skillmap_confirm',b)},list:function(){return rpc('skillmap_confirm_list',{p_limit:100})}};
function gate(msg){
  var g=document.createElement('div');g.id='gate';g.className='glass';
  var h=document.createElement('b');h.textContent='需要金鑰';g.appendChild(h);
  var p=document.createElement('div');p.className='meta';p.textContent=msg||'貼上金鑰，這台裝置之後就不用再貼。';g.appendChild(p);
  var i=document.createElement('input');i.type='password';i.placeholder='金鑰';i.setAttribute('aria-label','金鑰');g.appendChild(i);
  var b=document.createElement('button');b.className='act pri';b.textContent='進入';g.appendChild(b);
  b.onclick=function(){var v=i.value.trim();if(v){LS.set('skillmap_key',v);location.reload()}};
  i.onkeydown=function(e){if(e.key==='Enter')b.click()};document.body.appendChild(g);i.focus();
}
function load(){
  if(MOCK)return fetch('mock.json').then(function(r){return r.json()}).then(function(d){
    if(XSS)d.map.skills.push({id:'x"><img src=x onerror=window.__xss=1>',zh:'<img src=x onerror="window.__xss=1">',kind:'skill',layer:'CR',layer_src:'set',status:'現役',version:'<b>v</b>',one:'<script>window.__xss=1<\/script>',inp:'"><svg onload=window.__xss=1>',out:'',to:['mise']});
    mockC=d.confirms;return d});
  if(!KEY){gate();return Promise.resolve(null)}
  return Promise.all([rpc('skillmap_get'),rpc('skillmap_confirm_list',{p_limit:100})]).then(function(r){
    var d=r[0];if(d.empty)throw new Error('資料端還沒推地圖');d.confirms=Array.isArray(r[1])?r[1]:[];
    var m=document.getElementById('meta');m.textContent='樓層・版本 '+(d.source_commit||'');
    if(d.pending){var bd=document.createElement('span');bd.className='badge';bd.textContent=d.pending;bd.title=d.pending+' 筆請求等 Mac 取';document.getElementById('tolist').appendChild(bd)}
    return d});
}
SkillShell.init({build:SkillConcepts.floor,load:load,api:api,
  onError:function(e){if(e.status===401||e.status===403){LS.del('skillmap_key');gate('金鑰不對或失效，重貼一次。')}else{var x=document.createElement('div');x.className='fallback';x.textContent='讀不到資料：'+e.message+'。重新整理再試，或改看清單版 list.html。';document.body.appendChild(x)}}});
})();
</script>
</body>
</html>
