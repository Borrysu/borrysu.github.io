     --x-on-accent 放在 --accent 色塊上的文字色（對比 AA）；--x-atmos 頁面氛圍光（background-image）；
     --x-grain 顆粒透明度；--x-border-w 卡片外框粗細；--x-surface-solid／--x-surface2-solid 玻璃皮的實色後備；
     --x-num-weight、--x-num-track、--x-cur-scale 數字字重、字距、貨幣符號縮小比；
     --x-ring-w、--x-ring-cap、--x-ring-sweep、--x-ring-rot、--x-ring-outline 預算環；--x-bar-r 進度條圓角；
     --x-press 按下的 transform；--x-label-track 小標字距；--x-display-weight 標題字重。
   用色規則：--accent 在淺色是深焦橘（當文字與線條都過 4.5:1），鮮橘 #FF6700 只留給塔塔本體 --tata-body。

/* ===== 外觀 6｜塔塔橘｜淺（單 E 新增，20261122）=====
   主色 #FF6700 用在色塊（頁首、主卡、按鈕、進度條）：--x-accent-fill；放在橘色塊上的字用深墨 --x-on-accent-fill。
   --accent 照契約仍是可當文字的深焦橘。 */
[data-skin="6"] {

  --bg2: #FFE0C4;
  --surface: #FFFFFF;

  --warn: #734900;
  --bad: #A32417;
  --radius: 22px;
  --radius-sm: 13px;
  --shadow: 0 1px 0 rgba(255,255,255,.8) inset, 0 12px 28px -14px rgba(196,82,0,.40);

  --font-body: "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;

  --tata-body: #FA6400;
  --tata-eye: #FFFFFF;
  --blur: 0px;

  --x-border-w: 0px;
  --x-num-weight: 700;

  --x-cur-scale: .46;
  --x-ring-w: 12;
  --x-ring-cap: round;
  --x-ring-sweep: 1;
  --x-ring-rot: -90deg;
  --x-ring-outline: 0;
  --x-bar-r: 999px;
  --x-press: scale(.97);
  --x-label-track: .04em;
  --x-display-weight: 700;
  --x-grain: 0;
  --x-on-accent: #FFFFFF;
  --x-accent-fill: #FF6700;
  --x-on-accent-fill: #1F0E00;
  --x-hero-bg: linear-gradient(135deg, #FF7A1A 0%, #FF6700 55%, #F25C00 100%);
  --x-hero-ink: #1F0E00;
  --x-atmos: radial-gradient(110% 46% at 50% 0%, rgba(255,103,0,.22) 0%, rgba(255,103,0,0) 70%);
  --x-surface-solid: #FFFFFF;
  --x-surface2-solid: #FFEBD8;
}

/* ===== 共用小工具（可不用） ===== */
.tk-num { font-family: var(--font-num); font-variant-numeric: tabular-nums lining-nums; font-weight: var(--x-num-weight, 700); letter-spacing: var(--x-num-track, 0); white-space: nowrap; }
.tk-atmos { background-color: var(--bg); background-image: var(--x-atmos, none); background-repeat: no-repeat; }
.tk-card { background: var(--surface); border: var(--x-border-w, 1px) solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
@supports ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
  .tk-card { -webkit-backdrop-filter: blur(var(--blur)) saturate(1.2); backdrop-filter: blur(var(--blur)) saturate(1.2); }
}
@supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
  .tk-card { background: var(--x-surface-solid, var(--surface)); }
}
.tk-move { transition: transform var(--motion-dur) var(--motion-ease), opacity var(--motion-dur) var(--motion-ease); }
@media (prefers-reduced-motion: reduce) {
  .tk-move { transition: opacity 120ms linear; }
}

/* 塔塔記帳 E 版「原版進化」：骨架尺寸照原版（頂列 48、期別列 46、底部分頁 56、中間鍵 50、外殼最寬 520），顏色全吃 themes.css 契約變數 */
html,[data-skin]{
  --fill:var(--x-accent-fill,var(--accent));--onfill:var(--x-on-accent-fill,var(--x-on-accent,#fff));
  --hero:var(--x-hero-bg,var(--x-surface-solid,var(--surface)));--heroink:var(--x-hero-ink,var(--ink));
  --solid:var(--x-surface-solid,var(--surface));--solid2:var(--x-surface2-solid,var(--surface2));
  --dur:min(var(--motion-dur,260ms),400ms);--ease:var(--motion-ease,cubic-bezier(.2,.7,.2,1));
  --sab:env(safe-area-inset-bottom,0px);--sat:env(safe-area-inset-top,0px)
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none;-webkit-text-size-adjust:100%}
body{background-color:var(--bg);background-image:var(--x-atmos,none);background-repeat:no-repeat;color:var(--ink);font:16px/1.4 var(--font-body);position:fixed;inset:0;width:100%}
button,input,select,textarea{font:inherit;color:inherit;border:0;background:none;margin:0;touch-action:manipulation}
button{cursor:pointer;padding:0}
[hidden]{display:none!important}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums lining-nums;font-weight:var(--x-num-weight,700);letter-spacing:var(--x-num-track,0);white-space:nowrap}
.mut{color:var(--muted)}
.vh{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.skip{position:absolute;left:-9999px;top:4px;z-index:999;min-width:44px;min-height:44px;padding:10px 14px;border-radius:10px;background:var(--solid);color:var(--ink);font-weight:700}
.skip:focus{left:8px}
:focus-visible{outline:3px solid var(--accent2);outline-offset:2px}
svg.i{width:22px;height:22px;display:block;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
button:active,.press:active{transform:var(--x-press,scale(.97))}
button{transition:transform 90ms linear,background-color 120ms linear,opacity 120ms linear}

#shell{position:fixed;inset:0;display:flex;flex-direction:column;max-width:520px;margin:0 auto;background-color:var(--bg);background-image:var(--x-atmos,none);background-repeat:no-repeat}
/* ---- 頂列（位置照原版：左 ↻ 與塔塔、中標題與連線燈、右顯示作廢） ---- */
#top{flex:none;background:var(--fill);color:var(--onfill);padding-top:var(--sat);z-index:30}
.bar{height:48px;display:grid;grid-template-columns:96px 1fr 96px;align-items:center;padding:0 4px}
.bar h1{margin:0;font:var(--x-display-weight,700) 18px/1.4 var(--font-display);text-align:center;white-space:nowrap}
#live{display:inline-block;width:8px;height:8px;border-radius:4px;border:1.5px solid currentColor;margin-left:6px;vertical-align:middle;opacity:.55;transition:opacity .3s,background-color .3s}
#live.on{background:currentColor;opacity:1}
.hl{display:flex;align-items:center}
.hbtn{height:44px;min-width:44px;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:600;color:inherit}
#refresh{font-size:22px;padding-left:6px}
#refresh.spin span{display:block;animation:kkspin .8s linear infinite}
@keyframes kkspin{to{transform:rotate(360deg)}}
.hr{display:flex;justify-content:flex-end}
#showvoid{flex:1;justify-content:flex-end;padding-right:6px}
#showvoid span{height:30px;line-height:27px;padding:0 11px;border:1.5px solid currentColor;border-radius:15px;font-size:13px;white-space:nowrap}
#showvoid[aria-pressed=true] span{background:var(--onfill);color:var(--fill)}
#gear{width:44px;margin-right:2px}
.tt{flex:none;width:44px;height:44px;margin-left:2px;display:grid;place-items:center;border-radius:50%;position:relative}
.tt i{width:36px;height:36px;border-radius:50%;background:var(--solid);display:grid;place-items:center;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.tt .badge{position:absolute;top:2px;right:0;min-width:18px;height:18px;padding:0 4px;border-radius:9px;background:var(--ink);color:var(--bg);font:700 11px/18px var(--font-num);text-align:center}
.pnav{height:46px;background:var(--solid);display:grid;grid-template-columns:56px 1fr 56px;align-items:center;border-bottom:1px solid var(--line);color:var(--ink)}
.pnav button{height:46px;font-size:26px;color:var(--accent);font-weight:300}
.pnav button:disabled{opacity:.3}
.pnav .pl{text-align:center;font-size:17px;font-weight:700;white-space:nowrap}
.pnav .pl em{font-style:normal;font-size:12px;font-weight:700;color:var(--onfill);background:var(--fill);border-radius:8px;padding:2px 7px;margin-left:8px;vertical-align:2px}
.pnav .pl em.old{background:var(--muted);color:var(--bg)}
/* ---- 捲動區與分頁轉場 ---- */
#scroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding-bottom:24px}
#app>section{padding:10px 12px 0}
.in-r{animation:inR var(--dur) var(--ease) both}.in-l{animation:inL var(--dur) var(--ease) both}.in-f{animation:inF var(--dur) var(--ease) both}
@keyframes inR{from{opacity:0;transform:translateX(18px)}}
@keyframes inL{from{opacity:0;transform:translateX(-18px)}}
@keyframes inF{from{opacity:0;transform:translateY(8px)}}
.stg>*{animation:inF var(--dur) var(--ease) both}
.stg>*:nth-child(2){animation-delay:30ms}.stg>*:nth-child(3){animation-delay:60ms}.stg>*:nth-child(4){animation-delay:90ms}.stg>*:nth-child(5){animation-delay:120ms}.stg>*:nth-child(6){animation-delay:150ms}.stg>*:nth-child(7){animation-delay:180ms}.stg>*:nth-child(n+8){animation-delay:210ms}
.card{background:var(--surface);border:var(--x-border-w,1px) solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
@supports ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.card{-webkit-backdrop-filter:blur(var(--blur));backdrop-filter:blur(var(--blur))}}
.card+.card,.card+.gh,.gh+.card{margin-top:10px}
/* ---- 記帳本：確認列、主卡、回報 ---- */
.rv{display:flex;align-items:center;gap:10px;width:100%;min-height:52px;padding:6px 14px;margin-bottom:10px;border-radius:var(--radius);background:var(--solid2);border:var(--x-border-w,1px) solid var(--line);text-align:left;font-weight:700}
.rv .dotf{flex:none;width:30px;height:30px;border-radius:50%;background:var(--tata-body);position:relative}
.rv .dotf::before,.rv .dotf::after{content:"";position:absolute;top:9px;width:5px;height:12px;border-radius:3px;background:var(--tata-eye,#fff)}
.rv .dotf::before{left:9px}.rv .dotf::after{right:9px;height:8px;top:11px}
.rv b{font:700 20px/1 var(--font-num);color:var(--accent);margin:0 2px}
.rv .t{flex:1;min-width:0}
.chev{flex:none;color:var(--muted);font-size:20px;line-height:1}
.hero{background:var(--hero);color:var(--heroink);border-radius:var(--radius);box-shadow:var(--shadow);border:var(--x-border-w,0px) solid var(--line);position:relative;overflow:hidden}
.hero_main{display:block;width:100%;text-align:left;padding:14px 60px 6px 18px;color:inherit}
.hero .k{font-size:13px;font-weight:600;letter-spacing:var(--x-label-track,0)}
.hero .big{font-size:44px;line-height:1.1;margin-top:2px}
.hero .big small{font-size:calc(44px*var(--x-cur-scale,.46));font-weight:600;margin-right:4px}
.eyeb{position:absolute;top:4px;right:6px;width:44px;height:44px;display:grid;place-items:center;color:inherit;border-radius:50%}
.goalbar{display:block;width:100%;padding:8px 18px 4px;color:inherit}
.gb{height:8px;border-radius:var(--x-bar-r,4px);background:color-mix(in srgb,currentColor 20%,transparent);overflow:hidden;position:relative}
.gb i{display:block;height:100%;width:100%;border-radius:inherit;background:currentColor;transform-origin:0 50%;transform:scaleX(var(--p,0));transition:transform 600ms var(--ease)}
.hero:not(.fillhero) .gb i{background:var(--fill)}
.gb_m{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;margin-top:5px;font-weight:600}
.tray_h{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:44px;color:inherit;font-size:12.5px;font-weight:600}
.tray_h .car{display:inline-block;transition:transform var(--dur) var(--ease)}
.hero.open .tray_h .car{transform:rotate(180deg)}
.tray{display:grid;grid-template-rows:0fr;transition:grid-template-rows var(--dur) var(--ease)}
.hero.open .tray{grid-template-rows:1fr}
.tray>div{overflow:hidden;min-height:0}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 12px 12px;visibility:hidden}
.hero.open .tiles{visibility:visible}
.tile{background:var(--solid);color:var(--ink);border-radius:var(--radius-sm);padding:10px 12px;text-align:left;min-height:64px;display:flex;flex-direction:column;justify-content:center;position:relative}
.tile .k{font-size:12.5px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:4px}
.tile b{font-size:19px;margin-top:2px}
.tile.w2{grid-column:1/-1}
.seg{display:inline-flex;background:var(--bg);border-radius:10px;padding:2px}
.seg button{min-height:44px;padding:0 12px;border-radius:8px;font-size:12.5px;font-weight:700;color:var(--muted);white-space:nowrap}
.seg button.on{background:var(--solid);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.18)}
.tile .seg{margin-top:6px;align-self:flex-start}
.rp{display:flex;align-items:center;gap:10px;width:100%;min-height:52px;padding:8px 14px;margin-top:10px;text-align:left}
.rp .ic{flex:none;width:30px;height:30px;border-radius:10px;background:var(--solid2);display:grid;place-items:center;color:var(--accent)}
.rp .t{flex:1;min-width:0;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rp .w{font-size:12px;color:var(--muted);display:block}
.spin{display:inline-block;width:12px;height:12px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:kkspin .8s linear infinite;vertical-align:-1px;margin-right:6px}
.srch{display:flex;align-items:center;gap:8px;margin-top:10px;height:44px;padding:0 12px;border-radius:var(--radius-sm);background:var(--solid2);color:var(--muted)}
.srch input{flex:1;min-width:0;height:44px;font-size:16px;color:var(--ink);outline:0}
.srch input::placeholder{color:var(--muted);opacity:1}
.srch button{width:44px;height:44px;margin-right:-12px;color:var(--muted);font-size:18px}
/* ---- 清單 ---- */
.gh{display:flex;justify-content:space-between;align-items:center;min-height:36px;padding:6px 6px 4px;color:var(--muted);font-size:13px;font-weight:600;gap:8px}
.gh b{color:var(--ink);font-weight:700;font-size:15px;margin-right:6px}
.gh .num{font-size:13px;font-weight:600}
.gh .up{color:var(--good)}
.rows{background:var(--surface);border:var(--x-border-w,1px) solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.tx{display:flex;align-items:center;gap:12px;min-height:60px;padding:8px 14px;width:100%;text-align:left;color:var(--ink)}
.swr{position:relative;overflow:hidden;border-bottom:1px solid var(--line)}
.rows>.swr:last-child,.rows>.tx:last-child{border-bottom:0}
.rows>.tx{border-bottom:1px solid var(--line)}
.swc{position:relative;z-index:1;background:var(--solid);touch-action:pan-y}
.swact{position:absolute;top:0;right:0;bottom:0;width:84px;display:flex;visibility:hidden}
.swr.drag .swact,.swr.open .swact{visibility:visible}
.swbtn{flex:1;background:var(--bad);color:var(--bg);font-size:15px;font-weight:700}
.swbtn.ok{background:var(--good)}
.ico{flex:none;width:40px;height:40px;border-radius:14px;display:grid;place-items:center;font-size:21px;background:color-mix(in srgb,var(--c,var(--muted)) 20%,var(--solid))}
.mid{flex:1;min-width:0}
.ttl{font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.marks{display:flex;gap:5px;align-items:center;margin-top:3px;min-height:8px}
.mk{width:8px;height:8px;border-radius:50%;background:var(--c,var(--muted))}
.mk.sq{border-radius:2px}
.mk.rg{background:none;border:2px solid var(--accent)}
.right{flex:none;text-align:right;max-width:48%}
.amt{font-size:17px;white-space:nowrap}
.amt.income{color:var(--good)}.amt.transfer,.amt.reimbursement{color:var(--muted)}
.tx.void .ttl,.tx.void .amt{text-decoration:line-through;color:var(--muted)}
.tx.pend .amt{font-style:italic}
.empty{padding:30px 20px;text-align:center;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:180px}
.empty .em{font-size:38px}.empty b{color:var(--ink);font-size:16px}.empty span{font-size:13.5px}
/* ---- 統計 ---- */
.utabs{display:grid;grid-template-columns:1fr 1fr;background:var(--solid);border-radius:var(--radius-sm);overflow:hidden;border:var(--x-border-w,1px) solid var(--line);margin-bottom:10px}
.utabs button{height:44px;font-size:15px;color:var(--muted);position:relative;font-weight:700}
.utabs button.on{color:var(--accent)}
.utabs button.on::after{content:"";position:absolute;left:18%;right:18%;bottom:0;height:3px;border-radius:2px;background:var(--fill)}
.utabs button .n{font:700 12px/1 var(--font-num);margin-left:4px;padding:2px 6px;border-radius:8px;background:var(--solid2);color:var(--ink)}
.cmp{display:flex;align-items:center;gap:12px;padding:12px 14px;width:100%;text-align:left}
.cmp .bars{flex:1;min-width:0;display:grid;gap:6px}
.cmp .b{display:grid;grid-template-columns:34px 1fr auto;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);font-weight:600}
.cmp .b i{display:block;height:10px;border-radius:5px;background:var(--fill);transform-origin:0 50%;animation:growX 600ms var(--ease) both;width:calc(var(--w)*1%)}
.cmp .b.p i{background:var(--muted);opacity:.55}
.cmp .b .num{color:var(--ink);font-size:13px}

.pick{display:grid;grid-template-columns:1fr 1fr 1fr;text-align:center;border-top:1px solid var(--line);padding:10px 0}

.tbl{width:100%;border-collapse:collapse;font-size:14.5px}

details.more>summary{list-style:none;min-height:44px;display:flex;align-items:center;justify-content:center;gap:6px;font-size:13px;font-weight:700;color:var(--muted);cursor:pointer;border-top:1px solid var(--line)}

.bsum{display:flex;align-items:center;gap:14px;padding:14px;width:100%;text-align:left}

/* ---- 帳戶 ---- */

.inf svg{transition:transform var(--dur) var(--ease)}
.inf[aria-expanded=true] svg{transform:rotate(180deg)}
.mv{flex:none;width:44px;height:44px;border-radius:12px;background:var(--solid2);color:var(--ink);font-size:15px;margin-right:6px}

.hdl{flex:none;width:44px;height:44px;display:grid;place-items:center;color:var(--muted);cursor:grab;touch-action:none}

.xp{padding:0 14px 10px 66px;animation:inF var(--dur) var(--ease) both}

.hrow{display:flex;justify-content:space-between;gap:10px;padding:8px 14px 8px 66px;border-top:1px dashed var(--line);font-size:13.5px;width:100%;text-align:left;color:var(--ink);min-height:48px;align-items:center}

.tabbar{flex:none;z-index:20;background:var(--solid);border-top:1px solid var(--line);padding-bottom:var(--sab)}
.tabbar .in{height:56px;display:grid;grid-template-columns:1fr 1fr 76px 1fr 1fr;align-items:center}
.tb{height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;color:var(--muted);font-weight:600;position:relative}

.tb.on::before{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--fill);animation:growX var(--dur) var(--ease) both}

/* ---- 提示 ---- */

.sheet{position:fixed;left:0;right:0;bottom:0;z-index:110;margin:0 auto;max-width:520px;max-height:94vh;display:flex;flex-direction:column;background:var(--bg);border-radius:18px 18px 0 0;transform:translateY(105%);visibility:hidden;transition:transform var(--dur) var(--ease),visibility var(--dur);overflow:hidden}

.amtbox{flex:none;display:flex;flex-direction:column;align-items:flex-end;justify-content:center;padding:6px 20px;min-height:82px;background:var(--solid);border-bottom:1px solid var(--line);position:relative}

.amtbox.pulse{animation:pulse .9s ease}

.sh_body{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:10px 12px 8px;-webkit-overflow-scrolling:touch}

.chiprow{display:flex;align-items:center;gap:8px;margin-top:8px;overflow-x:auto;scrollbar-width:none}

.keypad{flex:none;padding:8px 12px calc(10px + var(--sab));background:var(--bg2);border-top:1px solid var(--line)}

.dupq{margin:0 0 8px;padding:10px 12px;border-radius:12px;background:var(--solid);border:2px solid var(--warn);font-size:14px;animation:inF var(--dur) var(--ease) both}

<script>
/*!
 * tata_face.js  塔塔的臉（設計提案版 1122-A）
 * 單檔、零依賴。照 Grok Bot 內建頭像規格：blob（球體）、orange #FF6700、
 * 兩隻挖空直立膠囊眼、沒有嘴、沒有腮紅、沒有配件。
 *
 * 用法：
 *   var face = TataFace.mount(el, { mood: 'idle', size: 64, reduceMotion: undefined });
 *   face.setMood('over');            // idle logged over poke sleepy thinking alert
 *   face.setMood('logged', { label: '+1' });  // 入帳數字（64px 以上才顯示）
 *   face.poke();                     // spin、bounce、nod 隨機一種
 *   face.destroy();
 *
 * 顏色：CSS 變數 --tata-body（預設 #FF6700）、--tata-eye（預設不填，眼睛挖空透出底色）。
 * 其他選項（都可不給）：shadow（地面影子）、followPointer（視線跟游標）、label（aria 名稱）。
 * logged 與 poke 是一次性動作，播完回到上一個常駐 mood。
 */
(function (root) {
  'use strict';

  var R = 44;                 // 球半徑（viewBox 單位，viewBox 是 -50 -50 100 100）
  var SEP = 17;               // 兩眼各離臉中心的角度
  var NS = 'http://www.w3.org/2000/svg';
  var PI = Math.PI, D2R = PI / 180;
  var MOOD_LIST = ['idle', 'logged', 'over', 'poke', 'sleepy', 'thinking', 'alert'];
  var MOOD_NAME = {
    idle: '待機', logged: '記帳成功', over: '超支', poke: '被點',
    sleepy: '想睡', thinking: '端詳', alert: '帳單將到期'
  };

  /* ---------- 小工具 ---------- */
  function clamp(x, a, b) { return x < a ? a : x > b ? b : x; }
  function ss(a, b, x) { var k = clamp((x - a) / (b - a), 0, 1); return k * k * (3 - 2 * k); }
  function ease(k) { return k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2; }
  function easeOut(k) { return 1 - Math.pow(1 - k, 3); }
  // 梯形包絡：a 到 b 升起，c 到 d 落下
  function bump(a, b, c, d, x) { return ss(a, b, x) * (1 - ss(c, d, x)); }
  // 眨眼：0.10 秒閉、0.16 秒開，合計 0.26 秒（k 可放慢）
  function blink(t, t0, k) {
    k = k || 1;
    var x = (t - t0) / k;
    if (x <= 0 || x >= 0.26) return 0;
    return x < 0.10 ? ease(x / 0.10) : 1 - ease((x - 0.10) / 0.16);
  }
  function blinks(t, list, k) {
    var m = 0;
    for (var i = 0; i < list.length; i++) { var v = blink(t, list[i], k); if (v > m) m = v; }
    return m;
  }
  function wrap180(a) { a = ((a + 180) % 360 + 360) % 360 - 180; return a; }

  /* ---------- 眼形：[寬, 高, 上下彎, 左右彎, 傾斜度, 下移]，單位是球半徑 ---------- */
  var EYE = {
    neutral: [0.21, 0.46, 0, 0, 0, 0],          // 直立膠囊
    happy:   [0.36, 0.15, 0.13, 0, 0, -0.02],   // 上彎弧
    sad:     [0.20, 0.36, 0, 0, 16, 0.05],      // 略斜下
    sleepy:  [0.36, 0.09, -0.10, 0, 0, 0.06],   // 下彎細弧
    wide:    [0.34, 0.46, 0, 0, 0, 0],          // 睜大變圓
    big:     [0.27, 0.54, 0, 0, 0, 0],          // 端詳：大的那隻
    small:   [0.17, 0.30, 0, 0, 0, 0.02],       // 端詳：小的那隻
    calm:    [0.20, 0.26, 0, 0, 0, 0.02]        // 半開
  };
  function mixEye(a, b, k) {
    if (k <= 0) return a; if (k >= 1) return b;
    var o = [];
    for (var i = 0; i < 6; i++) o[i] = a[i] + (b[i] - a[i]) * k;
    return o;
  }

  // 眼形輪廓：圓角矩形（膠囊）沿周長等距取 48 點，再做彎曲與傾斜。
  // 任何兩種眼形都是同一組參數插值，所以切換是連續變形，不硬換。
  var NPTS = 48;
  function eyePath(e, side, scale) {
    var w = Math.max(e[0], 0.02) * scale, h = Math.max(e[1], 0.02) * scale;
    var hw = w / 2, hh = h / 2, r = Math.min(hw, hh), sx = hw - r, sy = hh - r;
    var q = PI * r / 2, per = 4 * sx + 4 * sy + 4 * q;
    var by = e[2] * scale, bx = e[3] * scale * side;
    var rot = -side * e[4] * D2R, cr = Math.cos(rot), sr = Math.sin(rot);
    var dy = e[5] * scale, d = '';
    for (var i = 0; i < NPTS; i++) {
      var s = per * i / NPTS, x, y, a;
      if (s < sx) { x = s; y = -hh; }
      else if ((s -= sx) < q) { a = -PI / 2 + s / r; x = sx + r * Math.cos(a); y = -sy + r * Math.sin(a); }
      else if ((s -= q) < 2 * sy) { x = hw; y = -sy + s; }
      else if ((s -= 2 * sy) < q) { a = s / r; x = sx + r * Math.cos(a); y = sy + r * Math.sin(a); }
      else if ((s -= q) < 2 * sx) { x = sx - s; y = hh; }
      else if ((s -= 2 * sx) < q) { a = PI / 2 + s / r; x = -sx + r * Math.cos(a); y = sy + r * Math.sin(a); }
      else if ((s -= q) < 2 * sy) { x = -hw; y = sy - s; }
      else if ((s -= 2 * sy) < q) { a = PI + s / r; x = -sx + r * Math.cos(a); y = -sy + r * Math.sin(a); }
      else { s -= q; x = -sx + s; y = -hh; }
      var nx = x / hw, ny = y / hh;
      y += by * (nx * nx - 0.3333);
      x += bx * (ny * ny - 0.3333);
      var X = x * cr - y * sr, Y = x * sr + y * cr + dy;
      d += (i ? 'L' : 'M') + X.toFixed(4) + ' ' + Y.toFixed(4);
    }
    return d + 'Z';
  }

  /* ---------- 姿勢 ---------- */
  // yaw 左右轉、pitch 上下、roll 歪頭（度）；gx gy 視線；sq 垂直擠壓；ty 位移（半徑倍數，負的往上）；
  // sc 整體縮放；lid 眼皮（1 全閉）；glow 光暈；tok 入帳小點進度；lab 入帳數字進度；L R 兩眼眼形。
  var BASE = { yaw: 22, pitch: 21, roll: 24 };
  function pose(o) {
    var p = { yaw: BASE.yaw, pitch: BASE.pitch, roll: BASE.roll, gx: 0, gy: 0, sq: 1, ty: 0, sc: 1,
      lid: 0, glow: 0, tok: 0, lab: 0, L: EYE.neutral, R: EYE.neutral };
    for (var k in o) p[k] = o[k];
    return p;
  }
  var NUM = ['yaw', 'pitch', 'roll', 'gx', 'gy', 'sq', 'ty', 'sc', 'lid', 'glow'];
  function lerpPose(a, b, k) {
    var p = { tok: b.tok, lab: b.lab };
    for (var i = 0; i < NUM.length; i++) {
      var n = NUM[i], av = a[n];
      if (n === 'yaw') av = b.yaw + wrap180(av - b.yaw);   // 走最短的那一邊，轉圈後不會倒轉回來
      p[n] = av + (b[n] - av) * k;
    }
    p.L = mixEye(a.L, b.L, k); p.R = mixEye(a.R, b.R, k);
    return p;
  }

  /* ---------- 七個 mood ---------- */
  var W16 = 2 * PI / 16;
  var MOODS = {
    // 待機：16 秒大循環＝6 秒＋4 秒＋6 秒三小段（對應 Grok Bot Idle_A、Idle_B、Idle_D），
    // 所有週期都整除 16 秒，頭尾接得起來。呼吸 4 秒一輪。
    idle: {
      loop: 16, still: 0.3,
      fn: function (t) {
        var yaw = 14 + 19 * Math.sin(W16 * t) + 7 * Math.sin(3 * W16 * t + 1.3);
        var g = bump(9.0, 9.35, 10.1, 10.5, t);          // 第 9 秒往左下瞄一眼
        var b = Math.sin(2 * PI * t / 4);
        return pose({
          yaw: yaw,
          pitch: 20 + 8 * Math.sin(2 * W16 * t + 0.6) + 3 * Math.sin(5 * W16 * t),
          roll: 8 + 0.65 * yaw,
          gx: 0.25 * Math.sin(2 * W16 * t + 2.1) - 1.3 * g,
          gy: 0.2 * Math.sin(3 * W16 * t) - 0.9 * g,
          sq: 1 + 0.016 * b, ty: -0.006 * b,
          // 不等距眨眼；12.07 與 12.37 是連眨
          lid: blinks(t, [1.16, 4.0, 8.2, 10.59, 12.07, 12.37, 14.25])
        });
      }
    },

    // 記帳成功：一顆小點落進身體，吞一下，小跳，眼睛上彎。2.3 秒，播完回常駐 mood。
    logged: {
      dur: 2.3, still: 1.5,
      fn: function (t) {
        var up = ss(0, 0.2, t) - ss(0.36, 0.6, t);
        var hap = ss(0.36, 0.64, t) * (1 - ss(1.95, 2.25, t));
        var hop = (t > 0.62 && t < 1.12) ? Math.sin(PI * (t - 0.62) / 0.5) : 0;
        var e = mixEye(mixEye(EYE.neutral, EYE.wide, ss(0, 0.15, t) * (1 - ss(0.36, 0.6, t))), EYE.happy, hap);
        return pose({
          yaw: 22 - 14 * hap, pitch: 21 + 16 * up - 3 * hap, roll: 24 - 18 * hap,
          sq: 1 - 0.09 * bump(0.36, 0.46, 0.5, 0.62, t) + 0.03 * hop
            - 0.08 * bump(1.10, 1.17, 1.2, 1.4, t) + 0.02 * bump(1.4, 1.5, 1.55, 1.75, t),
          ty: -0.24 * hop,
          tok: clamp(t / 0.38, 0, 1),
          lab: clamp((t - 0.5) / 1.3, 0, 1),
          L: e, R: e
        });
      }
    },

    // 超支：眼睛斜下、身體縮一點、整體慢一拍（呼吸 7 秒、眨眼放慢），每輪嘆一口氣再抬頭看你一眼。
    over: {
      loop: 7, still: 0.5,
      fn: function (t) {
        var s = bump(4.2, 4.8, 5.4, 5.9, t);
        var look = bump(5.9, 6.2, 6.5, 6.9, t);
        return pose({
          yaw: 6 + 6 * Math.sin(2 * PI * t / 7), pitch: -8 + 2 * Math.sin(4 * PI * t / 7) + 16 * look,
          roll: 4, gy: -0.3 + 0.5 * look,
          sc: 0.94, sq: 0.975 + 0.012 * Math.sin(2 * PI * t / 7) - 0.035 * s, ty: 0.04 + 0.02 * s,
          lid: blinks(t, [2.8, 6.55], 1.4),
          L: EYE.sad, R: EYE.sad
        });
      }
    },

    // 想睡（深夜）：眼睛下彎細弧、呼吸 8 秒一輪、頭慢慢垂下去，點一下頭驚醒，一隻眼半開又闔上。
    sleepy: {
      loop: 8, still: 1,
      fn: function (t) {
        var drop = ss(5.6, 6.5, t) * (1 - ss(6.5, 6.62, t));
        var peek = ss(6.6, 6.75, t) * (1 - ss(7.3, 7.8, t));
        return pose({
          yaw: 10, pitch: -10 - 4 * Math.sin(2 * PI * t / 8) - 12 * drop, roll: 14 + 6 * drop,
          sq: 1 + 0.03 * Math.sin(2 * PI * t / 8) + 0.02 * peek, ty: 0.03 + 0.03 * drop,
          L: EYE.sleepy, R: mixEye(EYE.sleepy, EYE.calm, peek)
        });
      }
    },

    // 端詳：一大一小，歪頭看一邊，再透過一次眨眼（0.35 秒）換邊。4.8 秒一輪。
    thinking: {
      loop: 4.8, still: 1,
      fn: function (t) {
        var s = ss(2.0, 2.4, t) - ss(4.4, 4.8, t);
        return pose({
          yaw: 18 - 30 * s, pitch: 25 + 2 * Math.sin(2 * PI * t / 2.4), roll: 14 - 24 * s,
          gy: 0.5, sq: 1.01,
          lid: 0.85 * blinks(t, [2.03, 4.43], 1.35),
          L: mixEye(EYE.big, EYE.small, s), R: mixEye(EYE.small, EYE.big, s)
        });
      }
    },

    // 帳單將到期：眼睛睜大瞄向右上，身體拉高，每 3.2 秒連跳兩下帶光暈，接一次連眨。
    alert: {
      loop: 3.2, still: 0.9,
      fn: function (t) {
        var pu = bump(0, 0.12, 0.14, 0.34, t) + bump(0.38, 0.5, 0.52, 0.72, t);
        return pose({
          yaw: 23, pitch: 27, roll: 22, gx: 0.4, gy: 0.5,
          sq: 1.03 + 0.03 * pu, sc: 1 + 0.05 * pu, ty: -0.05 * pu,
          glow: ss(0, 0.12, t) * (0.25 + 0.75 * Math.exp(-2.4 * t)),
          lid: blinks(t, [1.9, 2.2]),
          L: EYE.wide, R: EYE.wide
        });
      }
    },

    // 被點的三種反應
    poke_spin: {
      dur: 1.0, still: 0.5,
      fn: function (t) {
        var e = mixEye(EYE.neutral, EYE.happy, bump(0.05, 0.2, 0.8, 1.0, t));
        return pose({
          yaw: BASE.yaw + 360 * ease(clamp(t / 0.85, 0, 1)),
