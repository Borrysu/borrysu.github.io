<!doctype html>
<html lang="zh-Hant" data-skin="1" data-theme="light" data-variant="A">
<head><meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>塔塔記帳｜三種版樣原型（設計提案，假資料）</title>
<style>
/* 後備值：themes.css 沒載到時仍看得見。:where 權重為零，不會蓋過 themes.css。 */
:where(html){--bg:#fff;--bg2:#f6f6f4;--surface:#fff;--surface2:#f2f2f0;--ink:#111;--ink2:#333;--muted:#666;--line:#e4e4e0;--accent:#FF6700;--accent2:#111;--good:#1a7f4e;--warn:#a85b00;--bad:#c62828;--radius:18px;--radius-sm:10px;--shadow:0 8px 30px rgba(0,0,0,.08);--font-display:system-ui,"Noto Sans TC",sans-serif;--font-body:system-ui,"Noto Sans TC",sans-serif;--font-num:system-ui,sans-serif;--tata-body:#FF6700;--tata-eye:#fff;--blur:0px;--motion-ease:cubic-bezier(.2,.7,.2,1);--motion-dur:240ms}
:where(html){--on-accent:#111;--on-bad:#fff;--dur:min(var(--motion-dur),400ms)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow:hidden;display:flex;flex-direction:column;-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
h1,h2,h3,p{margin:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums}
.amt{white-space:nowrap;font-family:var(--font-num);font-variant-numeric:tabular-nums}
.amt i{font-style:normal;font-size:calc(var(--x-cur-scale,.56)*1em);color:var(--muted);margin-right:.12em;font-weight:500}
.amt b{font-weight:inherit}
.masked .amt b{color:transparent;background:var(--line);border-radius:6px}
.vh{position:absolute;left:-9999px;display:inline-block;min-width:44px;min-height:44px}

/* 原型控制列（不是 App 的一部分） */
.pbar{flex:none;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;padding:4px 8px;background:var(--surface2);border-bottom:1px solid var(--line);font-size:13px;z-index:5}
.pbar .grp{display:flex;align-items:center;gap:4px}
.pbar .lab{color:var(--muted);margin-right:2px;font-size:12px}
.pbar button,.pbar select{min-width:44px;height:44px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:0 10px}
.pbar button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pbar select{max-width:104px;padding:0 4px}
.pbar #ptT{margin-left:6px}
.pbar .sp{flex:1}
.pbar.min .hideable{display:none}

.stage{flex:1;min-height:0;display:flex;justify-content:center;align-items:stretch}
.aside{display:none}
.phone{position:relative;width:100%;max-width:520px;height:100%;overflow:hidden;background-color:var(--bg);background-image:var(--x-atmos,linear-gradient(180deg,var(--bg2),var(--bg) 220px));background-repeat:no-repeat;isolation:isolate}
.app{height:100%;display:flex;flex-direction:column}

/* 頁首 */
.hd{flex:none;display:flex;align-items:center;gap:10px;padding:calc(8px + env(safe-area-inset-top)) 12px 8px}
.tata-btn{flex:none;width:52px;height:52px;border:0;background:none;padding:0;border-radius:50%;display:grid;place-items:center;transition:transform var(--dur) var(--motion-ease)}
.tata-btn:active{transform:scale(.94)}
.tface{display:block;line-height:0}
.hd-t{flex:1;min-width:0}
.hd-t h1{font-family:var(--font-display);font-size:20px;line-height:1.2;font-weight:var(--x-display-weight,700)}
.hd-t p{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hd-t p b{color:var(--ink);font-weight:600}
.ib{flex:none;width:44px;height:44px;border:0;background:none;border-radius:50%;display:grid;place-items:center;color:var(--ink2)}
.ib svg,.tab svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ib[aria-pressed="true"]{background:var(--surface2)}

.banner{flex:none;margin:0 12px 8px;padding:10px 12px;border-radius:var(--radius-sm);background:var(--surface2);border:1px solid var(--line);font-size:14px;display:flex;gap:10px;align-items:center}
.banner .mk{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--warn);color:var(--warn);display:grid;place-items:center;font-weight:700;font-size:13px}
.banner p{flex:1}

.scroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.pg{padding:4px 16px 96px;display:flex;flex-direction:column;gap:12px;min-height:100%}
.pg.in-r{animation:inR var(--dur) var(--motion-ease)}
.pg.in-l{animation:inL var(--dur) var(--motion-ease)}
.pg.in-f{animation:inF var(--dur) var(--motion-ease)}
@keyframes inR{from{opacity:0;transform:translateX(10px)}}
@keyframes inL{from{opacity:0;transform:translateX(-10px)}}
@keyframes inF{from{opacity:0;transform:translateY(8px)}}
@keyframes grow{from{transform:scaleX(0)}}

/* 分頁列與動作鍵 */
.tabbar{flex:none;position:relative;display:grid;grid-template-columns:1fr 1fr 76px 1fr 1fr;align-items:end;padding:4px 6px calc(4px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:linear-gradient(var(--surface),var(--surface)),var(--x-surface-solid,var(--bg))}
.tab{border:0;background:none;min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;color:var(--muted);border-radius:12px;position:relative}
.tab[aria-current="page"]{color:var(--ink);font-weight:700}
.tab[aria-current="page"]::after{content:"";position:absolute;top:2px;width:18px;height:3px;border-radius:2px;background:var(--accent)}
.tab .bdg{position:absolute;top:4px;left:calc(50% + 8px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--ink);color:var(--bg);font-size:11px;line-height:18px;font-weight:700}
.fab{justify-self:center;width:60px;height:60px;border-radius:50%;border:4px solid var(--bg);background:var(--accent);color:var(--x-on-accent,var(--on-accent));display:grid;place-items:center;transform:translateY(-14px);box-shadow:var(--shadow);transition:transform var(--dur) var(--motion-ease)}
.fab:active{transform:translateY(-14px) scale(.93)}
.fab svg{width:26px;height:26px;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;fill:none}

/* 共用元件 */
.card{background:var(--surface);border:var(--x-border-w,1px) solid var(--line);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow)}
.has-blur .card,.has-blur .cf,.has-blur .msg-b,.has-blur .dcard{-webkit-backdrop-filter:blur(var(--blur));backdrop-filter:blur(var(--blur))}
.lab{font-size:13px;color:var(--muted)}
.sub{font-size:13px;color:var(--muted)}
.chev{color:var(--muted);font-size:18px;flex:none}
.btn{min-height:44px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:15px;white-space:nowrap;transition:transform 120ms var(--motion-ease),opacity 120ms}
.btn:active{transform:var(--x-press,scale(.96))}
.btn.pri{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.warn{border-color:var(--bad);color:var(--bad)}
.btn.wide{width:100%}
.btn[disabled],.btn[aria-disabled="true"]{opacity:.45}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.g{flex:none;width:36px;height:36px;border-radius:var(--radius-sm);background:var(--surface2);border:1px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:15px;font-family:var(--font-display)}
.row{display:flex;align-items:center;gap:10px;width:100%;min-height:56px;padding:8px 0;border:0;background:none;text-align:left}
.row-m{flex:1;min-width:0;display:flex;flex-direction:column}
.row-m b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-m small{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .amt{font-weight:600}
.row + .row,.list > * + *{border-top:1px solid var(--line)}
.tag{display:inline-block;font-size:12px;padding:1px 7px;border-radius:999px;border:1px solid var(--line);color:var(--ink2);margin-left:6px;vertical-align:1px}
.tag.act{border-color:var(--accent);color:var(--ink)}
.tag.act::before{content:"● ";color:var(--accent)}
.pos{color:var(--good)}
.neg{color:var(--bad)}
.eyes{display:inline-block;flex:none;width:18px;height:14px;position:relative;margin-right:6px;vertical-align:-1px}
.eyes::before,.eyes::after{content:"";position:absolute;top:0;width:5px;height:14px;border-radius:3px;background:var(--tata-body);transform:rotate(-8deg)}
.eyes::before{left:3px}.eyes::after{left:11px}
.bul{position:relative;height:8px;border-radius:var(--x-bar-r,4px);background:var(--surface2);border:1px solid var(--line);margin-top:8px}
.bul.big{height:14px;border-radius:var(--x-bar-r,7px)}
.bul-f{position:absolute;inset:0;border-radius:inherit;background:var(--ink);transform-origin:left center;transform:scaleX(var(--p))}
.fresh .bul-f{animation:grow var(--dur) var(--motion-ease)}
.bul-t{position:absolute;top:-4px;bottom:-4px;left:calc(var(--t)*100%);width:2px;background:var(--accent);border-radius:1px}
.bul.big .bul-t::after{content:"今天";position:absolute;top:100%;left:50%;transform:translateX(-50%);font-size:11px;color:var(--muted);white-space:nowrap;margin-top:1px}
.bul.over .bul-f{background:repeating-linear-gradient(135deg,var(--bad) 0 6px,transparent 6px 9px),var(--surface2);border:1px solid var(--bad)}
.bul em{position:absolute;right:0;top:-20px;font-style:normal;font-size:12px;font-weight:700;color:var(--bad)}
.h3{font-family:var(--font-display);font-size:15px;font-weight:700;margin-top:6px;display:flex;justify-content:space-between;align-items:baseline}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{min-height:44px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:14px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.empty{text-align:center;padding:36px 12px;display:flex;flex-direction:column;gap:8px;align-items:center}
.empty h2{font-family:var(--font-display);font-size:18px}
.empty p{color:var(--muted);font-size:14px;max-width:26em}
.skel{border-radius:var(--radius);background:var(--surface2);height:88px;opacity:.7}
.skel.s{height:44px}
.gray-line{color:var(--muted);font-size:14px;padding:6px 0}

/* A 塔塔說 */
.strip{position:sticky;top:0;z-index:2;display:grid;grid-template-columns:1fr auto;gap:0 8px;align-items:end;text-align:left;width:100%;padding:12px 14px 16px;border-radius:var(--radius);border:var(--x-border-w,1px) solid var(--line);background:linear-gradient(var(--surface),var(--surface)),var(--x-surface-solid,var(--bg));box-shadow:var(--shadow)}
.strip .lab{grid-column:1/-1}
.strip .big{font-size:34px;font-weight:var(--x-num-weight,700);line-height:1.15}
.strip .sub{text-align:right;padding-bottom:5px}
.strip .bul{grid-column:1/-1}
.day{font-size:12px;color:var(--muted);text-align:center;letter-spacing:.06em;margin-top:6px}
.msg{display:flex;align-items:flex-start;gap:2px}
.msg .eyes{margin-top:14px}
.msg-b{background:var(--surface);border:var(--x-border-w,1px) solid var(--line);border-radius:4px var(--radius) var(--radius) var(--radius);padding:10px 14px;max-width:calc(100% - 26px)}
.msg-b p b{font-family:var(--font-num);font-variant-numeric:tabular-nums}
.msg.me{justify-content:flex-end}
.msg.me .msg-b{background:var(--ink);color:var(--bg);border-color:var(--ink);border-radius:var(--radius) 4px var(--radius) var(--radius)}
.msg.quiet .msg-b{background:none;border-style:dashed;color:var(--muted)}
.cf{background:var(--surface);border:var(--x-border-w,1px) solid var(--line);box-shadow:var(--shadow);border-radius:var(--radius);padding:4px 14px 14px}
[data-variant="A"] .pg > .cf{margin-left:26px}
.cf-why{font-size:14px;color:var(--ink2)}
.composer{flex:none;display:none;gap:8px;padding:8px 12px;border-top:1px solid var(--line);background:linear-gradient(var(--surface),var(--surface)),var(--x-surface-solid,var(--bg))}
.composer.on{display:flex}
.composer input,.bub input,.field input{flex:1;min-width:0;height:44px;border-radius:999px;border:1px solid var(--line);background:var(--bg);padding:0 14px;font-size:16px}

/* B 儀表板 */
.hero{display:flex;gap:12px;align-items:center;border-color:var(--ink);border-width:1.5px}
.hero .tx{flex:1;min-width:0}
.hero .tx b{display:block;font-family:var(--font-display);font-size:19px;line-height:1.3}
.tile{display:block;width:100%;text-align:left}
.tile .big{display:block;font-size:32px;font-weight:var(--x-num-weight,700);line-height:1.2}
.tile .mid{display:block;font-size:24px;font-weight:var(--x-num-weight,700);line-height:1.25}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.catc .mid{font-size:22px}
.hbar{display:grid;grid-template-columns:44px 1fr auto;gap:8px;align-items:center;min-height:36px;font-size:14px}
.hbar .t{height:10px;border-radius:5px;background:var(--surface2)}
.hbar .t span{display:block;height:100%;border-radius:5px;background:var(--ink);transform-origin:left center;transform:scaleX(var(--p))}
.fresh .hbar .t span{animation:grow var(--dur) var(--motion-ease)}
.hs{display:flex;gap:10px;overflow-x:auto;margin:0 -16px;padding:2px 16px;scroll-snap-type:x proximity;-webkit-mask-image:linear-gradient(90deg,#000 88%,transparent)}
.hs > *{flex:none;width:168px;scroll-snap-align:start}
.upc{display:flex;flex-direction:column;gap:2px;text-align:left}
.upc .when{font-size:13px;font-weight:600}
.upc .when::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--muted);margin-right:6px}
.upc.soon .when::before{background:var(--accent)}
.upc b{font-size:15px}

/* C 一次一張 */
[data-variant="C"] .pg{padding-bottom:16px}
.deck{flex:1;display:flex;flex-direction:column;gap:12px;min-height:0}
.segs{display:flex;gap:4px}
.segs i{flex:1;height:4px;border-radius:2px;background:var(--line)}
.segs i.done{background:var(--muted)}
.segs i.on{background:var(--ink)}
.deck-stage{flex:1;display:grid;min-height:340px}
.dcard{grid-area:1/1;display:flex;flex-direction:column;justify-content:center;gap:10px;padding:24px 22px;border-radius:calc(var(--radius) + 8px);background:var(--surface);border:var(--x-border-w,1px) solid var(--line);box-shadow:var(--shadow);touch-action:pan-y;user-select:none;-webkit-user-select:none}
.dcard.snap{transition:transform var(--dur) var(--motion-ease),opacity var(--dur)}
.dcard.in{animation:cardIn var(--dur) var(--motion-ease)}
@keyframes cardIn{from{opacity:0;transform:scale(.96)}}
.dcard .kick{font-size:13px;color:var(--muted)}
.dcard .ttl{font-family:var(--font-display);font-size:26px;font-weight:700;line-height:1.25}
.dcard .huge{font-size:52px;font-weight:var(--x-num-weight,700);line-height:1.1;letter-spacing:-.01em}
.dcard .g{width:52px;height:52px;font-size:22px}
.dcard .acts{margin-top:14px}
.dcard .acts .btn{flex:1;min-height:52px}
.dcard.center{align-items:center;text-align:center}
.deck-nav{display:flex;align-items:center;justify-content:space-between;gap:8px;color:var(--muted);font-size:13px}

/* 泡泡、抽屜、提示 */
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.42);opacity:0;pointer-events:none;transition:opacity var(--dur);z-index:10}
.scrim.on{opacity:1;pointer-events:auto}
.bub{position:absolute;left:12px;right:12px;top:calc(64px + env(safe-area-inset-top));z-index:12;background:linear-gradient(var(--surface),var(--surface)),var(--x-surface-solid,var(--bg));border:1px solid var(--line);border-radius:6px var(--radius) var(--radius) var(--radius);box-shadow:var(--shadow);padding:14px;display:flex;flex-direction:column;gap:10px;transform-origin:26px -20px;transform:scale(.9);opacity:0;visibility:hidden;transition:transform var(--dur) var(--motion-ease),opacity var(--dur),visibility 0s var(--dur);max-height:70%;overflow-y:auto}
.bub.on{transform:none;opacity:1;visibility:visible;transition-delay:0s}
.bub .say{font-size:17px;font-weight:600}
.bub .log{display:flex;flex-direction:column;gap:8px}
.bub form,.composer{align-items:center}
.bub form{display:flex;gap:8px}
.bub .ctx{font-size:13px;color:var(--muted);border:1px dashed var(--line);border-radius:var(--radius-sm);padding:6px 10px}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:11;max-height:88%;display:flex;flex-direction:column;background:linear-gradient(var(--surface),var(--surface)),var(--x-surface-solid,var(--bg));border-radius:calc(var(--radius) + 6px) calc(var(--radius) + 6px) 0 0;border-top:1px solid var(--line);box-shadow:var(--shadow);transform:translateY(102%);visibility:hidden;transition:transform var(--dur) var(--motion-ease),visibility 0s var(--dur)}
.sheet.on{transform:none;visibility:visible;transition-delay:0s}
.sheet::after{content:"";position:absolute;left:0;right:0;top:100%;height:80px;background:inherit}
.sheet.tall{height:92%;max-height:92%}
.sh-h{flex:none;display:flex;align-items:center;gap:4px;padding:8px 8px 4px 16px}
.sh-h h2{flex:1;font-family:var(--font-display);font-size:18px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sh-back{min-height:44px;border:0;background:none;padding:0 8px 0 0;color:var(--ink2);font-size:15px;white-space:nowrap}
.sh-b{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:4px 16px calc(20px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px}
.sh-b > *{flex-shrink:0}
.sh-b.sw{animation:inF var(--dur) var(--motion-ease)}
.lead{font-size:17px;font-weight:600}
.facts{margin:0;display:grid;grid-template-columns:auto 1fr;gap:8px 16px;font-size:15px}
.facts dt{color:var(--muted)}
.facts dd{margin:0;text-align:right;min-width:0}
.bars{display:flex;align-items:flex-end;gap:8px;height:110px;position:relative;padding-top:6px}
.bars .b{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;height:100%;font-size:12px;color:var(--muted)}
.bars .b i{width:100%;border-radius:6px 6px 2px 2px;background:var(--line);height:calc(var(--h)*82px);min-height:2px}
.bars .b.now i{background:var(--ink)}
.bars .b.part i{background:none;border:1.5px dashed var(--ink)}
.bars .avg{position:absolute;left:0;right:0;bottom:calc(18px + var(--h)*82px);border-top:1.5px dashed var(--muted);font-size:11px;color:var(--muted);text-align:right;line-height:1}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.flab{font-size:13px;color:var(--muted)}
.field input{border-radius:var(--radius-sm)}
.cgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.cbtn{min-height:60px;border:1px solid var(--line);background:var(--surface);border-radius:var(--radius-sm);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:12px;padding:4px 0}
.cbtn b{font-family:var(--font-display);font-size:17px}
.cbtn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.acc{min-height:64px;border:1px solid var(--line);background:var(--surface2);border-radius:var(--radius-sm);padding:8px 12px;text-align:left;display:flex;flex-direction:column;justify-content:space-between;font-size:14px}
.acc small{color:var(--muted);font-size:12px}
.acc[aria-pressed="true"]{border:2px solid var(--ink);background:var(--surface)}
.check{display:flex;align-items:center;gap:10px;min-height:44px;font-size:15px}
.check input{width:22px;height:22px;accent-color:var(--ink);flex:none}
.amtbox{text-align:center;font-size:48px;font-weight:var(--x-num-weight,700);line-height:1.1;padding:2px 0}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:auto}
.key{min-height:52px;border:0;border-radius:var(--radius-sm);background:var(--surface2);font-size:22px;font-family:var(--font-num)}
.key:active{background:var(--line)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;padding:4px;border-radius:999px;background:var(--surface2)}

<script>/*!
 * tata_face.js  塔塔的臉（設計提案版 1122-A）
 * 單檔、零依賴。照 Grok Bot 內建頭像規格：blob（球體）、orange #FF6700、
 * 兩隻挖空直立膠囊眼、沒有嘴、沒有腮紅、沒有配件。
 *
 * 用法：
 *   var face = TataFace.mount(el, { mood: 'idle', size: 64, reduceMotion: undefined });
 *   face.setMood('over');            // idle logged over poke sleepy thinking alert
 *   face.setMood('logged', { label: '+1' });  // 入帳數字（64px 以上才顯示）
 *   face.poke();                     // spin、bounce、nod 隨機一種
 *   face.destroy();
 *
 * 顏色：CSS 變數 --tata-body（預設 #FF6700）、--tata-eye（預設不填，眼睛挖空透出底色）。
 * 其他選項（都可不給）：shadow（地面影子）、followPointer（視線跟游標）、label（aria 名稱）。
 * logged 與 poke 是一次性動作，播完回到上一個常駐 mood。
 */
(function (root) {
  'use strict';

  var R = 44;                 // 球半徑（viewBox 單位，viewBox 是 -50 -50 100 100）
  var SEP = 17;               // 兩眼各離臉中心的角度
  var NS = 'http://www.w3.org/2000/svg';
  var PI = Math.PI, D2R = PI / 180;
  var MOOD_LIST = ['idle', 'logged', 'over', 'poke', 'sleepy', 'thinking', 'alert'];
  var MOOD_NAME = {
    idle: '待機', logged: '記帳成功', over: '超支', poke: '被點',
    sleepy: '想睡', thinking: '端詳', alert: '帳單將到期'
  };

  /* ---------- 小工具 ---------- */
  function clamp(x, a, b) { return x < a ? a : x > b ? b : x; }
  function ss(a, b, x) { var k = clamp((x - a) / (b - a), 0, 1); return k * k * (3 - 2 * k); }
  function ease(k) { return k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2; }
  function easeOut(k) { return 1 - Math.pow(1 - k, 3); }
  // 梯形包絡：a 到 b 升起，c 到 d 落下
  function bump(a, b, c, d, x) { return ss(a, b, x) * (1 - ss(c, d, x)); }
  // 眨眼：0.10 秒閉、0.16 秒開，合計 0.26 秒（k 可放慢）
  function blink(t, t0, k) {
    k = k || 1;
    var x = (t - t0) / k;
    if (x <= 0 || x >= 0.26) return 0;
    return x < 0.10 ? ease(x / 0.10) : 1 - ease((x - 0.10) / 0.16);
  }
  function blinks(t, list, k) {
    var m = 0;
    for (var i = 0; i < list.length; i++) { var v = blink(t, list[i], k); if (v > m) m = v; }
    return m;
  }
  function wrap180(a) { a = ((a + 180) % 360 + 360) % 360 - 180; return a; }

  /* ---------- 眼形：[寬, 高, 上下彎, 左右彎, 傾斜度, 下移]，單位是球半徑 ---------- */
  var EYE = {
    neutral: [0.21, 0.46, 0, 0, 0, 0],          // 直立膠囊
    happy:   [0.36, 0.15, 0.13, 0, 0, -0.02],   // 上彎弧
    sad:     [0.20, 0.36, 0, 0, 16, 0.05],      // 略斜下
    sleepy:  [0.36, 0.09, -0.10, 0, 0, 0.06],   // 下彎細弧
    wide:    [0.34, 0.46, 0, 0, 0, 0],          // 睜大變圓
    big:     [0.27, 0.54, 0, 0, 0, 0],          // 端詳：大的那隻
    small:   [0.17, 0.30, 0, 0, 0, 0.02],       // 端詳：小的那隻
    calm:    [0.20, 0.26, 0, 0, 0, 0.02]        // 半開
  };
  function mixEye(a, b, k) {
    if (k <= 0) return a; if (k >= 1) return b;
    var o = [];
    for (var i = 0; i < 6; i++) o[i] = a[i] + (b[i] - a[i]) * k;
    return o;
  }

  // 眼形輪廓：圓角矩形（膠囊）沿周長等距取 48 點，再做彎曲與傾斜。
  // 任何兩種眼形都是同一組參數插值，所以切換是連續變形，不硬換。
  var NPTS = 48;
  function eyePath(e, side, scale) {
    var w = Math.max(e[0], 0.02) * scale, h = Math.max(e[1], 0.02) * scale;
    var hw = w / 2, hh = h / 2, r = Math.min(hw, hh), sx = hw - r, sy = hh - r;
    var q = PI * r / 2, per = 4 * sx + 4 * sy + 4 * q;
    var by = e[2] * scale, bx = e[3] * scale * side;
    var rot = -side * e[4] * D2R, cr = Math.cos(rot), sr = Math.sin(rot);
    var dy = e[5] * scale, d = '';
    for (var i = 0; i < NPTS; i++) {
      var s = per * i / NPTS, x, y, a;
      if (s < sx) { x = s; y = -hh; }
      else if ((s -= sx) < q) { a = -PI / 2 + s / r; x = sx + r * Math.cos(a); y = -sy + r * Math.sin(a); }
      else if ((s -= q) < 2 * sy) { x = hw; y = -sy + s; }
      else if ((s -= 2 * sy) < q) { a = s / r; x = sx + r * Math.cos(a); y = sy + r * Math.sin(a); }
      else if ((s -= q) < 2 * sx) { x = sx - s; y = hh; }
      else if ((s -= 2 * sx) < q) { a = PI / 2 + s / r; x = -sx + r * Math.cos(a); y = sy + r * Math.sin(a); }
      else if ((s -= q) < 2 * sy) { x = -hw; y = sy - s; }
      else if ((s -= 2 * sy) < q) { a = PI + s / r; x = -sx + r * Math.cos(a); y = -sy + r * Math.sin(a); }
      else { s -= q; x = -sx + s; y = -hh; }
      var nx = x / hw, ny = y / hh;
      y += by * (nx * nx - 0.3333);
      x += bx * (ny * ny - 0.3333);
      var X = x * cr - y * sr, Y = x * sr + y * cr + dy;
      d += (i ? 'L' : 'M') + X.toFixed(4) + ' ' + Y.toFixed(4);
    }
    return d + 'Z';
  }

  /* ---------- 姿勢 ---------- */
  // yaw 左右轉、pitch 上下、roll 歪頭（度）；gx gy 視線；sq 垂直擠壓；ty 位移（半徑倍數，負的往上）；
  // sc 整體縮放；lid 眼皮（1 全閉）；glow 光暈；tok 入帳小點進度；lab 入帳數字進度；L R 兩眼眼形。
  var BASE = { yaw: 22, pitch: 21, roll: 24 };
  function pose(o) {
    var p = { yaw: BASE.yaw, pitch: BASE.pitch, roll: BASE.roll, gx: 0, gy: 0, sq: 1, ty: 0, sc: 1,
      lid: 0, glow: 0, tok: 0, lab: 0, L: EYE.neutral, R: EYE.neutral };
    for (var k in o) p[k] = o[k];
    return p;
  }
  var NUM = ['yaw', 'pitch', 'roll', 'gx', 'gy', 'sq', 'ty', 'sc', 'lid', 'glow'];
  function lerpPose(a, b, k) {
    var p = { tok: b.tok, lab: b.lab };
    for (var i = 0; i < NUM.length; i++) {
      var n = NUM[i], av = a[n];
      if (n === 'yaw') av = b.yaw + wrap180(av - b.yaw);   // 走最短的那一邊，轉圈後不會倒轉回來
      p[n] = av + (b[n] - av) * k;
    }
    p.L = mixEye(a.L, b.L, k); p.R = mixEye(a.R, b.R, k);
    return p;
  }

  /* ---------- 七個 mood ---------- */
  var W16 = 2 * PI / 16;
  var MOODS = {
    // 待機：16 秒大循環＝6 秒＋4 秒＋6 秒三小段（對應 Grok Bot Idle_A、Idle_B、Idle_D），
    // 所有週期都整除 16 秒，頭尾接得起來。呼吸 4 秒一輪。
    idle: {
      loop: 16, still: 0.3,
      fn: function (t) {
        var yaw = 14 + 19 * Math.sin(W16 * t) + 7 * Math.sin(3 * W16 * t + 1.3);
        var g = bump(9.0, 9.35, 10.1, 10.5, t);          // 第 9 秒往左下瞄一眼
        var b = Math.sin(2 * PI * t / 4);
        return pose({
          yaw: yaw,
          pitch: 20 + 8 * Math.sin(2 * W16 * t + 0.6) + 3 * Math.sin(5 * W16 * t),
          roll: 8 + 0.65 * yaw,
          gx: 0.25 * Math.sin(2 * W16 * t + 2.1) - 1.3 * g,
          gy: 0.2 * Math.sin(3 * W16 * t) - 0.9 * g,
          sq: 1 + 0.016 * b, ty: -0.006 * b,
          // 不等距眨眼；12.07 與 12.37 是連眨
          lid: blinks(t, [1.16, 4.0, 8.2, 10.59, 12.07, 12.37, 14.25])

      }
    },

    // 記帳成功：一顆小點落進身體，吞一下，小跳，眼睛上彎。2.3 秒，播完回常駐 mood。
    logged: {
      dur: 2.3, still: 1.5,
      fn: function (t) {
        var up = ss(0, 0.2, t) - ss(0.36, 0.6, t);
        var hap = ss(0.36, 0.64, t) * (1 - ss(1.95, 2.25, t));
        var hop = (t > 0.62 && t < 1.12) ? Math.sin(PI * (t - 0.62) / 0.5) : 0;
        var e = mixEye(mixEye(EYE.neutral, EYE.wide, ss(0, 0.15, t) * (1 - ss(0.36, 0.6, t))), EYE.happy, hap);

          yaw: 22 - 14 * hap, pitch: 21 + 16 * up - 3 * hap, roll: 24 - 18 * hap,
          sq: 1 - 0.09 * bump(0.36, 0.46, 0.5, 0.62, t) + 0.03 * hop

          ty: -0.24 * hop,
          tok: clamp(t / 0.38, 0, 1),
          lab: clamp((t - 0.5) / 1.3, 0, 1),
          L: e, R: e
        });
      }
    },

    // 超支：眼睛斜下、身體縮一點、整體慢一拍（呼吸 7 秒、眨眼放慢），每輪嘆一口氣再抬頭看你一眼。
    over: {
      loop: 7, still: 0.5,
      fn: function (t) {
        var s = bump(4.2, 4.8, 5.4, 5.9, t);
        var look = bump(5.9, 6.2, 6.5, 6.9, t);
        return pose({
          yaw: 6 + 6 * Math.sin(2 * PI * t / 7), pitch: -8 + 2 * Math.sin(4 * PI * t / 7) + 16 * look,
          roll: 4, gy: -0.3 + 0.5 * look,
          sc: 0.94, sq: 0.975 + 0.012 * Math.sin(2 * PI * t / 7) - 0.035 * s, ty: 0.04 + 0.02 * s,
          lid: blinks(t, [2.8, 6.55], 1.4),
          L: EYE.sad, R: EYE.sad
        });
      }
    },

    // 想睡（深夜）：眼睛下彎細弧、呼吸 8 秒一輪、頭慢慢垂下去，點一下頭驚醒，一隻眼半開又闔上。
    sleepy: {
      loop: 8, still: 1,
      fn: function (t) {
        var drop = ss(5.6, 6.5, t) * (1 - ss(6.5, 6.62, t));
        var peek = ss(6.6, 6.75, t) * (1 - ss(7.3, 7.8, t));
        return pose({
          yaw: 10, pitch: -10 - 4 * Math.sin(2 * PI * t / 8) - 12 * drop, roll: 14 + 6 * drop,
          sq: 1 + 0.03 * Math.sin(2 * PI * t / 8) + 0.02 * peek, ty: 0.03 + 0.03 * drop,
          L: EYE.sleepy, R: mixEye(EYE.sleepy, EYE.calm, peek)
        });
      }
    },

    // 端詳：一大一小，歪頭看一邊，再透過一次眨眼（0.35 秒）換邊。4.8 秒一輪。
    thinking: {
      loop: 4.8, still: 1,
      fn: function (t) {
        var s = ss(2.0, 2.4, t) - ss(4.4, 4.8, t);

          yaw: 18 - 30 * s, pitch: 25 + 2 * Math.sin(2 * PI * t / 2.4), roll: 14 - 24 * s,
          gy: 0.5, sq: 1.01,
          lid: 0.85 * blinks(t, [2.03, 4.43], 1.35),
          L: mixEye(EYE.big, EYE.small, s), R: mixEye(EYE.small, EYE.big, s)
        });

function D(){
  const scn=S.scn,empty=scn==='empty';
  const cats=CATS.map(c=>Object.assign({},c));let un={s:1870,n:14};let income=43200;
  const put=(k,a,n)=>{if(k==='未分類'){un.s+=a;un.n+=n}else if(k==='收入'){income+=a}else{const c=cats.find(c=>c.k===k);if(c){c.s+=a;c.n+=n}}};
  if(scn==='over'){put('吃',6220,9);put('娛樂與社交',9650,6);put('購物',7950,4)}
  if(empty){cats.forEach(c=>{c.s=0;c.n=0});un={s:0,n:0};income=0}
  else TX.forEach(t=>{if(t.transfer)return;const f=S.fix[t.id],cur=(f&&f.c)||t.c;
    if(S.voided.has(t.id)){put(t.c,t.a<0?t.a:-t.a,-1);return}
    if(cur!==t.c&&t.a<0){put(t.c,t.a,-1);put(cur,-t.a,1)}});
  S.added.forEach(t=>{if(S.voided.has(t.id))return;if(t.a<0)put(t.c,-t.a,1);else income+=t.a});
  const all=(empty?[]:TX).map(t=>{const f=S.fix[t.id]||{};return Object.assign({},t,f,{pend:t.st==='guess'&&!S.ok.has(t.id)&&scn!=='done'})});
  const txs=S.added.concat(all).filter(t=>!S.voided.has(t.id));
  const inbox=txs.filter(t=>t.pend);
  const E0={b1:5,b2:15,b3:1,b4:25};const bills=BILLS.map(b=>Object.assign({type:'bill'},b,empty?{paid:S.paid.has(b.id),rel:E0[b.id]}:{paid:b.paid||S.paid.has(b.id)}));
  const subs=SUBS.map(s=>Object.assign({type:'sub',c:'訂閱'},s,{cancel:S.cancel.has(s.id)}));
  const nb=bills.filter(b=>!b.paid&&b.rel>=-30).sort((a,b)=>a.rel-b.rel)[0]||null;
  const spent=cats.reduce((a,c)=>a+c.s,0)+un.s,left=BUDGET-spent;
  const day=empty?1:P.day,dl=empty?30:P.left;
  return {scn,empty,err:scn==='error',cats,un,income,txs,inbox,bills,subs,nb,spent,left,day,dl,perDay:left>0?Math.floor(left/dl/10)*10:0,pS:spent/BUDGET,pT:day/P.days,

}
function tata(d){

  if(d.inbox.length)return{line:'<b>'+d.inbox.length+' 筆</b>等你看。',mood:'thinking'};

function openBub(){if(sheet.classList.contains('on'))closeSheet();renderBub();bub.classList.add('on');scrim.classList.add('on');$('#tataBtn').setAttribute('aria-expanded','true')}

/* ---------- 動作 ---------- */
function done(el,fn){const card=el&&el.closest('[data-cf]');const run=()=>{fn();rollOn=true;render();if(sheet.classList.contains('on'))renderSheetBody()};
  const a=card&&anim(card,[{opacity:1,transform:'none'},{opacity:0,transform:'translateX(48px)'}],{duration:Math.min(cssMs(),220),fill:'forwards'});if(a)a.finished.then(run,run);else run()}
function deckMove(el,dx,fn){const c=$('.dcard',main);const a=c&&anim(c,[{opacity:1,transform:'none'},{opacity:0,transform:'translateX('+dx+'px)'}],{duration:Math.min(cssMs(),220),fill:'forwards'});if(a)a.finished.then(fn,fn);else fn()}
function pager(k,step){const key=k==='b'?'bIdx':k==='f'?'fIdx':'cIdx';deckMove(null,step>0?-60:60,()=>{S[key]+=step;render()})}
const ACT={

 mask(el){S.mask=!S.mask;phone.classList.toggle('masked',S.mask);el.setAttribute('aria-pressed',String(S.mask));el.setAttribute('aria-label',S.mask?'顯示金額':'隱藏金額');toast(S.mask?'金額蓋住了':'金額顯示了')},

 toast(el){toast(el.dataset.msg)},
 retry(){S.loading=true;render('f');setTimeout(()=>{S.loading=false;S.scn='normal';syncSkin();render('f');toast('讀到了')},1200)},
 lf(el){S.lf=el.dataset.k;render()},ff(el){S.ff=el.dataset.k;render()},showPaid(){S.showPaid=true;render()},
 goUn(){closeSheet();S.lf='un';if(S.tab==='ledger')render();else go('ledger')},
 ok(el){const id=el.dataset.id,c=el.dataset.c,t=TX.find(x=>x.id===id),prev=S.fix[id];
  done(el,()=>{S.ok.add(id);if(c)S.fix[id]=Object.assign({},prev,{c:c});if(S.stack.length&&S.stack[S.stack.length-1].k==='tx')closeSheet();setMood('logged',true);
   toast((c?'「'+t.m+'」記成'+c:'「'+t.m+'」確認了'),()=>{S.ok.delete(id);if(c){if(prev)S.fix[id]=prev;else delete S.fix[id]}})})},
 okAll(){const ids=D().inbox.filter(t=>t.c!=='未分類').map(t=>t.id),skip=D().inbox.length-ids.length;ids.forEach(i=>S.ok.add(i));setMood('logged',true);rollOn=true;render();renderSheetBody();toast(ids.length+' 筆確認了'+(skip?'，'+skip+' 筆未分類要你給':''),()=>ids.forEach(i=>S.ok.delete(i)))},
 fix(el){S.ed=null;openSheet('edit',el.dataset.id,!!el.closest('.sheet')&&S.stack.length&&S.stack[S.stack.length-1].k==='tx'?undefined:false)},
 edC(el){S.ed.c=el.dataset.c;const l=$('#edLearn');if(l)S.ed.learn=l.checked;renderSheetBody()},
 edA(el){S.ed.ac=el.dataset.c;const l=$('#edLearn');if(l)S.ed.learn=l.checked;renderSheetBody()},
 edSave(el){const e=S.ed,id=el.dataset.id,t=TX.find(x=>x.id===id)||S.added.find(x=>x.id===id),prev=S.fix[id],was=S.ok.has(id),learn=$('#edLearn')&&$('#edLearn').checked;
  if(S.added.includes(t)){const o={c:t.c,ac:t.ac};t.c=e.c;t.ac=e.ac;closeSheet();rollOn=true;render();toast('改好了',()=>Object.assign(t,o));return}
  S.fix[id]={c:e.c,ac:e.ac};S.ok.add(id);closeSheet();setMood('logged',true);rollOn=true;render();
  toast('存成「'+e.c+'」'+(learn&&t.a<0?'，以後這家照這樣記':''),()=>{if(prev)S.fix[id]=prev;else delete S.fix[id];if(!was)S.ok.delete(id)})},
 void(el){const id=el.dataset.id;S.voided.add(id);closeSheet();rollOn=true;render();toast('這筆作廢了',()=>S.voided.delete(id))},
 paid(el){const id=el.dataset.id,b=BILLS.find(x=>x.id===id);done(null,()=>{S.paid.add(id);setMood('logged',true);toast(b.name+'標成已繳',()=>S.paid.delete(id))})},
 unpaid(el){S.paid.delete(el.dataset.id);render();renderSheetBody();toast('改回還沒繳')},
 cancel(el){const id=el.dataset.id;S.cancel.add(id);render();if(sheet.classList.contains('on'))renderSheetBody();toast('標成要取消，到期前我會提醒',()=>S.cancel.delete(id))},
 uncancel(el){const id=el.dataset.id;S.cancel.delete(id);render();if(sheet.classList.contains('on'))renderSheetBody();toast('不取消了',()=>S.cancel.add(id))},
 askTx(el){const t=D().txs.find(x=>x.id===el.dataset.id);closeSheet();S.ctx=t;openBub();setTimeout(()=>{const i=$('#bubIn');i&&i.focus({preventScroll:true})},80)},
 askFx(el){const d=D(),x=d.bills.concat(d.subs).find(y=>y.id===el.dataset.id);closeSheet();S.ctx=x;openBub()},
 cnext(){pager('c',1)},cprev(){pager('c',-1)},cgo(el){S.cIdx=+el.dataset.k;render('f')},
 pnext(el){pager(el.dataset.k,1)},pprev(el){pager(el.dataset.k,-1)},
 adT(el){S.add.type=el.dataset.c;S.add.c=el.dataset.c==='income'?'AI 影片案':'吃';keepAdd();renderSheetBody()},
 adC(el){S.add.c=el.dataset.c;keepAdd();renderSheetBody()},adA(el){S.add.ac=el.dataset.c;keepAdd();renderSheetBody()},adD(el){S.add.date=el.dataset.c;keepAdd();renderSheetBody()},
 key(el){const k=el.dataset.c,a=S.add;if(k==='⌫')a.v=a.v.slice(0,-1);else if(a.v.length<7&&!(a.v===''&&(k==='0'||k==='00')))a.v+=k;if(a.v.length>7)a.v=a.v.slice(0,7);
  const v=+a.v||0;$('#adAmt').innerHTML=amt(v);const s=$('#adSave');s.disabled=!v;s.textContent=v?'記下 NT$'+fmt(v):'記下這筆';$('#adHint').textContent=v?'':'先輸入金額'},
 adSave(){keepAdd();const a=S.add,v=+a.v;if(!v)return;const inc=a.type==='income',tr=a.type==='transfer',id='n'+(++S.seq);
  const t={id:id,d:a.date==='今天'?'11/22':'11/21',t:'現在',m:tr?'轉帳':inc?a.c:'手動記的'+a.c,a:inc?v:-v,c:tr?'轉帳':inc?'收入':a.c,stream:inc?a.c:undefined,ac:a.ac,by:'老大',ev:'手動',transfer:tr?1:undefined,queued:S.scn==='offline'};
  S.added.unshift(t);setMood('logged',true);const again=a.again;S.add=again?Object.assign({},a,{v:''}):null;if(again)renderSheetBody();else closeSheet();rollOn=true;render();
  toast(S.scn==='offline'?'記下了，等連線後上傳':'記下 NT$'+fmt(v),()=>{S.added=S.added.filter(x=>x.id!==id)})}
};
function keepAdd(){const c=$('#adAgain');if(c&&S.add)S.add.again=c.checked}
let dragged=false;
phone.addEventListener('click',e=>{if(dragged){dragged=false;e.preventDefault();return}const el=e.target.closest('[data-act]');if(!el||el.disabled)return;const f=ACT[el.dataset.act];if(f){e.preventDefault();f(el,e)}});
phone.addEventListener('change',e=>{const c=e.target.dataset&&e.target.dataset.card;if(c){S.hide[c]=!e.target.checked;render()}});
phone.addEventListener('submit',e=>{e.preventDefault();const i=$('input',e.target);if(e.target.id==='composer'){ask(i.value,'feed');main.scrollTo({top:0})}else ask(i.value,'bub');i.value=''});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(bub.classList.contains('on'))closeBub();else if(sheet.classList.contains('on'))back()}
  if((e.key==='ArrowRight'||e.key==='ArrowLeft')&&!sheet.classList.contains('on')&&!/INPUT|SELECT/.test(document.activeElement.tagName)){const c=$('.dcard',main);if(c){const k=c.dataset.pager||'c',b=$('[data-act="'+(k==='c'?(e.key==='ArrowRight'?'cnext':'cprev'):(e.key==='ArrowRight'?'pnext':'pprev'))+'"]',$('.deck-nav',main));if(b&&!b.disabled)b.click()}}});

/* C 版樣的左右滑：左滑下一張、右滑上一張，全 App 同一個意思；每個方向都有同功能按鈕 */
let drag=null;
main.addEventListener('pointerdown',e=>{const c=e.target.closest('.swipe');if(!c||rm||e.button>0)return;if(e.clientX-phone.getBoundingClientRect().left<24)return;drag={c:c,x:e.clientX,y:e.clientY,dx:0,on:false}});
main.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(!drag.on){if(Math.abs(dx)>10&&Math.abs(dx)>Math.abs(dy)*1.3){drag.on=true;drag.c.classList.remove('snap','in')}else{if(Math.abs(dy)>14)drag=null;return}}
  drag.dx=dx;drag.c.style.transform='translateX('+dx+'px) rotate('+(dx/60)+'deg)';drag.c.style.opacity=String(1-Math.min(Math.abs(dx)/360,.45))});
function endDrag(){if(!drag)return;const g=drag;drag=null;if(!g.on)return;dragged=true;setTimeout(()=>{dragged=false},60);const k=g.c.dataset.pager||'c',nav=$('.deck-nav',main);
  const b=Math.abs(g.dx)>90&&nav?$('[data-act="'+(k==='c'?(g.dx<0?'cnext':'cprev'):(g.dx<0?'pnext':'pprev'))+'"]',nav):null;
  if(b&&!b.disabled){const key=k==='b'?'bIdx':k==='f'?'fIdx':'cIdx';S[key]+=g.dx<0?1:-1;render()}else{g.c.classList.add('snap');g.c.style.transform='';g.c.style.opacity=''}}
main.addEventListener('pointerup',endDrag);main.addEventListener('pointercancel',endDrag);main.addEventListener('pointerleave',endDrag);

const VI={
 A:{n:'A　塔塔說',l:'時間軸。塔塔一句一句講，你在句子下面直接按。',how:['往下捲，看塔塔記了什麼','卡片下面直接按「對」或「改分類」','最下面的輸入框隨時跟塔塔說'],tr:['最像有人在幫你管帳，塔塔的存在感最高','第一屏只有 1 個主數字，其他寫在句子裡','待確認很多筆時要捲比較久']},
 B:{n:'B　儀表板',l:'一屏看完三個數字。最上面永遠只有今天最該處理的一件事。',how:['先看最上面那張「今天一件事」','按「開始確認」一次看完，可以全部確認','最下面「調整卡片」決定要看哪些'],tr:['掃一眼最快，三個主數字同時看到','最像一般記帳 App，塔塔比較退後','卡片多了容易回到資訊過剩，所以選配卡預設關']},

};
function renderAside(){const v=VI[S.v];
  $('#asideL').innerHTML='<h2>'+v.n+'</h2><p>'+v.l+'</p><h3>怎麼操作</h3><ul>'+v.how.map(x=>'<li>'+x+'</li>').join('')+'</ul><h3>取捨</h3><ul>'+v.tr.map(x=>'<li>'+x+'</li>').join('')+'</ul><h3>提醒</h3><p>這是設計提案，資料是假的，按了不會寫進資料庫。左上角的塔塔可以點。</p>';
  const J=[['home','首頁'],['confirm','確認'],['budget','預算'],['fixed','訂閱'],['detail','詳情'],['add','記一筆'],['tata','塔塔泡泡']];
  const SC=[['normal','平常'],['done','都確認完'],['empty','新的一期'],['over','超支'],['offline','離線'],['error','讀取失敗'],['update','有新版本']];
  $('#asideR').innerHTML='<h3>直接跳到畫面</h3><div class="jump">'+J.map(x=>'<button data-jump="'+x[0]+'">'+x[1]+'</button>').join('')+'</div><h3>切換狀態</h3><div class="jump">'+SC.map(x=>'<button data-scn="'+x[0]+'" aria-pressed="'+(S.scn===x[0])+'">'+x[1]+'</button>').join('')+'</div><h3>現在看的</h3><p>版樣 '+S.v+' · 外觀 '+S.skin+' · '+(S.theme==='dark'?'深色':'淺色')+'</p>';
}
function jump(k){closeBub();closeSheet();const d=D();
  if(k==='home'){S.cIdx=0;S.tab='home';render('f')}
  else if(k==='confirm'){S.tab='home';S.cIdx=1;render('f');if(S.v==='B')openSheet('review',null,false);else if(S.v==='A'){const c=$('.cf',main);c&&c.scrollIntoView({block:'center'})}}
  else if(k==='budget'){S.tab='budget';render('f')}
  else if(k==='fixed'){S.tab='fixed';render('f')}
  else if(k==='detail'){S.tab='ledger';render('f');const t=d.txs[0];t&&openSheet('tx',t.id,false)}
  else if(k==='add')ACT.add();
  else if(k==='tata')openBub();
}
function setScn(v){S.scn=v;prevNum={};S.cIdx=0;S.loading=false;syncSkin();render('f')}
document.addEventListener('click',e=>{const t=e.target.closest('[data-pv],[data-ps],#ptT,[data-jump],[data-scn],#pbMin');if(!t)return;
  if(t.dataset.pv){S.v=t.dataset.pv;prevNum={};closeBub();closeSheet();syncSkin();remountHd();render('f');toast('版樣 '+VI[S.v].n.replace('　','：'))}
  else if(t.dataset.ps){S.skin=t.dataset.ps;syncSkin()}

  if(t.dataset.ps||t.id==='ptT')renderAside()});

const onRM=()=>{rm=RMQ.matches;remountHd();render()};RMQ.addEventListener?RMQ.addEventListener('change',onRM):RMQ.addListener&&RMQ.addListener(onRM);
if(!PAGES[S.tab])S.tab='home';if(!VI[S.v])S.v='A';
syncSkin();remountHd();render('f');
window.__proto={S:S,D:D,jump:jump};
