<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>老大的面板</title>
<meta name="robots" content="noindex">
<style>
:root{--bg:#f2f4f3;--card:#fff;--ink:#1d2321;--sub:#5f6b67;--line:#dfe4e2;--acc:#2b7a70}
@media (prefers-color-scheme:dark){:root{--bg:#111514;--card:#1b201f;--ink:#eef2f0;--sub:#9aa6a2;--line:#2c3331;--acc:#5fc2b4}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,"PingFang TC","Noto Sans TC",sans-serif;padding:max(24px,env(safe-area-inset-top)) 16px 32px}
main{max-width:520px;margin:0 auto}
h1{font-size:22px;margin:8px 0 4px}
p.sub{color:var(--sub);margin:0 0 20px;font-size:14px}
a.card{display:block;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin:0 0 12px;color:inherit;text-decoration:none}
a.card:active{transform:scale(.99)}
a.card b{display:block;font-size:18px;color:var(--acc)}
a.card span{color:var(--sub);font-size:14px}
</style>
</head>
<body>
<main>
<h1>老大的面板</h1>
<p class="sub">一個子資料夾一個面板。</p>
<a class="card" href="current/"><b>逐流 Current</b><span>今天要你決定的事、手上的案子、機會</span></a>
<a class="card" href="kakeibo/"><b>塔塔記帳</b><span>共用記帳本</span></a>
</main>
</body>
</html>
