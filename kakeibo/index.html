<!doctype html>
<html lang="zh-Hant" data-skin="1" data-theme="light" data-variant="A">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex"><meta name="referrer" content="no-referrer">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="塔塔記帳">
<meta name="theme-color" content="#f99b1d"><meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="apple-touch-icon.png?v=20261116f"><link rel="icon" href="favicon-32.png?v=20261116f">
<title>塔塔記帳</title>
<script>/* v31 版面：kk_layout=E（原版進化）或 ?layout=E 時直接轉 orig.html，保留 ?k= 與 # */
(function(){try{var q=new URLSearchParams(location.search),v=q.get("layout")||localStorage.getItem("kk_layout");if(v!=="E")return;var m=location.pathname.match(/\/k\/([A-Za-z0-9_-]{20,})\/?$/),dir=location.pathname.replace(/\/k\/[^/]+\/?$/,"/").replace(/[^/]*$/,"");q.delete("layout");if(m&&!q.get("k"))q.set("k",m[1]);var s=q.toString();location.replace(dir+"orig.html"+(s?"?"+s:"")+location.hash)}catch(e){}})();</script>
<style>
/* 後備值：themes.css 沒載到時仍看得見。:where 權重為零，不會蓋過 themes.css。 */
:where(html){--bg:#fff;--bg2:#f6f6f4;--surface:#fff;--surface2:#f2f2f0;--ink:#111;--ink2:#333;--muted:#666;--line:#e4e4e0;--accent:#FF6700;--accent2:#111;--good:#1a7f4e;--warn:#a85b00;--bad:#c62828;--radius:18px;--radius-sm:10px;--shadow:0 8px 30px rgba(0,0,0,.08);--font-display:system-ui,"Noto Sans TC",sans-serif;--font-body:system-ui,"Noto Sans TC",sans-serif;--font-num:system-ui,sans-serif;--tata-body:#FF6700;--tata-eye:#fff;--blur:0px;--motion-ease:cubic-bezier(.2,.7,.2,1);--motion-dur:240ms}
:where(html){--on-accent:#111;--on-bad:#fff;--dur:min(var(--motion-dur),400ms)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow:hidden;display:flex;flex-direction:column;-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
h1,h2,h3,p{margin:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums}
.amt{white-space:nowrap;font-family:var(--font-num);font-variant-numeric:tabular-nums}
.amt i{font-style:normal;font-size:calc(var(--x-cur-scale,.56)*1em);color:var(--muted);margin-right:.12em;font-weight:500}
.amt b{font-weight:inherit}
.masked .amt b{color:transparent;background:var(--line);border-radius:6px}
.vh{position:absolute;left:-9999px;display:inline-block;min-width:44px;min-height:44px}

/* 原型控制列（不是 App 的一部分） */
.pbar{flex:none;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;padding:4px 8px;background:var(--surface2);border-bottom:1px solid var(--line);font-size:13px;z-index:5}
.pbar .grp{display:flex;align-items:center;gap:4px}
.pbar .lab{color:var(--muted);margin-right:2px;font-size:12px}
.pbar button,.pbar select{min-width:44px;height:44px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:0 10px}
.pbar button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pbar select{max-width:104px;padding:0 4px}
.pbar #ptT{margin-left:6px}
.pbar .sp{flex:1}
.pbar.min .hideable{display:none}

.stage{flex:1;min-height:0;display:flex;justify-content:center;align-items:stretch}
.aside{display:none}
.phone{position:relative;width:100%;max-width:520px;height:100%;overflow:hidden;background-color:var(--bg);background-image:var(--x-atmos,linear-gradient(180deg,var(--bg2),var(--bg) 220px));background-repeat:no-repeat;isolation:isolate}
.app{height:100%;display:flex;flex-direction:column}

/* 頁首 */
.hd{flex:none;display:flex;align-items:center;gap:10px;padding:calc(8px + env(safe-area-inset-top)) 12px 8px}
.tata-btn{flex:none;width:52px;height:52px;border:0;background:none;padding:0;border-radius:50%;display:grid;place-items:center;transition:transform var(--dur) var(--motion-ease)}
.tata-btn:active{transform:scale(.94)}
.tface{display:block;line-height:0}
.hd-t{flex:1;min-width:0}
.hd-t h1{font-family:var(--font-display);font-size:20px;line-height:1.2;font-weight:var(--x-display-weight,700)}
.hd-t p{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hd-t p b{color:var(--ink);font-weight:600}
.ib{flex:none;width:44px;height:44px;border:0;background:none;border-radius:50%;display:grid;place-items:center;color:var(--ink2)}
.ib svg,.tab svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ib[aria-pressed="true"]{background:var(--surface2)}

.banner{flex:none;margin:0 12px 8px;padding:10px 12px;border-radius:var(--radius-sm);background:var(--surface2);border:1px solid var(--line);font-size:14px;display:flex;gap:10px;align-items:center}
.banner .mk{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--warn);color:var(--warn);display:grid;place-items:center;font-weight:700;font-size:13px}
.banner p{flex:1}

.scroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.pg{padding:4px 16px 96px;display:flex;flex-direction:column;gap:12px;min-height:100%}
.pg.in-r{animation:inR var(--dur) var(--motion-ease)}
.pg.in-l{animation:inL var(--dur) var(--motion-ease)}
.pg.in-f{animation:inF var(--dur) var(--motion-ease)}
@keyframes inR{from{opacity:0;transform:translateX(10px)}}
@keyframes inL{from{opacity:0;transform:translateX(-10px)}}
@keyframes inF{from{opacity:0;transform:translateY(8px)}}
@keyframes grow{from{transform:scaleX(0)}}

/* 分頁列與動作鍵 */
.tabbar{flex:none;position:relative;display:grid;grid-template-columns:1fr 1fr 76px 1fr 1fr;align-items:end;padding:4px 6px calc(4px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:linear-gradient(var(--surface),var(--surface)),var(--x-surface-solid,var(--bg))}
.tab{border:0;background:none;min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;color:var(--muted);border-radius:12px;position:relative}
.tab[aria-current="page"]{color:var(--ink);font-weight:700}
.tab[aria-current="page"]::after{content:"";position:absolute;top:2px;width:18px;height:3px;border-radius:2px;background:var(--accent)}
.tab .bdg{position:absolute;top:4px;left:calc(50% + 8px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--ink);color:var(--bg);font-size:11px;line-height:18px;font-weight:700}
.fab{justify-self:center;width:60px;height:60px;border-radius:50%;border:4px solid var(--bg);background:var(--accent);color:var(--x-on-accent,var(--on-accent));display:grid;place-items:center;transform:translateY(-14px);box-shadow:var(--shadow);transition:transform var(--dur) var(--motion-ease)}
.fab:active{transform:translateY(-14px) scale(.93)}
.fab svg{width:26px;height:26px;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;fill:none}

/* 共用元件 */
.card{background:var(--surface);border:var(--x-border-w,1px) solid var(--line);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow)}
.has-blur .card,.has-blur .cf,.has-blur .msg-b,.has-blur .dcard{-webkit-backdrop-filter:blur(var(--blur));backdrop-filter:blur(var(--blur))}
.lab{font-size:13px;color:var(--muted)}
.sub{font-size:13px;color:var(--muted)}
.chev{color:var(--muted);font-size:18px;flex:none}
.btn{min-height:44px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:15px;white-space:nowrap;transition:transform 120ms var(--motion-ease),opacity 120ms}
.btn:active{transform:var(--x-press,scale(.96))}
.btn.pri{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.warn{border-color:var(--bad);color:var(--bad)}
.btn.wide{width:100%}
.btn[disabled],.btn[aria-disabled="true"]{opacity:.45}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.g{flex:none;width:36px;height:36px;border-radius:var(--radius-sm);background:var(--surface2);border:1px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:15px;font-family:var(--font-display)}
.row{display:flex;align-items:center;gap:10px;width:100%;min-height:56px;padding:8px 0;border:0;background:none;text-align:left}
.row-m{flex:1;min-width:0;display:flex;flex-direction:column}
.row-m b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-m small{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .amt{font-weight:600}
.row + .row,.list > * + *{border-top:1px solid var(--line)}
.tag{display:inline-block;font-size:12px;padding:1px 7px;border-radius:999px;border:1px solid var(--line);color:var(--ink2);margin-left:6px;vertical-align:1px}
.tag.act{border-color:var(--accent);color:var(--ink)}
.tag.act::before{content:"● ";color:var(--accent)}
.pos{color:var(--good)}
.neg{color:var(--bad)}
.eyes{display:inline-block;flex:none;width:18px;height:14px;position:relative;margin-right:6px;vertical-align:-1px}
.eyes::before,.eyes::after{content:"";position:absolute;top:0;width:5px;height:14px;border-radius:3px;background:var(--tata-body);transform:rotate(-8deg)}
.eyes::before{left:3px}.eyes::after{left:11px}
.bul{position:relative;height:8px;border-radius:var(--x-bar-r,4px);background:var(--surface2);border:1px solid var(--line);margin-top:8px}
.bul.big{height:14px;border-radius:var(--x-bar-r,7px)}
.bul-f{position:absolute;inset:0;border-radius:inherit;background:var(--ink);transform-origin:left center;transform:scaleX(var(--p))}
.fresh .bul-f{animation:grow var(--dur) var(--motion-ease)}
.bul-t{position:absolute;top:-4px;bottom:-4px;left:calc(var(--t)*100%);width:2px;background:var(--accent);border-radius:1px}
.bul.big .bul-t::after{content:"今天";position:absolute;top:100%;left:50%;transform:translateX(-50%);font-size:11px;color:var(--muted);white-space:nowrap;margin-top:1px}
.bul.over .bul-f{background:repeating-linear-gradient(135deg,var(--bad) 0 6px,transparent 6px 9px),var(--surface2);border:1px solid var(--bad)}
.bul em{position:absolute;right:0;top:-20px;font-style:normal;font-size:12px;font-weight:700;color:var(--bad)}
.h3{font-family:var(--font-display);font-size:15px;font-weight:700;margin-top:6px;display:flex;justify-content:space-between;align-items:baseline}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{min-height:44px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:14px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.empty{text-align:center;padding:36px 12px;display:flex;flex-direction:column;gap:8px;align-items:center}
.empty h2{font-family:var(--font-display);font-size:18px}
.empty p{color:var(--muted);font-size:14px;max-width:26em}
.skel{border-radius:var(--radius);background:var(--surface2);height:88px;opacity:.7}
.skel.s{height:44px}
.gray-line{color:var(--muted);font-size:14px;padding:6px 0}

/* A 塔塔說 */
.strip{position:sticky;top:0;z-index:2;display:grid;grid-template-columns:1fr auto;gap:0 8px;align-items:end;text-align:left;width:100%;padding:12px 14px 16px;border-radius:var(--radius);border:var(--x-border-w,1px) solid var(--line);background:linear-gradient(var(--surface),var(--surface)),var(--x-surface-solid,var(--bg));box-shadow:var(--shadow)}
.strip .lab{grid-column:1/-1}
.strip .big{font-size:34px;font-weight:var(--x-num-weight,700);line-height:1.15}
.strip .sub{text-align:right;padding-bottom:5px}
.strip .bul{grid-column:1/-1}
.day{font-size:12px;color:var(--muted);text-align:center;letter-spacing:.06em;margin-top:6px}
.msg{display:flex;align-items:flex-start;gap:2px}
.msg .eyes{margin-top:14px}
.msg-b{background:var(--surface);border:var(--x-border-w,1px) solid var(--line);border-radius:4px var(--radius) var(--radius) var(--radius);padding:10px 14px;max-width:calc(100% - 26px)}
.msg-b p b{font-family:var(--font-num);font-variant-numeric:tabular-nums}
.msg.me{justify-content:flex-end}
.msg.me .msg-b{background:var(--ink);color:var(--bg);border-color:var(--ink);border-radius:var(--radius) 4px var(--radius) var(--radius)}
.msg.quiet .msg-b{background:none;border-style:dashed;color:var(--muted)}
.cf{background:var(--surface);border:var(--x-border-w,1px) solid var(--line);box-shadow:var(--shadow);border-radius:var(--radius);padding:4px 14px 14px}
[data-variant="A"] .pg > .cf{margin-left:26px}
.cf-why{font-size:14px;color:var(--ink2)}
.composer{flex:none;display:none;gap:8px;padding:8px 12px;border-top:1px solid var(--line);background:linear-gradient(var(--surface),var(--surface)),var(--x-surface-solid,var(--bg))}
.composer.on{display:flex}
.composer input,.bub input,.field input{flex:1;min-width:0;height:44px;border-radius:999px;border:1px solid var(--line);background:var(--bg);padding:0 14px;font-size:16px}

/* B 儀表板 */
.hero{display:flex;gap:12px;align-items:center;border-color:var(--ink);border-width:1.5px}
.hero .tx{flex:1;min-width:0}
.hero .tx b{display:block;font-family:var(--font-display);font-size:19px;line-height:1.3}
.tile{display:block;width:100%;text-align:left}
.tile .big{display:block;font-size:32px;font-weight:var(--x-num-weight,700);line-height:1.2}
.tile .mid{display:block;font-size:24px;font-weight:var(--x-num-weight,700);line-height:1.25}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.catc .mid{font-size:22px}
.hbar{display:grid;grid-template-columns:44px 1fr auto;gap:8px;align-items:center;min-height:36px;font-size:14px}
.hbar .t{height:10px;border-radius:5px;background:var(--surface2)}
.hbar .t span{display:block;height:100%;border-radius:5px;background:var(--ink);transform-origin:left center;transform:scaleX(var(--p))}
.fresh .hbar .t span{animation:grow var(--dur) var(--motion-ease)}
.hs{display:flex;gap:10px;overflow-x:auto;margin:0 -16px;padding:2px 16px;scroll-snap-type:x proximity;-webkit-mask-image:linear-gradient(90deg,#000 88%,transparent)}
.hs > *{flex:none;width:168px;scroll-snap-align:start}
.upc{display:flex;flex-direction:column;gap:2px;text-align:left}
.upc .when{font-size:13px;font-weight:600}
.upc .when::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--muted);margin-right:6px}
.upc.soon .when::before{background:var(--accent)}
.upc b{font-size:15px}

/* C 一次一張 */
[data-variant="C"] .pg{padding-bottom:16px}
.deck{flex:1;display:flex;flex-direction:column;gap:12px;min-height:0}
.segs{display:flex;gap:4px}
.segs i{flex:1;height:4px;border-radius:2px;background:var(--line)}
.segs i.done{background:var(--muted)}
.segs i.on{background:var(--ink)}
.deck-stage{flex:1;display:grid;min-height:340px}
.dcard{grid-area:1/1;display:flex;flex-direction:column;justify-content:center;gap:10px;padding:24px 22px;border-radius:calc(var(--radius) + 8px);background:var(--surface);border:var(--x-border-w,1px) solid var(--line);box-shadow:var(--shadow);touch-action:pan-y;user-select:none;-webkit-user-select:none}
.dcard.snap{transition:transform var(--dur) var(--motion-ease),opacity var(--dur)}
.dcard.in{animation:cardIn var(--dur) var(--motion-ease)}
@keyframes cardIn{from{opacity:0;transform:scale(.96)}}
.dcard .kick{font-size:13px;color:var(--muted)}
.dcard .ttl{font-family:var(--font-display);font-size:26px;font-weight:700;line-height:1.25}
.dcard .huge{font-size:52px;font-weight:var(--x-num-weight,700);line-height:1.1;letter-spacing:-.01em}
.dcard .g{width:52px;height:52px;font-size:22px}
.dcard .acts{margin-top:14px}
.dcard .acts .btn{flex:1;min-height:52px}
.dcard.center{align-items:center;text-align:center}
.deck-nav{display:flex;align-items:center;justify-content:space-between;gap:8px;color:var(--muted);font-size:13px}

/* 泡泡、抽屜、提示 */
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.42);opacity:0;pointer-events:none;transition:opacity var(--dur);z-index:10}
.scrim.on{opacity:1;pointer-events:auto}
.bub{position:absolute;left:12px;right:12px;top:calc(64px + env(safe-area-inset-top));z-index:12;background:linear-gradient(var(--surface),var(--surface)),var(--x-surface-solid,var(--bg));border:1px solid var(--line);border-radius:6px var(--radius) var(--radius) var(--radius);box-shadow:var(--shadow);padding:14px;display:flex;flex-direction:column;gap:10px;transform-origin:26px -20px;transform:scale(.9);opacity:0;visibility:hidden;transition:transform var(--dur) var(--motion-ease),opacity var(--dur),visibility 0s var(--dur);max-height:70%;overflow-y:auto}
.bub.on{transform:none;opacity:1;visibility:visible;transition-delay:0s}
.bub .say{font-size:17px;font-weight:600}
.bub .log{display:flex;flex-direction:column;gap:8px}
.bub form,.composer{align-items:center}
.bub form{display:flex;gap:8px}
.bub .ctx{font-size:13px;color:var(--muted);border:1px dashed var(--line);border-radius:var(--radius-sm);padding:6px 10px}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:11;max-height:88%;display:flex;flex-direction:column;background:linear-gradient(var(--surface),var(--surface)),var(--x-surface-solid,var(--bg));border-radius:calc(var(--radius) + 6px) calc(var(--radius) + 6px) 0 0;border-top:1px solid var(--line);box-shadow:var(--shadow);transform:translateY(102%);visibility:hidden;transition:transform var(--dur) var(--motion-ease),visibility 0s var(--dur)}
.sheet.on{transform:none;visibility:visible;transition-delay:0s}
.sheet::after{content:"";position:absolute;left:0;right:0;top:100%;height:80px;background:inherit}
.sheet.tall{height:92%;max-height:92%}
.sh-h{flex:none;display:flex;align-items:center;gap:4px;padding:8px 8px 4px 16px}
.sh-h h2{flex:1;font-family:var(--font-display);font-size:18px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sh-back{min-height:44px;border:0;background:none;padding:0 8px 0 0;color:var(--ink2);font-size:15px;white-space:nowrap}
.sh-b{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:4px 16px calc(20px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px}
.sh-b > *{flex-shrink:0}
.sh-b.sw{animation:inF var(--dur) var(--motion-ease)}
.lead{font-size:17px;font-weight:600}
.facts{margin:0;display:grid;grid-template-columns:auto 1fr;gap:8px 16px;font-size:15px}
.facts dt{color:var(--muted)}
.facts dd{margin:0;text-align:right;min-width:0}
.bars{display:flex;align-items:flex-end;gap:8px;height:110px;position:relative;padding-top:6px}
.bars .b{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;height:100%;font-size:12px;color:var(--muted)}
.bars .b i{width:100%;border-radius:6px 6px 2px 2px;background:var(--line);height:calc(var(--h)*82px);min-height:2px}
.bars .b.now i{background:var(--ink)}
.bars .b.part i{background:none;border:1.5px dashed var(--ink)}
.bars .avg{position:absolute;left:0;right:0;bottom:calc(18px + var(--h)*82px);border-top:1.5px dashed var(--muted);font-size:11px;color:var(--muted);text-align:right;line-height:1}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.flab{font-size:13px;color:var(--muted)}
.field input{border-radius:var(--radius-sm)}
.cgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.cbtn{min-height:60px;border:1px solid var(--line);background:var(--surface);border-radius:var(--radius-sm);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:12px;padding:4px 0}
.cbtn b{font-family:var(--font-display);font-size:17px}
.cbtn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.acc{min-height:64px;border:1px solid var(--line);background:var(--surface2);border-radius:var(--radius-sm);padding:8px 12px;text-align:left;display:flex;flex-direction:column;justify-content:space-between;font-size:14px}
.acc small{color:var(--muted);font-size:12px}
.acc[aria-pressed="true"]{border:2px solid var(--ink);background:var(--surface)}
.check{display:flex;align-items:center;gap:10px;min-height:44px;font-size:15px}
.check input{width:22px;height:22px;accent-color:var(--ink);flex:none}
.amtbox{text-align:center;font-size:48px;font-weight:var(--x-num-weight,700);line-height:1.1;padding:2px 0}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:auto}
.key{min-height:52px;border:0;border-radius:var(--radius-sm);background:var(--surface2);font-size:22px;font-family:var(--font-num)}
.key:active{background:var(--line)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;padding:4px;border-radius:999px;background:var(--surface2)}
.seg button{min-height:44px;border:0;background:none;border-radius:999px;font-weight:600;font-size:15px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.hint{font-size:13px;color:var(--muted);text-align:center;min-height:20px}
details summary{min-height:44px;display:flex;align-items:center;font-weight:600;font-size:15px;cursor:pointer}
details p{font-size:15px;color:var(--ink2)}
.toast{position:absolute;left:12px;right:12px;bottom:calc(92px + env(safe-area-inset-bottom));z-index:14;display:flex;align-items:center;gap:8px;padding:6px 6px 6px 16px;border-radius:999px;background:var(--ink);color:var(--bg);font-size:15px;box-shadow:var(--shadow);transform:translateY(16px);opacity:0;visibility:hidden;transition:transform var(--dur) var(--motion-ease),opacity var(--dur),visibility 0s var(--dur)}
.toast.on{transform:none;opacity:1;visibility:visible;transition-delay:0s}
.cmp .toast{bottom:calc(152px + env(safe-area-inset-bottom))}
.toast p{flex:1;min-width:0;padding:8px 0}
.toast button{min-height:44px;padding:0 16px;border-radius:999px;border:1px solid var(--bg);background:none;color:var(--bg);font-weight:700}

/* ===== 單 D：帳戶入口、期別列、帳戶頁、統計、表單、計算機 ===== */
[hidden]{display:none !important}
.live{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--good);margin-left:8px;vertical-align:middle}
.live.off{background:none;border:1.5px solid var(--muted)}
.hd .sh-back{flex:none;min-width:52px;padding:0 4px 0 0;font-weight:600;text-align:left}
.pnav{flex:none;display:flex;align-items:center;justify-content:center;gap:2px;padding:0 12px 4px}
.pnav button{width:44px;height:44px;border:0;background:none;font-size:22px;line-height:1;color:var(--ink2);border-radius:50%}
.pnav button[disabled]{opacity:.3}
.pnav .pl{min-width:172px;text-align:center;font-size:14px;font-weight:600}
.pnav .pl em{font-style:normal;font-size:12px;margin-left:6px;padding:1px 7px;border:1px solid var(--line);border-radius:999px;color:var(--ink2);font-weight:500}
.aentry{flex:none;display:flex;align-items:center;gap:10px;width:100%;min-height:48px;padding:6px 10px 6px 14px;border-radius:var(--radius-sm);border:1px solid var(--line);background:linear-gradient(var(--surface2),var(--surface2)),var(--x-surface-solid,var(--bg));text-align:left;font-size:15px}
.aentry svg{flex:none;width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.aentry b{font-weight:700}
.aentry .v{margin-left:auto;color:var(--ink2);white-space:nowrap}
.aentry .v .amt{font-weight:600;color:var(--ink)}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.three .card{padding:10px}
.three .mid{font-size:16px}
.arow{padding:4px 0;gap:6px}
.rowb{flex:1;min-width:0;display:flex;align-items:center;gap:10px;min-height:48px;border:0;background:none;text-align:left;padding:0}
.rowb .amt{font-weight:600}
.mv{flex:none;width:44px;height:44px;border:1px solid var(--line);border-radius:10px;background:var(--surface);display:grid;place-items:center;font-size:16px;color:var(--ink2)}
.mv svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.mv[disabled]{opacity:.3}
.exr .rowb{opacity:.55}
.row.void .row-m b,.row.void .amt{text-decoration:line-through;color:var(--muted)}
.search input{width:100%;height:44px;border-radius:999px;border:1px solid var(--line);background:var(--bg);padding:0 16px;font-size:16px}
.field input,.field select,.field textarea,.dinp{width:100%;min-width:0;height:44px;border-radius:var(--radius-sm);border:1px solid var(--line);background:var(--bg);padding:0 12px;font-size:16px;color:var(--ink);font-family:inherit}
.field textarea{height:72px;padding:10px 12px;resize:none}
.dinp{width:auto;flex:1;min-width:140px}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ferr{font-size:14px;color:var(--bad);font-weight:600;min-height:20px}
.ferr:not(:empty)::before{content:"！"}
.warnbox{border:1.5px solid var(--warn);border-radius:var(--radius-sm);padding:10px 12px;font-size:14px;display:flex;flex-direction:column;gap:4px}
.ch svg{display:block}
.ch svg text{font-size:11px;fill:var(--muted);font-family:var(--font-num)}
.ch.tr{position:relative}
.tcols{position:absolute;inset:0;display:grid;grid-template-columns:repeat(6,1fr)}
.tcols button{border:0;background:none;border-radius:8px}
.tcols button:active{background:rgba(127,127,127,.16)}
.lg{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.lg i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px;border:1.5px solid var(--ink)}
.lg i.f{background:var(--ink)}
.tbl{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.tbl th{font-weight:500;color:var(--muted);text-align:right;padding:8px 2px}
.tbl td{padding:10px 2px;text-align:right;border-top:1px solid var(--line)}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.dcard.fit{justify-content:flex-start;gap:8px;padding:18px 16px}
/* 記一筆：上半可捲、下半計算機固定 */
.sheet.calcsh .sh-b{overflow:hidden;gap:8px;padding-bottom:calc(10px + env(safe-area-inset-bottom))}
.ad-top{flex:1 1 0 !important;min-height:0;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;gap:10px;padding-bottom:4px}
.ad-top > *{flex-shrink:0}
.ad-pad{flex:none;display:flex;flex-direction:column;gap:6px}
.seg.s4 button{font-size:14px;padding:0 2px}
.calc{border:1px solid var(--line);border-radius:var(--radius-sm);padding:4px 12px 2px;background:var(--bg);text-align:right}
.calc:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.calc .ex{min-height:22px;font-size:15px;color:var(--muted);font-family:var(--font-num);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;display:flex;justify-content:flex-end}
.calc .res{font-size:28px;font-weight:var(--x-num-weight,700);line-height:1.15}
.calc .er{font-size:13px;color:var(--bad);font-weight:600;min-height:16px;margin:0;text-align:left}
.keys4{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.keys4 .key{min-height:44px;font-size:21px}
.key.op{background:var(--surface);border:1px solid var(--line);font-weight:700}
.key.eq{grid-row:span 2;background:var(--ink);color:var(--bg);font-weight:700}
@media (max-height:640px){.sheet.calcsh .sh-b{overflow-y:auto}.ad-top{flex:none !important;overflow:visible}}
.sheet.tall.calcsh{height:97%;max-height:97%}
.sheet.calcsh .hint{min-height:0}
.sheet.calcsh .sh-h{padding-top:4px;padding-bottom:0}
/* 抽屜開著時，提示改從上面出來，不蓋住抽屜底部的按鈕與計算機 */
.sheet.on ~ .toast{bottom:auto;top:calc(10px + env(safe-area-inset-top));transform:translateY(-16px)}
.sheet.on ~ .toast.on{transform:none}
/* 桌機：手機框置中，兩側放說明與快捷 */
@media (min-width:900px){
  .stage{align-items:center;gap:36px;padding:20px}
  .phone{width:390px;flex:none;height:min(844px,100%);border-radius:44px;border:1px solid var(--line);box-shadow:var(--shadow)}
  .aside{display:flex;flex-direction:column;gap:10px;width:300px;max-height:100%;overflow-y:auto;font-size:14px;color:var(--ink2)}
  .aside h2{font-family:var(--font-display);font-size:22px;color:var(--ink)}
  .aside h3{font-size:13px;color:var(--muted);font-weight:600;margin-top:8px}
  .aside ul{margin:0;padding-left:1.2em}
  .aside .jump{display:flex;flex-wrap:wrap;gap:6px}
  .aside .jump button{min-height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13px}
  .aside .jump button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
  .pbar.min .hideable{display:flex}
  #pbMin{display:none}
}
@media (max-height:500px){.hd{padding-top:4px;padding-bottom:4px}.pbar{padding:2px 10px}}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}
  .pg.in-r,.pg.in-l,.pg.in-f,.dcard.in,.sh-b.sw{animation:none}
}
/* ===== 單 F1（D2）：只加不改。以下每一條都是新元件或第 6 套外觀專用 ===== */
/* 焦點框：滑鼠、觸控點了不顯示，鍵盤（Tab、方向鍵）才顯示。輸入框照舊一直顯示。 */
html:not(.kbd) :focus-visible:not(input):not(textarea):not(select){outline:none}
/* 連線燈：外面包一顆 44px 的鈕，點了看記號說明；燈的位置與大小不變 */
.livebtn{display:inline-grid;place-items:center;width:44px;height:44px;margin:-18px -18px -18px -10px;border:0;background:none;padding:0;vertical-align:middle;border-radius:50%}
.livebtn .live{margin-left:0}
/* 帳戶列：展開開關、拖曳把手、分組標題 */
.xp{flex:none;min-width:44px;height:44px;border:0;background:none;padding:0 2px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;font-size:12px;line-height:1.2;color:var(--ink2);border-radius:10px}
.xp svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform var(--dur) var(--motion-ease)}
.xp[aria-expanded="true"] svg{transform:rotate(180deg)}
.list > .aexp{border-top:0}
.aexp{padding:0 0 10px 46px;display:flex;flex-direction:column;gap:2px}
.aexp .sub{white-space:normal}
.swrow{display:flex;align-items:center;gap:8px;min-height:48px;font-size:15px}
.swrow .tx{flex:1;min-width:0}
.swrow small{display:block;font-size:13px;color:var(--muted);line-height:1.35}
.swst{flex:none;min-width:1.4em;font-size:13px;font-weight:700;text-align:right}
.swt{flex:none;position:relative;width:60px;height:44px;border:0;background:none;padding:0}
.swt i{position:absolute;left:4px;right:4px;top:8px;height:28px;border-radius:14px;background:var(--surface2);border:1.5px solid var(--muted);transition:background var(--dur)}
.swt i::after{content:"";position:absolute;top:2px;left:2px;width:21px;height:21px;border-radius:50%;background:var(--muted);transition:transform var(--dur) var(--motion-ease)}
.swt[aria-checked="true"] i{background:var(--ink);border-color:var(--ink)}
.swt[aria-checked="true"] i::after{transform:translateX(24px);background:var(--bg)}
.swt[aria-disabled="true"]{opacity:.45}
.grip{flex:none;width:44px;height:44px;border:0;background:none;padding:0;display:grid;place-items:center;color:var(--muted);touch-action:none;cursor:grab;border-radius:10px}
.grip svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.arow{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.sh-h{touch-action:none}
label.field > .fl{font-size:13px;color:var(--muted)}
@media (max-width:400px){.pbar .sp{display:none}}
.field > input,.field > select,.field > textarea{flex:none}
.swt[data-on] i{background:var(--ink);border-color:var(--ink)}
.swt[data-on] i::after{transform:translateX(24px);background:var(--bg)}
.lkth{--x-accent-fill:initial;--x-on-accent-fill:initial;--x-hero-bg:initial;--x-hero-ink:initial}
.arow.drag{background:var(--surface2);border-radius:var(--radius-sm);box-shadow:var(--shadow);position:relative;z-index:1}
.arow.drag .grip{cursor:grabbing;color:var(--ink)}
.grph{display:flex;align-items:center;gap:8px;width:100%;min-height:48px;border:0;background:none;text-align:left;font-size:14px;font-weight:700;padding:0 2px;color:var(--ink)}
.grph .car{display:inline-block;width:14px;transition:transform var(--dur) var(--motion-ease)}
.grph[aria-expanded="false"] .car{transform:rotate(-90deg)}
.grph .cnt{font-weight:500;color:var(--muted);font-size:13px}
.grph .amt{margin-left:auto;font-weight:600}
.recline{display:flex;align-items:center;gap:8px;width:100%;min-height:44px;padding:6px 12px;border:1.5px solid var(--warn);border-radius:var(--radius-sm);background:none;text-align:left;font-size:14px}
/* 外觀設定頁 */
.lkgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.lk{display:flex;flex-direction:column;gap:4px;padding:8px 8px 10px;border-radius:var(--radius);border:2px solid var(--line);background:var(--surface);text-align:left;position:relative;min-width:0}
.lk[aria-pressed="true"]{border-color:var(--ink)}
.lk b{font-size:15px;line-height:1.3}
.lk small{font-size:12px;color:var(--muted);line-height:1.35}
.lk .lkon{font-size:12px;font-weight:700;color:var(--ink)}
/* 單 F2（E2d）：外觀縮圖。每張是一支迷你的 D 版記帳本，照 300×232 的原尺寸用該外觀自己的變數畫，再整塊縮小（--lks 由 fitThumbs 依卡片寬算）。
   外框仍是 .lkth 加 data-skin，不帶 data-theme，明暗跟著頁面走。 */
.lkth{display:block;position:relative;aspect-ratio:300/232;border-radius:12px;overflow:hidden;background-color:var(--bg);border:1px solid var(--line);margin-bottom:4px;contain:paint}
.lki{display:block;position:absolute;left:0;top:0;width:300px;height:232px;transform-origin:0 0;transform:scale(var(--lks,.51));background-color:var(--bg);background-image:var(--x-atmos,none);background-repeat:no-repeat;color:var(--ink);font-family:var(--font-body);line-height:1.2}
.lki>span{display:block}
.lki .lk-h{display:flex;align-items:center;gap:8px;height:40px;padding:0 12px;font-family:var(--font-display);font-size:17px;font-weight:var(--x-display-weight,700)}
.lki .lk-f{flex:none;width:24px;height:24px;border-radius:50%;background:var(--tata-body);display:flex;align-items:center;justify-content:center;gap:3px;padding-left:6px}
.lki .lk-f b{display:block;width:3px;height:9px;border-radius:2px;background:var(--tata-eye)}
.lki .lk-c{margin:0 12px;padding:10px 14px 12px;border-radius:var(--radius);background:var(--x-th-hero,var(--surface));color:var(--x-th-ink,var(--ink));border:var(--x-border-w,1px) solid var(--line);box-shadow:var(--shadow)}
.lki .lk-k{display:block;font-size:13px;opacity:.85}
.lki .lk-n{display:block;font-family:var(--font-num);font-weight:var(--x-num-weight,700);font-size:38px;line-height:1.1}
.lki .lk-n small{font-size:.45em;font-weight:600;margin-right:4px}
.lki .lk-g{display:block;height:8px;border-radius:var(--x-bar-r,4px);margin-top:8px;border:1px solid currentColor;overflow:hidden}
.lki .lk-g i{display:block;width:58%;height:100%;background:currentColor}
.lki .lk-r{display:flex;align-items:center;gap:8px;margin:8px 12px 0;padding:6px 10px;background:var(--surface);border:var(--x-border-w,1px) solid var(--line);border-radius:var(--radius-sm);font-size:15px;font-weight:600}
.lki .lk-r i{flex:none;width:26px;height:26px;border-radius:calc(var(--radius-sm)*.7);border:1px solid var(--line);background:var(--surface2);display:grid;place-items:center;font-style:normal;font-size:13px;font-family:var(--font-display)}
.lki .lk-r .lk-a{margin-left:auto;font-family:var(--font-num)}
.lki .lk-t{position:absolute;left:0;right:0;bottom:0;height:38px;background:var(--surface);border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-around;padding:0 12px}
.lki .lk-t i{display:block;width:22px;height:7px;border-radius:4px;background:var(--muted);opacity:.5}
.lki .lk-t i.on{background:var(--accent);opacity:1}
.lki .lk-t b{display:grid;place-items:center;width:38px;height:38px;border-radius:50%;margin-top:-16px;background:var(--accent);color:var(--bg);font:400 26px/1 var(--font-body);border:3px solid var(--bg)}
.setrow{display:flex;align-items:center;gap:10px;width:100%;min-height:52px;padding:6px 10px 6px 14px;border-radius:var(--radius-sm);border:1px solid var(--line);background:var(--surface);text-align:left;font-size:15px}
.setrow b{font-weight:700}
.setrow .v{margin-left:auto;color:var(--muted);font-size:13px}
/* 找外快送出後 */
.gig{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 12px;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--surface2);font-size:15px}
.gig b{font-weight:700}
.gig a,.bub .ctx a{margin-left:auto;min-height:44px;display:inline-flex;align-items:center;color:var(--ink);font-weight:700;text-underline-offset:3px}
/* 記號說明 */
.lgd{display:grid;grid-template-columns:64px 1fr;gap:6px 12px;align-items:center;font-size:14px}
.lgd .s{display:flex;align-items:center;justify-content:center;gap:4px;min-height:40px}
.lgd .d b{display:block;font-weight:700}
.lgd .d{color:var(--ink2);line-height:1.4}
.lgd .live{margin-left:0}
.lgd .bul{width:56px;margin:0}
.lgd .segs{width:56px}
.lgd .tag{margin:0;white-space:nowrap;font-size:11px}
.lgd .tface{display:block}
.faces{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center;font-size:12px;color:var(--ink2)}
.faces span.tface{display:grid;place-items:center;margin-bottom:2px}
/* 第 6 套外觀「塔塔橘」：橘色用在主卡、動作鍵、主要按鈕。只在 data-skin=6 生效，其他五套不受影響。 */
[data-skin="6"] .fab,[data-skin="6"] .btn.pri,[data-skin="6"] .key.eq{background:var(--x-accent-fill);color:var(--x-on-accent-fill);border-color:var(--x-accent-fill)}
[data-skin="6"] .fab{border-color:var(--bg)}
[data-skin="6"] .tab[aria-current="page"]::after{background:var(--x-accent-fill)}
.lkth[data-skin="6"]{--x-th-hero:linear-gradient(135deg,#FF7A1A 0%,#FF6700 55%,#F25C00 100%);--x-th-ink:#1F0E00}
.lkth[data-skin="6"] .lk-t b{background:#FF6700;color:#1F0E00}
[data-skin="6"] .strip,[data-skin="6"] .tile[data-k="left"],[data-skin="6"] .dcard[data-flip="d-left"]{background:var(--x-hero-bg);--ink:#1F0E00;--ink2:#1F0E00;--muted:#1F0E00;--bad:#1F0E00;--accent:#FFFFFF;--line:rgba(31,14,0,.38);--surface2:rgba(255,255,255,.42);--x-accent-fill:#1F0E00;--x-on-accent-fill:#FFF3E6;--surface:#FFF3E6;color:#1F0E00}
[data-skin="6"] .dcard[data-flip="d-left"] .btn:not(.pri){color:#1F0E00;border-color:rgba(31,14,0,.38)}
[data-skin="6"] .seg button[aria-pressed="true"],[data-skin="6"] .chip[aria-pressed="true"]{box-shadow:inset 0 -3px 0 var(--x-accent-fill)}
/* ===== 單 F2：併入 E2a～E2d 的新樣式（只加，不改 D 版既有規則） ===== */
/* E2a：三段進度（已入帳實心、待收款斜線、還差空白），不只靠顏色分 */
.g3{display:flex;height:8px;border-radius:var(--x-bar-r,4px);background:var(--surface2);border:1px solid var(--line);overflow:hidden;margin-top:8px}
.g3.big{height:14px;border-radius:var(--x-bar-r,7px)}

<script id="tata-face">
/*!
 * tata_face.js  塔塔的臉（設計提案版 1122-A3，單 E2c 在 1122-A2 上加入帳動畫，介面只加不改）
 * 單檔、零依賴。照 Grok Bot 內建頭像規格：blob（球體）、orange #FF6700、
 * 兩隻挖空直立膠囊眼、沒有嘴、沒有腮紅、沒有配件。
 *
 * 用法：
 *   var face = TataFace.mount(el, { mood: 'idle', size: 64, reduceMotion: undefined });
 *   face.setMood('over');            // idle logged over poke sleepy thinking alert
 *   face.setMood('logged', { label: '+1' });  // 舊呼叫照舊：小點落進身體、微彈、字往上飄（56px 以上才顯示字）
 *   face.setMood('logged', { amount: -120 }); // 記帳成功：字自動排成 −NT$120
 *   face.incoming(3500);                      // 收款入帳：字排成 +NT$3,500，動作大一點、帶一圈光
 *   face.incoming(3500, { currency: '$', label: undefined, kind: 'income' });  // 選項都可不給
 *   face.poke();                     // spin、bounce、nod 隨機一種
 *   face.destroy();
 *
 * 顏色：CSS 變數 --tata-body（預設 #FF6700）、--tata-eye（預設不填，眼睛挖空透出底色）。
 * 其他選項（都可不給）：shadow（地面影子）、followPointer（視線跟游標）、label（aria 名稱）。
 * 入帳顏色（都可不給）：--tata-token 小點色（預設同身體）、--tata-label 數字色（預設 currentColor）、
 *   --tata-label-in 收款數字色（預設 --good，再退 currentColor）。
 * logged 與 poke 是一次性動作，播完回到上一個常駐 mood，而且接回原本循環的同一個時間點，不從頭跑。
 * 尺寸小於 56px 不顯示數字，只有小點與微彈。減少動態時一次性動作只換眼形，身體與頭都不動。
 */
(function (root) {
  'use strict';

  var R = 44;                 // 球半徑（viewBox 單位，viewBox 是 -50 -50 100 100）
  var SEP = 17;               // 兩眼各離臉中心的角度
  var NS = 'http://www.w3.org/2000/svg';
  var PI = Math.PI, D2R = PI / 180;
  var MOOD_LIST = ['idle', 'logged', 'over', 'poke', 'sleepy', 'thinking', 'alert'];
  var MOOD_NAME = {
    idle: '待機', logged: '記帳成功', over: '超支', poke: '被點',
    sleepy: '想睡', thinking: '端詳', alert: '帳單將到期'
  };

  /* ---------- 小工具 ---------- */
  function clamp(x, a, b) { return x < a ? a : x > b ? b : x; }
  function ss(a, b, x) { var k = clamp((x - a) / (b - a), 0, 1); return k * k * (3 - 2 * k); }
  function ease(k) { return k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2; }
  function easeOut(k) { return 1 - Math.pow(1 - k, 3); }
  // 梯形包絡：a 到 b 升起，c 到 d 落下
  function bump(a, b, c, d, x) { return ss(a, b, x) * (1 - ss(c, d, x)); }
  // 眨眼：0.10 秒閉、0.16 秒開，合計 0.26 秒（k 可放慢）
  function blink(t, t0, k) {
    k = k || 1;
    var x = (t - t0) / k;
    if (x <= 0 || x >= 0.26) return 0;
    return x < 0.10 ? ease(x / 0.10) : 1 - ease((x - 0.10) / 0.16);
  }
  function blinks(t, list, k) {
    var m = 0;
    for (var i = 0; i < list.length; i++) { var v = blink(t, list[i], k); if (v > m) m = v; }
    return m;
  }
  // 金額排字：3500 → +NT$3,500；-120 → −NT$120；字串原樣用
  function fmtAmount(a, o) {
    if (typeof a === 'string') return a;
    if (typeof a !== 'number' || !isFinite(a)) return '';
    var cur = (o && o.currency != null) ? String(o.currency) : 'NT$';
    var n = String(Math.round(Math.abs(a) * 100) / 100).split('.');
    n[0] = n[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    return (a < 0 ? '\u2212' : '+') + cur + n.join('.');
  }
  function wrap180(a) { a = ((a + 180) % 360 + 360) % 360 - 180; return a; }

  /* ---------- 眼形：[寬, 高, 上下彎, 左右彎, 傾斜度, 下移]，單位是球半徑 ---------- */
  var EYE = {
    neutral: [0.21, 0.46, 0, 0, 0, 0],          // 直立膠囊
    happy:   [0.36, 0.15, 0.13, 0, 0, -0.02],   // 上彎弧
    sad:     [0.20, 0.36, 0, 0, 16, 0.05],      // 略斜下
    sleepy:  [0.36, 0.09, -0.10, 0, 0, 0.06],   // 下彎細弧
    wide:    [0.34, 0.46, 0, 0, 0, 0],          // 睜大變圓
    big:     [0.27, 0.54, 0, 0, 0, 0],          // 端詳：大的那隻
    small:   [0.17, 0.30, 0, 0, 0, 0.02],       // 端詳：小的那隻
    calm:    [0.20, 0.26, 0, 0, 0, 0.02]        // 半開
  };
  function mixEye(a, b, k) {
    if (k <= 0) return a; if (k >= 1) return b;
    var o = [];
    for (var i = 0; i < 6; i++) o[i] = a[i] + (b[i] - a[i]) * k;
    return o;
  }

  // 眼形輪廓：圓角矩形（膠囊）沿周長等距取 48 點，再做彎曲與傾斜。
  // 任何兩種眼形都是同一組參數插值，所以切換是連續變形，不硬換。
  var NPTS = 48;
  function eyePath(e, side, scale) {
    var w = Math.max(e[0], 0.02) * scale, h = Math.max(e[1], 0.02) * scale;
    var hw = w / 2, hh = h / 2, r = Math.min(hw, hh), sx = hw - r, sy = hh - r;
    var q = PI * r / 2, per = 4 * sx + 4 * sy + 4 * q;
    var by = e[2] * scale, bx = e[3] * scale * side;
    var rot = -side * e[4] * D2R, cr = Math.cos(rot), sr = Math.sin(rot);
    var dy = e[5] * scale, d = '';
    for (var i = 0; i < NPTS; i++) {
      var s = per * i / NPTS, x, y, a;
      if (s < sx) { x = s; y = -hh; }
      else if ((s -= sx) < q) { a = -PI / 2 + s / r; x = sx + r * Math.cos(a); y = -sy + r * Math.sin(a); }
      else if ((s -= q) < 2 * sy) { x = hw; y = -sy + s; }
      else if ((s -= 2 * sy) < q) { a = s / r; x = sx + r * Math.cos(a); y = sy + r * Math.sin(a); }
      else if ((s -= q) < 2 * sx) { x = sx - s; y = hh; }
      else if ((s -= 2 * sx) < q) { a = PI / 2 + s / r; x = -sx + r * Math.cos(a); y = sy + r * Math.sin(a); }
      else if ((s -= q) < 2 * sy) { x = -hw; y = sy - s; }
      else if ((s -= 2 * sy) < q) { a = PI + s / r; x = -sx + r * Math.cos(a); y = -sy + r * Math.sin(a); }
      else { s -= q; x = -sx + s; y = -hh; }
      var nx = x / hw, ny = y / hh;
      y += by * (nx * nx - 0.3333);
      x += bx * (ny * ny - 0.3333);
      var X = x * cr - y * sr, Y = x * sr + y * cr + dy;
      d += (i ? 'L' : 'M') + X.toFixed(4) + ' ' + Y.toFixed(4);
    }
    return d + 'Z';
  }

  /* ---------- 姿勢 ---------- */
  // yaw 左右轉、pitch 上下、roll 歪頭（度）；gx gy 視線；sq 垂直擠壓；ty 位移（半徑倍數，負的往上）；
  // sc 整體縮放；lid 眼皮（1 全閉）；glow 光暈；tok 入帳小點進度；lab 入帳數字進度；L R 兩眼眼形。
  var BASE = { yaw: 22, pitch: 21, roll: 24 };
  function pose(o) {
    var p = { yaw: BASE.yaw, pitch: BASE.pitch, roll: BASE.roll, gx: 0, gy: 0, sq: 1, ty: 0, sc: 1,
      lid: 0, glow: 0, tok: 0, lab: 0, L: EYE.neutral, R: EYE.neutral };
    for (var k in o) p[k] = o[k];
    return p;
  }
  var NUM = ['yaw', 'pitch', 'roll', 'gx', 'gy', 'sq', 'ty', 'sc', 'lid', 'glow'];
  function lerpPose(a, b, k) {
    var p = { tok: b.tok, lab: b.lab };
    for (var i = 0; i < NUM.length; i++) {
      var n = NUM[i], av = a[n];
      if (n === 'yaw') av = b.yaw + wrap180(av - b.yaw);   // 走最短的那一邊，轉圈後不會倒轉回來
      p[n] = av + (b[n] - av) * k;

  }

  /* ---------- 七個 mood ---------- */
  var W16 = 2 * PI / 16;
  var MOODS = {
    // 待機：16 秒大循環＝6 秒＋4 秒＋6 秒三小段（對應 Grok Bot Idle_A、Idle_B、Idle_D），
    // 所有週期都整除 16 秒，頭尾接得起來。呼吸 4 秒一輪。
    idle: {
      loop: 16, still: 0.3,
      fn: function (t) {
        var yaw = 14 + 19 * Math.sin(W16 * t) + 7 * Math.sin(3 * W16 * t + 1.3);
        var g = bump(9.0, 9.35, 10.1, 10.5, t);          // 第 9 秒往左下瞄一眼
        var b = Math.sin(2 * PI * t / 4);
        return pose({
          yaw: yaw,
          pitch: 20 + 8 * Math.sin(2 * W16 * t + 0.6) + 3 * Math.sin(5 * W16 * t),
          roll: 8 + 0.65 * yaw,
          gx: 0.25 * Math.sin(2 * W16 * t + 2.1) - 1.3 * g,
          gy: 0.2 * Math.sin(3 * W16 * t) - 0.9 * g,
          sq: 1 + 0.016 * b, ty: -0.006 * b,
          // 不等距眨眼；12.07 與 12.37 是連眨
          lid: blinks(t, [1.16, 4.0, 8.2, 10.59, 12.07, 12.37, 14.25])
        });
      }
    },

    // 記帳成功：小點從上方落進身體（0.42 秒），身體壓一下再微彈，眼睛上彎，數字往上飄淡出。2.3 秒。
    logged: {
      dur: 2.3, still: 1.5,
      fn: function (t) {
        var up = ss(0, 0.2, t) - ss(0.4, 0.62, t);
        var hap = ss(0.4, 0.66, t) * (1 - ss(1.95, 2.25, t));
        var hop = (t > 0.6 && t < 1.04) ? Math.sin(PI * (t - 0.6) / 0.44) : 0;
        var e = mixEye(mixEye(EYE.neutral, EYE.wide, ss(0, 0.15, t) * (1 - ss(0.4, 0.62, t))), EYE.happy, hap);
        return pose({
          yaw: 22 - 14 * hap, pitch: 21 + 16 * up - 3 * hap, roll: 24 - 18 * hap,
          sq: 1 - 0.09 * bump(0.38, 0.46, 0.5, 0.62, t) + 0.025 * hop
            - 0.05 * bump(1.02, 1.08, 1.11, 1.3, t) + 0.015 * bump(1.3, 1.4, 1.45, 1.65, t),
          ty: -0.13 * hop,
          tok: clamp(t / 0.42, 0, 1),
          lab: clamp((t - 0.46) / 1.45, 0, 1),
          L: e, R: e
        });
      }
    },

    // 收款入帳：同一套動作放大一級。壓得深一點、跳兩下、落點亮一圈光、開心久一點。2.7 秒。
    logged_in: {
      dur: 2.7, still: 1.6,
      fn: function (t) {
        var up = ss(0, 0.2, t) - ss(0.4, 0.62, t);
        var hap = ss(0.4, 0.66, t) * (1 - ss(2.3, 2.62, t));
        var h1 = (t > 0.6 && t < 1.08) ? Math.sin(PI * (t - 0.6) / 0.48) : 0;
        var h2 = (t > 1.14 && t < 1.46) ? Math.sin(PI * (t - 1.14) / 0.32) : 0;
        var e = mixEye(mixEye(EYE.neutral, EYE.wide, ss(0, 0.15, t) * (1 - ss(0.4, 0.62, t))), EYE.happy, hap);
        return pose({
          yaw: 22 - 16 * hap, pitch: 21 + 18 * up - 3 * hap, roll: 24 - 20 * hap,
          sq: 1 - 0.12 * bump(0.38, 0.46, 0.5, 0.62, t) + 0.035 * h1 + 0.02 * h2
            - 0.07 * bump(1.06, 1.11, 1.14, 1.22, t) - 0.04 * bump(1.44, 1.49, 1.52, 1.72, t),
          ty: -0.22 * h1 - 0.08 * h2,
          glow: bump(0.36, 0.5, 0.6, 1.5, t),
          tok: clamp(t / 0.42, 0, 1),
          lab: clamp((t - 0.46) / 1.75, 0, 1),
          L: e, R: e
        });
      }
    },

    // 超支：眼睛斜下、身體縮一點、整體慢一拍（呼吸 7 秒、眨眼放慢），每輪嘆一口氣再抬頭看你一眼。
    over: {
      loop: 7, still: 0.5,
      fn: function (t) {
        var s = bump(4.2, 4.8, 5.4, 5.9, t);
        var look = bump(5.9, 6.2, 6.5, 6.9, t);
        return pose({
          yaw: 6 + 6 * Math.sin(2 * PI * t / 7), pitch: -8 + 2 * Math.sin(4 * PI * t / 7) + 16 * look,
          roll: 4, gy: -0.3 + 0.5 * look,
          sc: 0.94, sq: 0.975 + 0.012 * Math.sin(2 * PI * t / 7) - 0.035 * s, ty: 0.04 + 0.02 * s,
          lid: blinks(t, [2.8, 6.55], 1.4),
          L: EYE.sad, R: EYE.sad
        });
      }
    },

    // 想睡（深夜）：眼睛下彎細弧、呼吸 8 秒一輪、頭慢慢垂下去，點一下頭驚醒，一隻眼半開又闔上。
    sleepy: {
      loop: 8, still: 1,
      fn: function (t) {
        var drop = ss(5.6, 6.5, t) * (1 - ss(6.5, 6.62, t));
        var peek = ss(6.6, 6.75, t) * (1 - ss(7.3, 7.8, t));
        return pose({
          yaw: 10, pitch: -10 - 4 * Math.sin(2 * PI * t / 8) - 12 * drop, roll: 14 + 6 * drop,
          sq: 1 + 0.03 * Math.sin(2 * PI * t / 8) + 0.02 * peek, ty: 0.03 + 0.03 * drop,
          L: EYE.sleepy, R: mixEye(EYE.sleepy, EYE.calm, peek)
        });
      }
    },

    // 端詳：一大一小，歪頭看一邊，再透過一次眨眼（0.35 秒）換邊。4.8 秒一輪。
    thinking: {
      loop: 4.8, still: 1,
      fn: function (t) {
        var s = ss(2.0, 2.4, t) - ss(4.4, 4.8, t);
        return pose({
          yaw: 18 - 30 * s, pitch: 25 + 2 * Math.sin(2 * PI * t / 2.4), roll: 14 - 24 * s,
          gy: 0.5, sq: 1.01,
          lid: 0.85 * blinks(t, [2.03, 4.43], 1.35),
          L: mixEye(EYE.big, EYE.small, s), R: mixEye(EYE.small, EYE.big, s)
        });
      }
    },

    // 帳單將到期：眼睛睜大瞄向右上，身體拉高，每 3.2 秒連跳兩下帶光暈，接一次連眨。
    alert: {
      loop: 3.2, still: 0.9,
      fn: function (t) {
        var pu = bump(0, 0.12, 0.14, 0.34, t) + bump(0.38, 0.5, 0.52, 0.72, t);
        return pose({
          yaw: 23, pitch: 27, roll: 22, gx: 0.4, gy: 0.5,
          sq: 1.03 + 0.03 * pu, sc: 1 + 0.05 * pu, ty: -0.05 * pu,
          glow: ss(0, 0.12, t) * (0.25 + 0.75 * Math.exp(-2.4 * t)),
          lid: blinks(t, [1.9, 2.2]),
          L: EYE.wide, R: EYE.wide
        });
      }
    },

    // 被點的三種反應
    poke_spin: {
      dur: 1.0, still: 0.5,

function onColor(v){try{const p=document.createElement('i');p.style.color='var('+v+')';phone.appendChild(p);const col=getComputedStyle(p).color;p.remove();const c=document.createElement('canvas');c.width=c.height=1;const x=c.getContext('2d');x.fillStyle=col;x.fillRect(0,0,1,1);const d=x.getImageData(0,0,1,1).data;const f=u=>{u/=255;return u<=.03928?u/12.92:Math.pow((u+.055)/1.055,2.4)};const L=.2126*f(d[0])+.7152*f(d[1])+.0722*f(d[2]);return L>.3?'#111':'#fff'}catch(e){return '#111'}}

  if(!rollOn||rm||from==null||from===to)return;const t0=performance.now();(function step(t){const p=Math.min((t-t0)/380,1),e=1-Math.pow(1-p,3);el.textContent=fmt(from+(to-from)*e);if(p<1&&el.isConnected)requestAnimationFrame(step)})(t0)})}

  if(INSTS.length||DEBTS.length)h+='<h2 class="h3">其他負債 <span class="sub">分期與欠款</span></h2><section class="card"><div class="list">'+INSTS.map(x=>'<button class="row" data-act="sheet" data-k="inst" data-id="'+x.id+'"><span class="g" aria-hidden="true">期</span><span class="row-m"><b>'+esc(x.n)+'</b><small>分期'+(x.left!=null?' · 還有 '+x.left+' 期':'')+(x.per!=null?'，每期 '+fmt(x.per):'')+'</small></span>'+amt(-x.out,{c:'neg'})+CHEV+'</button>').join('')+DEBTS.map(x=>'<button class="row" data-act="sheet" data-k="debt" data-id="'+x.id+'"><span class="g" aria-hidden="true">欠</span><span class="row-m"><b>'+esc(x.n)+'</b><small>欠款 · 已還 '+fmt(x.paid)+' / 本金 '+fmt(x.prin)+'</small></span>'+amt(-x.rem,{c:'neg'})+CHEV+'</button>').join('')+'</div></section>';
  if(arch.length)h+='<h2 class="h3">停用的帳戶 <span class="sub">'+arch.length+' 個</span></h2><section class="card"><div class="list">'+arch.map(a=>acctRow(a,0,1,true)).join('')+'</div></section>';
  return h+'<p class="sub">待歸戶：沒指定帳戶的舊交易會列在這裡。</p>';
}

/* ---------- 統計（預算分頁的第二段）：類別占比、近 6 期收支 ---------- */
const SHADE=[1,.78,.6,.46,.34,.25,.18,.13,.1,.08,.06];
function shareData(d){const all=d.cats.filter(c=>c.s>0).map(c=>({k:c.k,g:c.g,s:c.s,n:c.n})).concat(d.un.s>0?[{k:'未分類',g:'？',s:d.un.s,n:d.un.n}]:[]).sort((a,b)=>b.s-a.s);
  const inc=all.filter(c=>!S.exc.has(c.k));return{all:all,inc:inc,total:inc.reduce((a,c)=>a+c.s,0),whole:all.reduce((a,c)=>a+c.s,0)}}
function shareChart(sd){let x=0;return '<div class="ch" id="chShare" role="img" aria-label="支出類別占比：'+sd.inc.slice(0,4).map(c=>c.k+' '+pc(c.s/sd.total)).join('、')+'"><svg viewBox="0 0 100 9" preserveAspectRatio="none" width="100%" height="28" aria-hidden="true">'+sd.inc.map((c,i)=>{const w=c.s/sd.total*100,r='<rect x="'+(x+.2).toFixed(2)+'" y="0" width="'+Math.max(w-.4,.2).toFixed(2)+'" height="9" fill="var(--ink)" opacity="'+SHADE[Math.min(i,10)]+'"/>';x+=w;return r}).join('')+'</svg></div>'}
function shareRows(sd,max){return '<div class="list">'+sd.all.slice(0,max||99).map(c=>{const ex=S.exc.has(c.k),un=c.k==='未分類';
  return '<div class="row arow'+(ex?' exr':'')+'"><button class="rowb" data-act="'+(un?'goUn':'sheet')+'" data-k="cat" data-id="'+c.k+'"><span class="g" aria-hidden="true">'+c.g+'</span><span class="row-m"><b>'+c.k+'</b><small>'+(ex?'已排除，不算進合計':pc(c.s/sd.total)+' · '+c.n+' 筆')+'</small>'+(ex?'':'<span class="hbar" style="display:block;min-height:0;margin-top:4px"><span class="t" style="display:block;height:6px"><span style="--p:'+(c.s/sd.inc[0].s).toFixed(3)+'"></span></span></span>')+'</span>'+amt(c.s)+CHEV+'</button><button class="mv" data-act="exc" data-c="'+c.k+'" aria-pressed="'+ex+'" aria-label="'+(ex?'把'+c.k+'加回統計':'統計時排除'+c.k)+'">'+(ex?IC.eyeOff:IC.eye)+'</button></div>'}).join('')+'</div>'}
function shareBlock(d,max){const sd=shareData(d);
  if(!sd.all.length)return '<div class="empty"><h2>這一期還沒有支出</h2><p>記下第一筆支出，這裡就會出現分類占比。</p></div>';
  const ex=sd.all.filter(c=>S.exc.has(c.k)).map(c=>c.k);
  return (ex.length?'<p class="sub">已排除：'+ex.join('、')+'。合計 '+fmt(sd.total)+'（全部 '+fmt(sd.whole)+'）　'+B('excAll','全部加回')+'</p>':'')
    +(sd.inc.length?shareChart(sd)+'<p class="sub num">合計 <b style="color:var(--ink)">'+fmt(sd.total)+'</b>　平均每天 <b style="color:var(--ink)">'+fmt(sd.total/(d.day||1))+'</b></p>':'<div class="empty"><h2>全部分類都排除了</h2><p>點右邊的眼睛把分類加回來。</p></div>')
    +shareRows(sd,max)+(max&&sd.all.length>max?B('sheet','看全部 '+sd.all.length+' 類',{cls:'wide',k:'statcat'}):'');
}
function trendData(d){return TREND.concat([[mdShort(KD.o?KD.o.period_start:todayISO()),d.income,d.spent,1]])}
function trendChart(td){const W=320,H=150,base=122,mx=Math.max.apply(null,td.map(r=>Math.max(r[1],r[2])))||1,gw=W/6,hh=v=>Math.max(2,v/mx*104);
  return '<p class="sub lg"><span><i></i>收入</span><span><i class="f"></i>支出</span><span>點一期看數字</span></p><div class="ch tr" id="chTrend"><svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="近 6 期收入與支出長條圖"><line x1="0" y1="'+base+'" x2="'+W+'" y2="'+base+'" stroke="var(--line)"/>'
    +td.map((r,i)=>{const cx=gw*i+gw/2,a=hh(r[1]),b=hh(r[2]);return '<rect x="'+(cx-15)+'" y="'+(base-a).toFixed(1)+'" width="13" height="'+a.toFixed(1)+'" rx="2" fill="var(--surface2)" stroke="var(--ink)" stroke-width="1.5"'+(r[3]?' stroke-dasharray="3 2"':'')+'/><rect x="'+(cx+2)+'" y="'+(base-b).toFixed(1)+'" width="13" height="'+b.toFixed(1)+'" rx="2" fill="var(--ink)"'+(r[3]?' opacity=".55"':'')+'/><text x="'+cx+'" y="'+(H-12)+'" text-anchor="middle">'+r[0]+'</text>'+(r[3]?'<text x="'+cx+'" y="'+(H-1)+'" text-anchor="middle">這期</text>':'')}).join('')
    +'</svg><div class="tcols">'+td.map((r,i)=>'<button data-act="sheet" data-k="period" data-id="'+i+'" aria-label="'+r[0]+' 那一期：收入 '+fmt(r[1])+'，支出 '+fmt(r[2])+'"></button>').join('')+'</div></div>'}
function trendTable(td){return '<table class="tbl"><thead><tr><th>期間</th><th>收入</th><th>支出</th><th>結餘</th></tr></thead><tbody>'+td.slice().reverse().map(r=>'<tr><td>'+r[0]+(r[3]?'（這期）':'')+'</td><td>'+fmt(r[1])+'</td><td>'+fmt(r[2])+'</td><td>'+sgn(r[1]-r[2])+'</td></tr>').join('')+'</tbody></table>'}
function statsPage(d){
  if(d.err)return errBlock();

    return '<div class="deck"><div class="segs" role="progressbar" aria-label="統計" aria-valuemin="1" aria-valuemax="2" aria-valuenow="'+(i+1)+'" aria-valuetext="第 '+(i+1)+' 張，共 2 張"><i class="'+(i===0?'on':'done')+'"></i><i class="'+(i===1?'on':'')+'"></i></div><div class="deck-stage">'+b+'</div><div class="deck-nav">'+B('pprev','‹ 類別占比',{k:'s',dis:i===0})+'<span class="num">'+(i+1)+' / 2</span>'+B('pnext','近 6 期 ›',{k:'s',dis:i===1})+'</div></div>'}
  const head=S.v==='A'?msg('ssum',top?'這期花最多的是 <b>'+top.k+'</b>，占 <b>'+pc(top.s/sd.total)+'</b>。近 5 期平均每期花 <b>'+fmt(avg)+'</b>。':'這一期還沒有支出。近 5 期平均每期花 <b>'+fmt(avg)+'</b>。')
    :'<div class="two"><div class="card tile"><span class="lab">這期支出合計</span><span class="mid">'+amt(sd.total)+'</span><span class="sub">平均每天 '+fmt(sd.total/(d.day||1))+'</span></div><div class="card tile"><span class="lab">近 5 期平均</span><span class="mid">'+amt(avg)+'</span><span class="sub">每期支出</span></div></div>';
  return head+'<section class="card" data-flip="st-share"><h2 class="h3">支出類別占比 <span class="sub">'+P.label+'</span></h2>'+shareBlock(d,S.v==='B'?5:0)+'</section>'
    +'<section class="card" data-flip="st-trend"><h2 class="h3">近 6 期收支</h2>'+trendChart(td)+trendTable(td)+'</section>';
}
function bsegBar(){return '<div class="seg" role="group" aria-label="預算或統計"><button data-act="bseg" data-c="budget" aria-pressed="'+(S.bseg!=='stats')+'">預算</button><button data-act="bseg" data-c="stats" aria-pressed="'+(S.bseg==='stats')+'">統計</button></div>'}

function subSum(d){const own=d.subs.filter(s=>!s.co),wk=own.filter(s=>s.rel>=0&&s.rel<=7),co=d.subs.filter(s=>s.co).reduce((a,s)=>a+(s.cyc==='年'?s.amt/12:s.amt),0),yr=own.filter(s=>s.cyc==='年'&&s.rel<=17).reduce((a,s)=>a+s.amt,0),cn=d.subs.filter(s=>s.cancel);

    +cn.map(s=>'<p class="cf-why" data-cancel-note="'+s.id+'"><span class="eyes" role="img" aria-label="塔塔說" title="塔塔說"></span>「'+esc(s.name)+'」標了要取消，'+(s.cancelBy||s.due)+' 前要退。到期前 3 天我會再提醒。</p>').join('')}

/* ---------- 預算：三種版樣 ---------- */
const catSort=d=>d.cats.slice().sort((a,b)=>b.s/b.b-a.s/a.b);
function unRow(d){return d.un.n?'<div class="row" style="min-height:60px"><span class="g" aria-hidden="true">？</span><span class="row-m"><b>未分類</b><small>'+d.un.n+' 筆 · '+fmt(d.un.s)+'</small></span>'+B('goUn','補分類',{cls:'pri'})+'</div>':''}
function catRow(c,d){return '<button class="row" data-act="sheet" data-k="cat" data-id="'+c.k+'" style="flex-wrap:wrap"><span class="g" aria-hidden="true">'+c.g+'</span><span class="row-m"><b>'+c.k+'</b><small>'+(c.s?c.n+' 筆 · 預算 '+fmt(c.b):'還沒花 · 預算 '+fmt(c.b))+'</small></span>'+amt(c.s)+'<span class="chev" aria-hidden="true">›</span><span style="flex-basis:100%;padding-left:46px">'+(c.s?bul(c.s/c.b,d.pT):'')+'</span></button>'}
function budgetExtras(d){return '<div class="list card">'+'<button class="row" data-act="sheet" data-k="income"><span class="g" aria-hidden="true">入</span><span class="row-m"><b>收入目標</b><small>'+fmt(d.income)+' / '+fmt(TARGET)+'</small></span><span class="num">'+pc(d.income/TARGET)+'</span><span class="chev" aria-hidden="true">›</span></button><button class="row" data-act="perGo" data-c="-1"><span class="g" aria-hidden="true">回</span><span class="row-m"><b>上期回顧</b><small>'+PLf(-1)[0]+'</small></span><span class="chev" aria-hidden="true">›</span></button><button class="row" data-act="acct"><span class="g" aria-hidden="true">帳</span><span class="row-m"><b>帳戶</b><small>可動用現金、負債</small></span><span class="chev" aria-hidden="true">›</span></button></div>'}
function budgetA(d){

/* ---------- 定期（帳單與訂閱）：三種版樣 ---------- */
function fixedItems(d){return d.bills.concat(d.subs).sort((a,b)=>a.rel-b.rel)}
function fixedA(d){
  if(d.err)return errBlock();const all=fixedItems(d).filter(x=>S.ff==='all'||x.type===S.ff),open=all.filter(x=>!x.paid),paid=all.filter(x=>x.paid);
  const wk=fixedItems(d).filter(x=>!x.paid&&!x.co&&x.rel<=7&&x.rel>=0),grp=[['這 7 天',x=>x.rel<=7],['這期內（到 '+P.end+'）',x=>x.rel>7&&x.rel<=P.left],['之後',x=>x.rel>P.left]];
  let h=msg('fsum',wk.length?'接下來 7 天要扣 <b>'+wk.length+' 筆</b>，共 <b>'+fmt(wk.reduce((a,x)=>a+x.amt,0))+'</b>。':'接下來 7 天沒有要扣的。',null,wk.length?'':'quiet');

  h+=grp.map(g=>{const xs=open.filter(g[1]);return xs.length?'<p class="day" style="text-align:left">'+g[0]+'</p><section class="card"><div class="list">'+xs.map(fxRow).join('')+'</div></section>':''}).join('');
  if(paid.length)h+=S.showPaid?'<p class="day" style="text-align:left">已繳</p><section class="card"><div class="list">'+paid.map(fxRow).join('')+'</div></section>':B('showPaid','已繳 '+paid.length+' 筆，點開看',{cls:'wide'});
  return h+B('sheet','新增訂閱',{cls:'wide',k:'subAdd'});
}
function fixedB(d){
  if(d.err)return errBlock();const open=fixedItems(d).filter(x=>!x.paid),inP=open.filter(x=>x.rel<=P.left&&!x.co);
  let h='<div class="two"><div class="card tile"><span class="lab">訂閱每月平均</span><span class="mid">'+amt(d.subAvg)+'</span><span class="sub">'+d.subs.filter(s=>!s.co).length+' 個自己付</span></div><div class="card tile"><span class="lab">這期還要扣</span><span class="mid">'+amt(inP.reduce((a,x)=>a+x.amt,0))+'</span><span class="sub">'+inP.length+' 筆</span></div></div>';
  h+=subSum(d);

  const ub=d.bills.filter(b=>!b.paid);

  h+='<h2 class="h3">訂閱 <span class="sub">'+d.subs.length+' 個</span></h2><section class="card"><div class="list">'+d.subs.map(fxRow).join('')+'</div></section>';
  return h+B('sheet','新增訂閱',{cls:'wide',k:'subAdd'});

function fixedC(d){
  if(d.err)return errBlock();const xs=fixedItems(d).filter(x=>!x.paid),n=xs.length;
  if(!n)return '<div class="empty"><h2>沒有要扣的</h2><p>這期的帳單都繳了，也沒有訂閱。</p></div>';

/* 計算機：算式字串只含 0-9 . + - * /，先乘除後加減，結果取到小數 2 位 */
const OPS='+-*/';
function calcEval(ex){
  let s=ex;while(s&&(OPS.includes(s.slice(-1))||s.slice(-1)==='.'))s=s.slice(0,-1);
  if(!s)return{empty:1};
  const tk=s.match(/\d+\.?\d*|[+\-*/]/g)||[],nums=[],ops=[],pr=o=>o==='+'||o==='-'?1:2;let bad=false;
  const ap=()=>{const o=ops.pop(),b=nums.pop(),a=nums.pop();if(o==='/'&&b===0){bad=true;nums.push(0);return}nums.push(o==='+'?a+b:o==='-'?a-b:o==='*'?a*b:a/b)};
  tk.forEach(t=>{if(OPS.includes(t)){while(ops.length&&pr(ops[ops.length-1])>=pr(t))ap();ops.push(t)}else nums.push(parseFloat(t))});
  while(ops.length)ap();
  if(bad)return{err:'不能除以 0'};
  const v=Math.round((nums[0]+Number.EPSILON)*100)/100;
  if(!isFinite(v))return{err:'算不出來，請清除重打'};
  if(v===0&&!/[+\-*/]/.test(s))return{empty:1};
  if(v<=0)return{v:v,err:'金額要大於 0，收入或支出請用上方分段選方向'};
  return{v:v};
}

  else if(OPS.includes(k)){if(!ex)return;if(OPS.includes(last))ex=ex.slice(0,-1)+k;else ex=(last==='.'?ex.slice(0,-1):ex)+k}
  else if(k==='.'){if(cur.includes('.'))return;ex+=(cur===''?'0':'')+'.'}

function swClose(r){r=r||swOpen;if(!r)return;r.classList.remove('open');swSet(r,0,true);setTimeout(()=>{if(!r.classList.contains('open'))r.classList.remove('drag');},230);if(swOpen===r)swOpen=null;}
document.addEventListener('touchstart',ev=>{
  const t=ev.touches[0],tg=ev.target,r=tg.closest?tg.closest('.swr'):null;
  if(swOpen&&!document.body.contains(swOpen))swOpen=null;
  const onAct=!!(tg.closest&&tg.closest('.swact'));
  if(swOpen&&swOpen!==r&&!onAct){swClose();swBlock=Date.now()+450;}
  if(!r||onAct||ev.touches.length>1||(tg.closest&&tg.closest('.grip'))){swS=null;return;}
  swS={r,x:t.clientX,y:t.clientY,base:swOpen===r?-SWW:0,lock:null,cur:null};
},{passive:true});
document.addEventListener('touchmove',ev=>{
  const s=swS;if(!s)return;const t=ev.touches[0],dx=t.clientX-s.x,dy=t.clientY-s.y;
  if(!s.lock){
    if(Math.abs(dx)<8&&Math.abs(dy)<8)return;
    s.lock=Math.abs(dx)>Math.abs(dy)*1.5?'h':'v';
    if(s.lock==='v'){if(swOpen)swClose();swS=null;return;}
  }
  let x=Math.max(-SWW-30,Math.min(0,s.base+dx));if(x<-SWW)x=-SWW+(x+SWW)/3;
  s.cur=x;swSet(s.r,x,false);if(ev.cancelable)ev.preventDefault();
},{passive:false});
function swEnd(){
  const s=swS;swS=null;if(!s||s.lock!=='h')return;
  const x=s.cur==null?s.base:s.cur,open=s.base===0?x<-SWW*0.4:x<-SWW*0.6;
  swBlock=Date.now()+400;
  if(open){if(swOpen&&swOpen!==s.r)swClose();swOpen=s.r;s.r.classList.add('open');swSet(s.r,-SWW,true);}
  else{s.r.classList.remove('open');if(swOpen===s.r)swOpen=null;swSet(s.r,0,true);setTimeout(()=>{if(!s.r.classList.contains('open'))s.r.classList.remove('drag');},230);}
}

/* 回報全文：每則標出在回哪裡 */
function thRepList() {
  var rows = (Array.isArray(KD.reps) ? KD.reps : (KD.reps && KD.reps.items)) || [];
  if (!rows.length) return '<p class="gray-line">還沒有回報。</p>';
  var open = THX.repAll, vis = open ? rows : rows.slice(0, 5);
  return '<div class="reps">' + vis.map(function (r) {
    var q = String(r.request_text || '').replace(/（關於[^）]*）\s*$/, ''), long = String(r.text || '').length > 60;
    return '<div class="rep2' + (long ? ' th-cl' : '') + '"><p class="rep-h"><span class="rep-w">' + thEsc(thWhere(r)) + '</span><span class="rep-t">' + thTime(r.created_at) + '</span></p>'
      + (q ? '<p class="rep-q"><span class="th-w">你</span>' + thEsc(q.length > 40 ? q.slice(0, 40) + '…' : q) + '</p>' : '') + '<p class="rep-a"><span class="th-x">' + thEsc(r.text) + '</span>' + (long ? '<button type="button" class="th-tog" data-th-tog>看全文</button>' : '') + '</p></div>';
  }).join('') + '</div>' + (rows.length > 5 && !open ? '<button type="button" class="th-more" data-rep-all>看更早的 ' + (rows.length - 5) + ' 則</button>' : '');
}
document.addEventListener('click', function (e) { var b = e.target.closest && e.target.closest('[data-rep-all]'); if (!b) return; e.stopPropagation(); THX.repAll = 1; renderSheetBody(); }, true);
function kkTidyAbc(root) {

}
/* ---------- v34.1 A/B/C：卡費進下一筆要繳、欠款分期上首頁、訂閱交給塔塔、卡片都能互動 ---------- */
function ccDues() {
  var t = todayISO(), y = +t.slice(0, 4), m = +t.slice(5, 7), dd = +t.slice(8, 10);
  return S.accts.filter(function (a) { return a.k === 'credit_card' && !a.arch && a.bal < 0 && a.due; }).map(function (a) {
    var Y = y, M = m; if (dd > a.due) { M++; if (M > 12) { M = 1; Y++; } }
    var last = new Date(Y, M, 0).getDate(), iso = Y + '-' + String(M).padStart(2, '0') + '-' + String(Math.min(a.due, last)).padStart(2, '0');
    return { type: 'bill', id: 'cc' + a.rid, name: a.n + ' 卡費', amt: -a.bal, due: mdOf(iso), rel: dayDiff(iso, t), paid: false, card: 1, acId: a.id, ac: a.n, c: '卡費', tata: false };
  });
}
function debtCard(d) {
  var rows = [];
  S.accts.filter(function (a) { return a.k === 'credit_card' && !a.arch && a.bal < 0; }).forEach(function (a) { var x = d.bills.filter(function (b) { return b.id === 'cc' + a.rid; })[0]; rows.push(['acct', a.id, a.n + ' 卡費', -a.bal, x ? x.due + ' 截止，' + rel(x.rel) : '沒有日子']); });
  DEBTS.filter(function (x) { return x.rem > 0; }).forEach(function (x) { rows.push(['debt', x.id, x.n, x.rem, '沒有日子']); });
  INSTS.forEach(function (x) { rows.push(['inst', x.id, x.n, x.out, x.next ? '下次 ' + x.next + (x.per ? '，繳 ' + fmt(x.per) : '') : '沒有日子']); });
  if (!rows.length) return '';
  return '<section class="card kk-debt" data-ctitle="欠款、卡費、分期"><h2 class="h3">欠款、卡費、分期</h2><div class="list">'
    + rows.map(function (r) { return '<button class="row" data-act="sheet" data-k="' + r[0] + '" data-id="' + r[1] + '"><span class="row-m"><b>' + esc(r[2]) + '</b><small>' + r[4] + '</small></span>' + amt(-r[3], { c: 'neg' }) + CHEV + '</button>'; }).join('') + '</div></section>';
}
/* 直接送一段話給塔塔（訂閱請求、卡片），回覆進同一串 */
function thSendDirect(org, lab, q, text) {

  var t = thNew(org, lab, q, text); thPaint(); thReveal(t);
  kkRefresh({ action: 'message', text: text, client_id: t.cid }).then(function (j) { thMark(t, j); thReveal(t); }).catch(function (e) { thMark(t, null, e.message); });
}

function subAskText(x, k) {
  var info = '「' + x.name + '」NT$' + fmt(x.amt) + '／' + (x.cyc || '月') + '繳，下次扣款 ' + (x.due || '沒有日子') + (x.cancelBy ? '，取消期限 ' + x.cancelBy : '');
  return k === 'self' ? '[面板：老大自己處理了] ' + info + '。老大已經自己處理，請你核對後更新記帳。' : '[面板請塔塔' + SUBL[k] + '] ' + info + '。請你執行' + SUBL[k] + '，處理完回報。';
}

var GRIPT = null;
