<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="robots" content="noindex"><meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="塔塔記帳">
<meta name="theme-color" content="#f99b1d"><meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="apple-touch-icon.png?v=20261116f"><link rel="icon" href="favicon-32.png?v=20261116f">
<title>塔塔記帳</title>
<script>
/* error overlay + load watchdog: runs first, so a failure is visible instead of a black screen */
(function(){
  var box;
  function show(m,slow){
    try{
      if(!box){box=document.createElement('div');box.id='kkdie';
        box.style.cssText='position:fixed;left:12px;right:12px;top:calc(12px + env(safe-area-inset-top));z-index:99999;background:#4a1a1d;color:#ffd7d5;font:14px/1.5 -apple-system,sans-serif;padding:12px 14px;border-radius:14px;box-shadow:0 8px 24px rgba(0,0,0,.4);word-break:break-all';
        (document.body||document.documentElement).appendChild(box);}
      box.innerHTML='';if(slow)box.setAttribute('data-slow','1');else box.removeAttribute('data-slow');
      var t=document.createElement('div');t.textContent=(slow?'':'頁面出錯：')+m;box.appendChild(t);
      var b=document.createElement('button');b.textContent='重新整理';b.style.cssText='margin:8px 8px 0 0;min-height:44px;padding:0 16px;border:0;border-radius:10px;background:#f99b1d;color:#fff;font-size:16px;font-weight:700';
      b.onclick=function(){location.reload();};box.appendChild(b);
      var c=document.createElement('button');c.textContent='清除快取再試';c.style.cssText='margin-top:8px;min-height:44px;padding:0 16px;border:0;border-radius:10px;background:#555;color:#fff;font-size:16px';
      c.onclick=function(){var p=[];try{if(navigator.serviceWorker)p.push(navigator.serviceWorker.getRegistrations().then(function(rs){return Promise.all(rs.map(function(r){return r.unregister();}));}));if(window.caches)p.push(caches.keys().then(function(ks){return Promise.all(ks.map(function(k){return caches.delete(k);}));}));}catch(e){}Promise.all(p).then(function(){location.reload();},function(){location.reload();});};
      box.appendChild(c);
    }catch(e){}
  }
  window.__kkShow=show;
  window.addEventListener('error',function(e){
    var t=e.target;
    if(t&&t!==window&&(t.tagName==='SCRIPT'||t.tagName==='LINK')&&(t.src||t.href)){show('載入失敗：'+String(t.src||t.href).split('?')[0].split('#')[0].split('/').pop());return;}
    show((e.message||'未知錯誤')+(e.lineno?'（第 '+e.lineno+' 行）':''));
  },true);
  window.addEventListener('unhandledrejection',function(e){var r=e.reason;show(String((r&&r.message)||r||'未知錯誤'));});
  setTimeout(function(){if(!window.__kkReady)show('載入比平常慢，網路可能不穩。',true);},8000);
})();
</script>
<style>
:root{--bg:#f2f2f7;--card:#fff;--grp:#e9e9ef;--line:#e5e5ea;--tx:#1c1c1e;--mut:#8e8e93;--press:#ececf1;--org:#f99b1d;--orgd:#e48a0c;--exp:#e5484d;--inc:#16a765;--warn:#f99b1d;--key:#fff;--keyd:#e3e3e9;--sab:env(safe-area-inset-bottom,0px);--sat:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root{--bg:#000;--card:#1c1c1e;--grp:#121214;--line:#2c2c2e;--tx:#f2f2f7;--mut:#8e8e93;--press:#2a2a2d;--org:#d98410;--orgd:#c4740a;--exp:#ff6369;--inc:#32d583;--key:#2c2c2e;--keyd:#3a3a3d}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none;background:var(--bg);-webkit-text-size-adjust:100%}
body{color:var(--tx);font:16px/1.4 -apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans CJK TC","Microsoft JhengHei",sans-serif;position:fixed;inset:0;width:100%}
button,.chip,.tb,.tx,.cat,.keypad{-webkit-user-select:none;user-select:none}
button,input{font:inherit;color:inherit;border:0;background:none;touch-action:manipulation;margin:0}
button{cursor:pointer;padding:0}
input{-webkit-appearance:none;appearance:none;border-radius:0}
[hidden]{display:none!important}
.num{font-variant-numeric:tabular-nums}.mut{color:var(--mut)}
#shell{position:fixed;inset:0;display:flex;flex-direction:column;max-width:520px;margin:0 auto;background:var(--bg)}
/* header */
#top{flex:none;background:var(--org);color:#fff;padding-top:var(--sat);z-index:30}
.bar{height:48px;display:grid;grid-template-columns:96px 1fr 96px;align-items:center;padding:0 4px}
.bar h1{margin:0;font-size:18px;font-weight:700;text-align:center;white-space:nowrap}
.bar h1 i{display:inline-block;width:8px;height:8px;border-radius:4px;background:rgba(255,255,255,.45);margin-left:6px;vertical-align:middle;transition:background .3s}
.bar h1 i.on{background:#b8ffcf;box-shadow:0 0 6px #b8ffcf}
.hbtn{height:44px;min-width:44px;display:flex;align-items:center;font-size:15px;font-weight:600;color:#fff}
.hbtn:active{opacity:.55}
#refresh{justify-content:flex-start;padding-left:10px;font-size:22px}
#showvoid{justify-content:flex-end;padding-right:6px}
#showvoid span{height:30px;line-height:28px;padding:0 11px;border:1.5px solid rgba(255,255,255,.85);border-radius:15px;font-size:13px;white-space:nowrap}
#showvoid[aria-pressed=true] span{background:#fff;color:var(--orgd)}
.pnav{height:46px;background:var(--card);display:grid;grid-template-columns:56px 1fr 56px;align-items:center;border-bottom:1px solid var(--line);color:var(--tx)}
.pnav button{height:46px;font-size:26px;color:var(--org);font-weight:300}
.pnav button:active{opacity:.4}.pnav button:disabled{opacity:.25}
.pnav .pl{text-align:center;font-size:17px;font-weight:700;white-space:nowrap}
.pnav .pl em{font-style:normal;font-size:12px;font-weight:600;color:#fff;background:var(--org);border-radius:8px;padding:2px 7px;margin-left:8px;vertical-align:2px}
.pnav .pl em.old{background:var(--mut)}
/* scroll area */
#scroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding-bottom:24px}
.gate{text-align:center;padding:90px 20px;color:var(--mut)}
.gate .em{font-size:44px;margin-bottom:8px}
.paste{display:flex;gap:8px;max-width:400px;margin:18px auto 0}
.paste input{flex:1;min-width:0;min-height:48px;border-radius:12px;background:var(--card);padding:0 12px;font-size:16px;color:var(--tx);border:1.5px solid var(--line)}
.paste button{flex:none;min-height:48px;padding:0 20px;border-radius:12px;background:var(--org);color:#fff;font-weight:700}
.paste button:active{background:var(--orgd)}
.sk{height:200px;background:linear-gradient(90deg,var(--card),var(--press),var(--card));background-size:200% 100%;animation:sk 1.2s linear infinite}
@keyframes sk{to{background-position:-200% 0}}
/* summary card */
.sumcard{background:var(--card);padding:14px 16px 14px;border-bottom:1px solid var(--line)}
.sumcard .k{font-size:13px;color:var(--mut);text-align:center}
.sumcard .big{font-size:38px;font-weight:700;text-align:center;color:var(--exp);line-height:1.15;letter-spacing:-.5px}
.sumcard .big small{font-size:17px;font-weight:600;margin-right:4px}
.cols3{display:grid;grid-template-columns:1fr 1fr 1fr;margin-top:12px;padding-top:10px;border-top:1px solid var(--line);text-align:center}
.cols3>div+div{border-left:1px solid var(--line)}
.cols3 b{display:block;font-size:17px;white-space:nowrap}
.cols3>div>span{font-size:12.5px;color:var(--mut)}
.cols3 b span{color:inherit;font-size:inherit}
.prog{margin-top:12px}
.prog .bar2{height:8px;border-radius:4px;background:var(--grp);overflow:hidden}
.prog .bar2 i{display:block;height:100%;width:0;border-radius:4px;background:linear-gradient(90deg,#f9b23d,var(--org));transition:width .5s ease}
.prog .meta{display:flex;justify-content:space-between;font-size:12.5px;color:var(--mut);margin-top:6px}
/* grouped lists */
.gh{display:flex;justify-content:space-between;align-items:center;min-height:32px;padding:5px 16px;background:var(--grp);color:var(--mut);font-size:13px;font-weight:600}
.gh b{color:var(--tx);font-weight:600;font-size:14px;margin-right:8px}
.gh .num{white-space:nowrap}
.rows{background:var(--card)}
.tx{display:flex;align-items:center;gap:12px;min-height:64px;padding:8px 16px;border-bottom:1px solid var(--line);width:100%;text-align:left;background:var(--card)}
.tx:last-child{border-bottom:0}
.tx:active,.cardrow:active{background:var(--press)}
.ico{flex:none;width:40px;height:40px;border-radius:20px;background:var(--bg);display:grid;place-items:center;font-size:22px}
.mid{flex:1;min-width:0}
.ttl{font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{display:flex;align-items:center;gap:6px;margin-top:3px;font-size:13px;color:var(--mut);min-width:0}
.sub .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.tag{flex:none;font-size:12px;line-height:1;padding:3px 7px;border-radius:7px;font-weight:600;color:#fff}
.right{flex:none;text-align:right;max-width:46%}
.amt{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.amt.expense{color:var(--exp)}.amt.income{color:var(--inc)}.amt.transfer,.amt.reimbursement{color:var(--mut)}
.acct{font-size:12px;color:var(--mut);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx.void{opacity:.5}.tx.void .amt,.tx.void .ttl{text-decoration:line-through}
.empty{background:var(--card);padding:30px 20px;text-align:center;color:var(--mut);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:200px}
.empty .em{font-size:40px}.empty b{color:var(--tx);font-size:16px}.empty span{font-size:13.5px}
/* stats */
.utabs{display:grid;grid-template-columns:1fr 1fr;background:var(--card);border-bottom:1px solid var(--line)}
.utabs button{height:44px;font-size:15px;color:var(--mut);position:relative;font-weight:600}
.utabs button.on{color:var(--org)}.utabs button.on::after{content:"";position:absolute;left:18%;right:18%;bottom:0;height:3px;border-radius:2px;background:var(--org)}
.panel{background:var(--card);padding:14px 16px}
.chartbox{position:relative;height:230px}
.totline{display:flex;gap:18px;padding:12px 16px;background:var(--card);border-top:1px solid var(--line);font-size:15px;font-weight:600;color:var(--mut)}
.totline span b{color:var(--tx)}
.tbl{width:100%;border-collapse:collapse;background:var(--card);font-size:15px}
.tbl th{height:34px;background:var(--grp);color:var(--mut);font-size:12.5px;font-weight:600;padding:0 16px;text-align:right;white-space:nowrap}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl td{height:46px;padding:0 16px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
.tbl td:first-child{white-space:nowrap}
.dot{display:inline-block;width:10px;height:10px;border-radius:5px;margin-right:8px;vertical-align:0}
/* cards / rows */
.cardrow{display:flex;align-items:center;gap:12px;background:var(--card);padding:10px 16px;min-height:64px;width:100%;text-align:left;border-bottom:1px solid var(--line)}
.due{flex:none;width:44px;height:44px;border-radius:12px;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05}
.due b{font-size:18px}.due i{font-style:normal;font-size:12px;color:var(--mut)}
.pill{flex:none;font-size:13px;font-weight:700;padding:7px 12px;border-radius:15px;white-space:nowrap}
.pill.ok{background:rgba(22,167,101,.14);color:var(--inc)}
.pill.todo{background:var(--org);color:#fff}
.t1{font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.t2{font-size:13px;color:var(--mut);margin-top:2px}
.grp{border-bottom:1px solid var(--line)}.grp .cardrow{border-bottom:0}
.note{font-size:13px;color:var(--mut);padding:0 16px 12px;background:var(--card);line-height:1.5;word-break:break-word}
.foot{padding:10px 16px;font-size:13px;color:var(--mut)}
.assetsum{display:grid;grid-template-columns:1fr 1fr;background:var(--card);padding:14px 0;text-align:center;border-bottom:1px solid var(--line)}
.assetsum>div+div{border-left:1px solid var(--line)}
.assetsum b{display:block;font-size:20px}.assetsum span{font-size:12.5px;color:var(--mut)}
.bar3{height:6px;border-radius:3px;background:var(--grp);margin-top:6px;overflow:hidden}.bar3 i{display:block;height:100%;background:var(--inc)}
/* tab bar */
.tabbar{flex:none;z-index:20;background:var(--card);border-top:1px solid var(--line);padding-bottom:var(--sab)}
.tabbar .in{height:56px;display:grid;grid-template-columns:1fr 1fr 76px 1fr 1fr;align-items:center}
.tb{height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:12px;color:var(--mut)}
.tb .e{font-size:22px;filter:grayscale(1) opacity(.65);line-height:1.1}
.tb.on{color:var(--org);font-weight:600}.tb.on .e{filter:none}
.tb:active{opacity:.55}
.fab{justify-self:center;width:50px;height:50px;border-radius:25px;background:var(--org);color:#fff;font-size:34px;font-weight:300;line-height:1;display:grid;place-items:center;box-shadow:0 3px 10px rgba(249,155,29,.45)}
.fab:active{transform:scale(.92);background:var(--orgd)}
/* toast / banners */
#msg,#err{pointer-events:none;position:fixed;left:50%;transform:translateX(-50%);z-index:400;max-width:min(92vw,480px);padding:11px 16px;border-radius:14px;font-size:15px;display:none;box-shadow:0 8px 24px rgba(0,0,0,.3);line-height:1.4}
body.sheet-open #err{top:calc(8px + var(--sat))}
#msg{bottom:calc(76px + var(--sab));background:#1f3d2c;color:#9df0c1}
#err{top:calc(56px + var(--sat));background:#4a1a1d;color:#ffb3b0;width:max-content}
.a2hs{position:fixed;left:12px;right:12px;bottom:calc(68px + var(--sab));z-index:300;max-width:496px;margin:0 auto;background:var(--card);border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.28);padding:14px 14px 10px;border:1px solid var(--line)}
.a2hs b{display:block;font-size:16px;margin-bottom:2px}.a2hs p{margin:0 0 6px;font-size:14px;color:var(--mut);line-height:1.5}
.a2hs .go{display:block;margin-left:auto;height:44px;padding:0 18px;font-weight:700;color:var(--org)}
.a2hs::after{content:"";position:absolute;bottom:-8px;left:50%;margin-left:-8px;width:16px;height:16px;background:var(--card);transform:rotate(45deg);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
/* sheet */
#scrim{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.45);opacity:0;visibility:hidden;transition:opacity .28s,visibility .28s}
#scrim.on{opacity:1;visibility:visible}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:110;margin:0 auto;max-width:520px;max-height:94vh;display:flex;flex-direction:column;background:var(--bg);border-radius:18px 18px 0 0;transform:translateY(105%);visibility:hidden;transition:transform .32s cubic-bezier(.2,.8,.2,1),visibility .32s;overflow:hidden}
@supports(height:1dvh){#sheet{max-height:94dvh}}
#sheet.on{transform:none;visibility:visible}
#sheet.drag{transition:none}
.sh_head{flex:none;background:var(--org);color:#fff;display:grid;grid-template-columns:48px 1fr 64px;align-items:center;gap:6px;padding:8px 6px 8px 6px;touch-action:none}
.sh_head .x{width:44px;height:44px;font-size:20px;color:#fff}
.seg3{grid-column:2;display:flex;background:rgba(255,255,255,.25);border-radius:9px;padding:2px}
.seg3 button{flex:1;min-height:44px;border-radius:7px;font-size:15px;font-weight:700;color:#fff}
.seg3 button.on{background:#fff;color:var(--orgd)}
#sh_title{grid-column:2;text-align:center;font-weight:700;font-size:18px}
.vbtn{grid-column:3;grid-row:1;justify-self:end;height:44px;padding:0 10px;font-size:15px;font-weight:700;color:#fff}
.vbtn:active,.sh_head .x:active{opacity:.5}
.amtbox{flex:none;display:flex;justify-content:flex-end;align-items:baseline;gap:8px;padding:8px 20px;min-height:70px;background:var(--card);border-bottom:1px solid var(--line);overflow:hidden;touch-action:none}
.amtbox .flash{margin-right:auto;align-self:center;font-size:15px;font-weight:700;color:var(--inc);white-space:nowrap;opacity:0;transform:translateY(4px);transition:opacity .2s,transform .2s}
.amtbox .flash.on{opacity:1;transform:none}
.amtbox.pulse{animation:pulse .9s ease}
@keyframes pulse{0%{background:rgba(22,167,101,.22)}100%{background:var(--card)}}
.amtbox .cur{font-size:17px;color:var(--mut);font-weight:600}
#f_amt{font-size:44px;font-weight:700;letter-spacing:-1px;line-height:1.2;font-variant-numeric:tabular-nums;white-space:nowrap}
#f_amt.z{color:var(--mut);opacity:.5}
.amtbox.expense #f_amt:not(.z){color:var(--exp)}.amtbox.income #f_amt:not(.z){color:var(--inc)}
.sh_body{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:10px 12px 8px;-webkit-overflow-scrolling:touch}
.lbl{font-size:13px;color:var(--mut);margin:2px 4px 6px}
.cats{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.cat{min-height:64px;border-radius:12px;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:4px 0;font-size:12px;line-height:1.15;color:var(--mut);text-align:center;white-space:nowrap;border:2px solid transparent}
.cat .e{font-size:24px;line-height:1}
.cat:active{background:var(--press)}
.cat.on{border-color:var(--org);color:var(--tx);font-weight:600}
.subopt{display:grid;gap:6px}
.subopt button{display:flex;align-items:center;gap:12px;min-height:58px;padding:6px 14px;border-radius:12px;background:var(--card);text-align:left;border:2px solid transparent}
.subopt button .e{font-size:24px}.subopt button b{display:block;font-size:16px}.subopt button span{font-size:12.5px;color:var(--mut)}
.subopt button.on{border-color:var(--org)}
.chiprow{display:flex;align-items:center;gap:8px;margin-top:8px;overflow-x:auto;scrollbar-width:none}
.chiprow::-webkit-scrollbar{display:none}
.chiprow>.ic{flex:none;width:24px;text-align:center;font-size:18px}
.chip{position:relative;flex:none;display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 14px;border-radius:22px;background:var(--card);font-size:15px;white-space:nowrap;overflow:hidden;border:2px solid transparent;color:var(--tx)}
.chip.on{border-color:var(--org);color:var(--orgd);font-weight:700}
.chip:active{background:var(--press)}
.chip input[type=date]{position:absolute;inset:0;opacity:0;width:100%;height:100%;font-size:16px;cursor:pointer}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.fields input{min-height:44px;border-radius:12px;background:var(--card);padding:0 12px;font-size:16px;width:100%;min-width:0}
.fields input::placeholder{color:var(--mut);opacity:.7}
.readonly{margin:12px 4px 0;font-size:13px;color:var(--mut);line-height:1.6}
.keypad{flex:none;display:grid;grid-template-columns:repeat(3,1fr) 1.25fr;grid-template-rows:repeat(4,50px);gap:7px;padding:8px 12px calc(10px + var(--sab));background:var(--grp);border-top:1px solid var(--line)}
.keypad button{border-radius:10px;background:var(--key);font-size:23px;font-weight:600;display:grid;place-items:center;box-shadow:0 1px 0 rgba(0,0,0,.18)}
.keypad button:active{background:var(--keyd)}
.keypad .del{background:var(--keyd);font-size:20px}
.keypad .done{grid-column:4;grid-row:2/5;background:var(--org);color:#fff;font-size:20px;font-weight:700;box-shadow:none}
.keypad .done:active{background:var(--orgd)}.keypad .done:disabled{opacity:.55}
dialog{background:var(--card);color:var(--tx);border:0;border-radius:16px;width:min(84vw,330px);padding:20px 18px 14px}
dialog::backdrop{background:rgba(0,0,0,.5)}
#dlg_body{line-height:1.6;font-size:16px;text-align:center}
#dlg_body .mut{font-size:13.5px}
.dbtns{display:flex;gap:10px;margin-top:16px}
.dbtns button{flex:1;min-height:46px;border-radius:12px;font-weight:700;background:var(--bg)}
.dbtns button:active{opacity:.6}
.dbtns button#dlg_yes{background:var(--org);color:#fff}
.dbtns button#dlg_yes.danger{background:var(--exp)}
@media(min-width:560px){#sheet,#asheet{bottom:20px;border-radius:18px}}
/* accounts v2 */
.kkr{display:flex;align-items:center;gap:10px;background:var(--card);padding:10px 14px;border-bottom:1px solid var(--line)}

let Q=null,quoteBusy=false,quoteAt=0;
function applyLive(){
  if(!D)return;
  if(!D._raw)D._raw={t:{...(D.totals||{})},a:Object.fromEntries((D.accounts||[]).map(a=>[a.id,a.computed_balance])),h:(D.holdings||[]).map(h=>({mv:h.market_value,pnl:h.pnl}))};
  const R=D._raw;D.totals={...R.t};
  (D.accounts||[]).forEach(a=>{a.computed_balance=R.a[a.id];delete a._live;});
  (D.holdings||[]).forEach((h,i)=>{h.market_value=R.h[i].mv;h.pnl=R.h[i].pnl;delete h.live;});
  if(!Q)return;
  const delta={};
  (D.holdings||[]).forEach(h=>{
    const q=Q.quotes&&Q.quotes.find(x=>x.symbol===h.symbol&&x.account_name===h.account_name);
    if(!q){if(Q.err)h.live={fallback:true};return;}
    if(q.fallback){h.live={fallback:true};return;}
    const old=Number(h.market_value||0),mv=Number(q.market_value);
    h.market_value=mv;h.pnl=h.cost_total!=null?mv-Number(h.cost_total):null;
    h.live={price:q.price,kind:q.price_kind,quote_time:q.quote_time,source:q.source,stale:q.stale,bid:q.bid,ask:q.ask};
    delta[h.account_name]=(delta[h.account_name]||0)+(mv-old);
  });
  const T=D.totals;
  (D.accounts||[]).forEach(a=>{
    const d=delta[a.name];if(!d||a.computed_balance==null)return;
    a.computed_balance=Number(a.computed_balance)+d;a._live=true;if(a.archived)return;
    const asset=!['credit_card','loan_in'].includes(a.kind);
    if(a.counts_in_assets){T.net_worth=Number(T.net_worth||0)+d;if(['stock','investment'].includes(a.kind))T.investments_value=Number(T.investments_value||0)+d;else T.net_worth_excl_investments=Number(T.net_worth_excl_investments||0)+d;if(asset)T.total_assets=Number(T.total_assets||0)+d;}
    if(a.spendable&&asset)T.spendable_cash=Number(T.spendable_cash||0)+d;
  });
}

async function wakeTal(){
  let r,j=null;
  try{r=await fetch(URL_+'/functions/v1/kk-refresh',{method:'POST',headers:{'Content-Type':'application/json','x-kk-key':KEY},body:'{}',cache:'no-store'});j=await r.json().catch(()=>null);}catch(e){return {s:'net'};}
  if(j&&j.ok){kkrAt=Date.now();kkrUntil=kkrAt+120000;if(j.request_id!=null)repPendAdd(j.request_id,'refresh');return {s:'ok'};}

const LPMS=350,LPSLOP=8;let LPT=null,LPS=null;

function dragStart(){
  const s=LPS;LPT=null;LPS=null;if(!s||!document.body.contains(s.g)||DRAG)return;
  const g=s.g,rc=g.getBoundingClientRect();
  swS=null;if(swOpen)swClose();
  const gh=g.cloneNode(true);gh.classList.add('dghost');gh.style.left=rc.left+'px';gh.style.width=rc.width+'px';gh.style.top=rc.top+'px';
  document.body.appendChild(gh);g.classList.add('ph');document.body.classList.add('dragging');
  DRAG={g,gh,off:s.y-rc.top,y:s.y,raf:0};
  try{if(navigator.vibrate)navigator.vibrate(12);}catch(e){}
  try{const se=window.getSelection&&window.getSelection();if(se&&se.removeAllRanges)se.removeAllRanges();}catch(e){}
  dragLoop();
}
function dragLoop(){
  const d=DRAG;if(!d)return;
  const sc=$('scroll'),r=sc.getBoundingClientRect(),E=80,y=d.y;let v=0;
  if(y<r.top+E)v=-Math.ceil((r.top+E-y)/E*16);else if(y>r.bottom-E)v=Math.ceil((y-(r.bottom-E))/E*16);
  if(v)sc.scrollTop+=v;
  d.gh.style.top=(y-d.off)+'px';
  const g=d.g;
  for(let n=0;n<30;n++){
    const pv=g.previousElementSibling,nx=g.nextElementSibling;
    if(lpIs(pv)){const b=pv.getBoundingClientRect();if(y<b.top+b.height/2){g.parentNode.insertBefore(g,pv);continue;}}
    if(lpIs(nx)){const b=nx.getBoundingClientRect();if(y>b.top+b.height/2){g.parentNode.insertBefore(nx,g);continue;}}
    break;
  }
  d.raf=requestAnimationFrame(dragLoop);
}
function dragEnd(cancel){
  const d=DRAG;if(!d)return;cancelAnimationFrame(d.raf);
  const run=[];let e=d.g;while(lpIs(e.previousElementSibling))e=e.previousElementSibling;while(lpIs(e)){run.push(Number(e.dataset.gid));e=e.nextElementSibling;}

async function acctTxs(a){
  if(ATX.id===a.id&&Date.now()-ATX.at<30000)return ATX;
  const base=CUR||D.period_start,starts=[base,addMonths(base,-1),addMonths(base,-2)];
  const ls=await Promise.all(starts.map(x=>rpc('list_transactions',{p_period_start:x,p_include_void:false})));
  const seen=new Set(),list=[];ls.flat().forEach(t=>{if(seen.has(t.id))return;seen.add(t.id);if(t.account_name===a.name||t.to_account_name===a.name)list.push(t);});
  list.sort((x,y)=>new Date(y.occurred_at)-new Date(x.occurred_at));
  ATX={id:a.id,at:Date.now(),list,from:starts[2]};return ATX;
}
function effOn(t,a){
  if(t.voided_at||t.status==='pending')return 0;
  if(a.opening_date&&new Date(t.occurred_at)<new Date(a.opening_date))return 0;
  const m=Number(t.amount);
  if(t.type==='transfer')return (t.account_name===a.name?-m:0)+(t.to_account_name===a.name?m:0);
  if(t.type==='expense')return t.account_name===a.name?-m:0;
  return t.account_name===a.name?m:0;
}

/* ---------- 目標詳細頁（缺口、應收、撐幾個月、找外快） ---------- */
let OPPR={at:0,data:null,err:null};
async function loadOppr(force){
  if(!force&&OPPR.data&&Date.now()-OPPR.at<60000)return OPPR;
  try{const j=await rpc('opp_receivables',{});OPPR={at:Date.now(),data:j,err:null};}
  catch(e){OPPR={at:0,data:null,err:(e&&e.message)||'載入失敗'};}
  return OPPR;
}
const GL_MIN=5000,GL_PCT=0.1;   // 缺口 ≥ 5,000 元且 ≥ 目標的 10% 才顯示「找外快」
function goalCalc(){
  const cur=D.summary||{},tgt=Number(D.target)||0,inc=Number(cur.income)||0,exp=Number(cur.expense)||0;
  const gap=Math.max(tgt-inc,0),end=D.period_end,start=D.period_start,today=taipeiToday();
  const inPeriod=today>=start&&today<=end;
  const left=inPeriod?Math.round((new Date(end+'T00:00:00Z')-new Date(today+'T00:00:00Z'))/864e5)+1:0;
  const bal=inc-exp;
  const done=(D.recent_periods||[]).filter(p=>p.period_start<CUR&&Number(p.expense)>0).slice(0,3);
  const base=done.length?done.reduce((x,p)=>x+Number(p.expense),0)/done.length:exp;
  const cash=(D.totals||{}).spendable_cash;
  const min=Math.max(GL_MIN,tgt*GL_PCT);
  return {tgt,inc,exp,gap,end,start,left,bal,base,baseN:done.length,cash:cash==null?null:Number(cash),
    perDay:left>0?Math.floor(bal/left):null,perDayT:left>0?Math.floor((tgt-exp)/left):null,
    ask:left>0&&gap>=min,min};
}
function rcvItems(){return ((OPPR.data&&OPPR.data.items)||[]).filter(i=>!i.is_demo);}
function rcvHtml(c){
  if(OPPR.err)return '<div class="dmsg">應收清單載入失敗：'+esc(OPPR.err)+'<br><button type="button" class="dbtn n" id="gl_retry" style="margin-top:10px">再試一次</button></div>';
  if(!OPPR.data)return '<div class="dmsg">載入中…</div>';
  const items=rcvItems();
  let out='';
  if(!items.length){
    out='<div class="empty" style="min-height:150px"><div class="em">🧾</div><b>目前沒有應收款</b><span>接案進行中或已交件、還沒收到錢的案子，會列在這裡</span></div>';
  }else{
    out=items.map(i=>{
      const nm=esc(i.short_title||i.title||'未命名案子'),out_=i.outstanding_amount==null?null:Number(i.outstanding_amount);
      const st=i.status==='delivered'?'<span class="chp g">已交件</span>':'<span class="chp">進行中</span>';
      const dt=i.expected_pay_date?'預計 '+esc(String(i.expected_pay_date).slice(5).replace('-','/'))+' 入帳':'入帳日未定';
      return `<div class="rcv"><div class="m"><div class="t">${nm}</div><div class="s">${st}${i.signed?'<span class="chp o">已簽約</span>':''}${i.overdue?'<span class="chp r">已逾期</span>':''}<span>${dt}</span></div></div><div class="a">${out_==null?'<span class="mut" style="font-size:14px">金額未定</span>':nt(out_)}</div></div>`;}).join('');
  }
  const tot=items.reduce((x,i)=>x+(i.outstanding_amount==null?0:Number(i.outstanding_amount)),0);
  const conf=items.reduce((x,i)=>x+(i.signed===true&&i.outstanding_amount!=null?Number(i.outstanding_amount):0),0);
  const unk=items.filter(i=>i.outstanding_amount==null).length;
  if(items.length)out+=`<div class="gl_line"><div class="l">應收合計<small>確定（已簽約）${nt(conf)} 元${unk?'；另有 '+unk+' 筆金額未定，沒算進去':''}</small></div><div class="v">${nt(tot)}</div></div>`;
  const m=c.base>0&&c.cash!=null?c.cash/c.base:null,m2=c.base>0&&c.cash!=null?(c.cash+conf)/c.base:null;
  const f=x=>x==null?'—':(Math.round(x*10)/10).toFixed(1);
  out+=`<div class="run2"><div><b>${f(m)}</b><span>只算現金<br>撐幾個月</span></div><div><b>${f(m2)}</b><span>現金＋確定應收<br>撐幾個月</span></div></div>`;
  out+=`<div class="gl_note">算法：現金＝可動用現金 ${c.cash==null?'—':nt(c.cash)} 元；月支出＝${c.baseN?'最近 '+c.baseN+' 個完整週期的平均支出':'本期目前已花的支出（只有這一期的資料，之後會改用完整週期平均）'} ${nt(Math.round(c.base))} 元；確定應收＝已簽約案子的未收金額。撐幾個月＝錢 ÷ 月支出，沒扣信用卡和欠款。</div>`;
  return out;
}
function goalModel(){
  const c=goalCalc(),pct=c.tgt>0?Math.min(100,c.inc/c.tgt*100):0;
  const ps=D.period_start,pe=D.period_end,md=x=>Number(x.slice(5,7))+'/'+Number(x.slice(8,10));
  const gapTxt=c.gap>0?nt(c.gap):'已達標';
  let a=`<div class="dsum"><div class="dk">${md(ps)} – ${md(pe)} 的收入缺口</div><div class="dv gl_big num"${c.gap>0?' style="color:var(--exp)"':' style="color:var(--inc)"'}>${gapTxt}</div><div class="dm">月收入目標 ${nt(c.tgt)}，目前收入 ${nt(c.inc)}（${Math.round(pct)}%）</div></div><div class="gl_bar"><i style="width:${pct}%"></i></div>`;
  if(c.left>0){
    a+=`<div class="gl_line" style="margin-top:12px"><div class="l">到本期末還剩<small>今天到 ${md(pe)}（含今天）</small></div><div class="v">${c.left} 天</div></div>`;
    a+=`<div class="gl_line"><div class="l">${c.bal>=0?'每天還能花':'已經超支，每天要補'}<small>目前結餘 ${c.bal<0?'−':''}${nt(Math.abs(c.bal))}（收入 ${nt(c.inc)} − 支出 ${nt(c.exp)}）÷ ${c.left} 天</small></div><div class="v"${c.bal<0?' style="color:var(--exp)"':''}>${nt(Math.abs(c.perDay))}</div></div>`;
    if(c.gap>0)a+=`<div class="gl_line"><div class="l">缺口補滿的話，每天可花<small>收入補到目標 ${nt(c.tgt)}，扣掉已花 ${nt(c.exp)}，÷ ${c.left} 天</small></div><div class="v"${c.perDayT<0?' style="color:var(--exp)"':''}>${c.perDayT<0?'−':''}${nt(Math.abs(c.perDayT))}</div></div>`;
    a+='<div class="gl_note">週期是每月 10 號到隔月 9 號。「每天還能花」假設收入不再增加，只用目前的結餘算。</div>';
  }else{
    a+='<div class="gl_note" style="margin-top:8px">這一期已經結束（或還沒開始），所以不算每天還能花多少。</div>';
  }
  if(c.ask)a+=`<button type="button" class="glask" id="gl_ask">找外快補 ${nt(c.gap)} 元</button><div class="gl_note">缺口超過 ${nt(Math.round(c.min))} 元才會出現這顆鈕。按下去會先在塔塔泡泡裡填好訊息，讓你確認再送出。</div>`;
  else if(c.gap>0&&c.left>0)a+=`<div class="gl_note">缺口低於 ${nt(Math.round(c.min))} 元，先不用另外找外快。</div>`;
  const b=`<div class="gh"><span><b>應收清單</b>進行中與已交件、還沒收到的錢</span></div><div id="gl_rcv">${rcvHtml(c)}</div>`;
  return {title:'目標',html:a+b};
}

/* ---------- 塔塔回報：kk_reports_list（最新 10 筆）＋核對中（pending 存在這支手機） ---------- */
let REP=[],REP_OK=false,repBusy=false,repAgain=false,repMore=false,repFeat=null,repFeatSeen=null,repSig='';
const REP_EXP=new Set(),REP_HL={};
const PEND_K='kk_pending_reports',PEND_MAX=5,PEND_SLOW=600000,PEND_TTL=1800000;
function pendGet(){let a=[];try{a=JSON.parse(LS.get(PEND_K)||'[]');}catch(e){}if(!Array.isArray(a))a=[];const now=Date.now();return a.filter(p=>p&&p.id!=null&&Number(p.at)>now-PEND_TTL&&Number(p.at)<=now+60000).slice(-PEND_MAX);}
function pendSet(a){LS.set(PEND_K,JSON.stringify(a.slice(-PEND_MAX)));}
function repPendAdd(id,kind){   // seen：存入當下列表裡已有的回報 id，只有之後新出現、request_id 相同的回報才算等到
  const a=pendGet().filter(p=>String(p.id)!==String(id));a.push({id,kind,at:Date.now(),seen:REP.map(r=>r.id)});pendSet(a);repRender();
}
const repWhen=iso=>{const d=new Date(iso),hm=d.toLocaleTimeString('en-GB',{timeZone:'Asia/Taipei',hour:'2-digit',minute:'2-digit',hourCycle:'h23'});const k=dayKey(iso);return k===taipeiToday()?'今天 '+hm:Number(k.slice(5,7))+'/'+Number(k.slice(8))+' '+hm;};
const repKind=k=>k==='refresh'?'核對':k==='message'?'回覆你的訊息':'';
function repItem(r,pre){
  const you=r.request_text?String(r.request_text):'',yt=you.length>40?you.slice(0,40)+'…':you,op=REP_EXP.has(pre+r.id);
  return `<div class="rp_item${REP_HL[r.id]>Date.now()?' rp_hl':''}" data-rid="${esc(r.id)}"><div class="rp_meta"><span class="chp o">${esc(repKind(r.kind))}</span><span class="num">${esc(repWhen(r.created_at))}</span></div>`+
    `<div class="rp_t${op?'':' clp'}" data-rpx="${esc(pre+r.id)}">${esc(r.text)}</div><div class="rp_tog" data-rpx="${esc(pre+r.id)}" hidden>${op?'收起':'展開全文'}</div>`+
    (you?`<div class="rp_you">你說：${esc(yt)}</div>`:'')+`</div>`;
}
function repFold(root){   // 超過 4 行才可點；展開中的保留「收起」
  root.querySelectorAll('.rp_t').forEach(t=>{const k=t.dataset.rpx,op=REP_EXP.has(k),long=op||t.scrollHeight>t.clientHeight+1;t.classList.toggle('can',long);if(long){t.setAttribute('role','button');t.tabIndex=0;t.setAttribute('aria-expanded',String(op));}const g=t.nextElementSibling;if(g&&g.classList.contains('rp_tog'))g.hidden=!long;});
}
function repRender(){
  const box=$('rep');if(!box)return;
  const P=pendGet(),now=Date.now();
  if(!REP_OK&&!P.length){box.hidden=true;return;}
  const busy=P.some(p=>now-p.at<PEND_SLOW);
  let top=REP[0]||null;
  if(repFeat!=null){const f=REP.find(r=>String(r.id)===String(repFeat));if(f&&!REP.some(r=>!repFeatSeen.has(String(r.id))))top=f;else{repFeat=null;repFeatSeen=null;}}
  const rest=top?REP.filter(r=>r!==top):[];
  const sig=JSON.stringify([REP.map(r=>r.id),top&&top.id,P.map(p=>[p.id,p.kind,now-p.at<PEND_SLOW?0:Math.floor((now-p.at)/60000)]),repMore,[...REP_EXP],Object.keys(REP_HL).filter(k=>REP_HL[k]>now)]);
  if(sig===repSig&&!box.hidden)return;repSig=sig;
  const wait=P.map(p=>{const m=Math.floor((now-p.at)/60000);return `<div class="rp_wait">${now-p.at<PEND_SLOW?(p.kind==='message'?'已傳給塔塔，等他回覆':'已叫醒塔塔，等他核對完回報'):'塔塔還沒回報（已等 '+m+' 分鐘）'}</div>`;}).join('');
  box.innerHTML=`<div class="gh"><span><b>塔塔回報</b>${busy?'<span class="rp_busy" id="rep_busy"><i class="rp_spin" aria-hidden="true"></i>核對中…</span>':''}</span>${rest.length?`<button type="button" class="gbtn g2" id="rep_more" aria-expanded="${repMore}">${repMore?'收起':'更多'}</button>`:''}</div>`+
    wait+(top?repItem(top,'m'):'<div class="rp_none">塔塔還沒有回報</div>')+(repMore&&rest.length?'<div class="rp_more">'+rest.map(r=>repItem(r,'m')).join('')+'</div>':'');
  box.hidden=false;repFold(box);
}
async function repLoad(){
  if(KEY.length<20)return;
  if(repBusy){repAgain=true;return;}repBusy=true;
  try{
    const j=await rpc('kk_reports_list',{p_limit:10});
    if(Array.isArray(j)){
      REP=j.slice().sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));REP_OK=true;
      let P=pendGet();const left=[];
      P.forEach(p=>{const seen=new Set((p.seen||[]).map(String)),hit=REP.find(r=>r.request_id!=null&&String(r.request_id)===String(p.id)&&!seen.has(String(r.id)));
        if(!hit){left.push(p);return;}
        REP_HL[hit.id]=Date.now()+3000;repFeat=hit.id;repFeatSeen=new Set(REP.map(r=>String(r.id)));setTimeout(()=>{repSig='';repRender();ttRepShow();},3050);
        if(ttWait!=null&&String(ttWait)===String(p.id))ttRep=hit;});
      if(left.length!==P.length)pendSet(left);
      repRender();ttRepShow();
    }
  }catch(e){}
  finally{repBusy=false;if(repAgain){repAgain=false;repLoad();}}
}
$('rep').addEventListener('click',ev=>{
  if(ev.target.closest('#rep_more')){repMore=!repMore;repRender();return;}
  const t=ev.target.closest('.rp_t.can,.rp_tog');if(!t)return;const k=t.dataset.rpx;if(REP_EXP.has(k))REP_EXP.delete(k);else REP_EXP.add(k);repRender();
});
$('rep').addEventListener('keydown',ev=>{if((ev.key==='Enter'||ev.key===' ')&&ev.target.matches('.rp_t.can')){ev.preventDefault();ev.target.click();}});
if(window.ResizeObserver){let rw=-1;new ResizeObserver(es=>{const w=Math.round(es[0].contentRect.width);if(w===rw)return;rw=w;requestAnimationFrame(()=>{if(!$('rep').hidden)repFold($('rep'));});}).observe($('rep'));}   // 版面出來或寬度改變時重新判斷要不要折疊
setInterval(()=>{const a=pendGet();if(a.length!==(JSON.parse(LS.get(PEND_K)||'[]')||[]).length)pendSet(a);if(a.length||REP_OK)repRender();},20000);   // 「已等 N 分鐘」與 30 分鐘丟掉
/* 泡泡內：送出成功後等對應回報；泡泡關掉就不顯示 */
let ttWait=null,ttRep=null;
function ttWaitSet(id){ttWait=id;ttRep=null;REP_EXP.forEach(k=>{if(k[0]==='b')REP_EXP.delete(k);});ttRepShow();}
function ttRepShow(){
  const e=$('ttb_rep');if(!e)return;
  if(ttWait==null||$('ttb').hidden){e.hidden=true;e.innerHTML='';return;}
  e.innerHTML='<div class="rp_hint">回覆會出現在首頁「塔塔回報」</div>'+(ttRep?repItem(ttRep,'b'):'');
  e.hidden=false;repFold(e);ttPlace();
}
$('ttb_rep').addEventListener('click',ev=>{const t=ev.target.closest('.rp_t.can,.rp_tog');if(!t)return;const k=t.dataset.rpx;if(REP_EXP.has(k))REP_EXP.delete(k);else REP_EXP.add(k);ttRepShow();});
repRender();

function normalizeUrl(){ // keep the token in ?k= too: iOS keeps the query but can drop the #hash when launching from the home screen
  try{if(KEY_FROM_URL||KEY)history.replaceState(null,'',document.querySelector('base')?'/k/'+encodeURIComponent(KEY)+'/':location.pathname+'?k='+encodeURIComponent(KEY));}catch(e){}
  keyManifest();
}
// 主畫面圖示跟 Safari 的儲存空間分開：把金鑰放進 manifest 的 start_url，加入主畫面後一點就能用，不用再貼連結
function keyManifest(){
  if(KEY.length<20)return;
  try{const root=new URL('./',location.origin+location.pathname.replace(/\/k\/[^/]+\/?$/,'/'));const abs=u=>new URL(u,root).href;
    const m={name:'塔塔記帳',short_name:'塔塔記帳',description:'Borry 的共用記帳本',lang:'zh-Hant',display:'standalone',orientation:'portrait',background_color:'#f2f2f7',theme_color:'#f99b1d',
      id:root.pathname,scope:root.href,start_url:abs('./?k='+encodeURIComponent(KEY)),
      icons:[{src:abs('icon-192.png?v=20261116f'),sizes:'192x192',type:'image/png'},{src:abs('icon-512.png?v=20261116f'),sizes:'512x512',type:'image/png'},{src:abs('icon-maskable-512.png?v=20261116f'),sizes:'512x512',type:'image/png',purpose:'maskable'}]};
    const l=document.querySelector('link[rel=manifest]');if(l)l.href='data:application/manifest+json;charset=utf-8,'+encodeURIComponent(JSON.stringify(m));
  }catch(e){}
}

if('serviceWorker' in navigator&&window.isSecureContext){
  {const had=!!navigator.serviceWorker.controller;let done=false;navigator.serviceWorker.addEventListener('controllerchange',()=>{if(!had||done)return;done=true;if($('sheet').classList.contains('on'))return;location.reload();});}   // an old worker was replaced: reload once so the page runs under the new one
  navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(r=>{try{r.update().catch(()=>{});}catch(e){}}).catch(()=>{});}

showTab('list');

if(KEY.length<20){window.__kkReady=true;$('gate').innerHTML=needLinkHtml();}
else{

  load();

}
